name: Generate Audio SFX

on:
  workflow_dispatch:  # manual trigger only

jobs:
  generate-sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create output directories
        run: |
          mkdir -p assets/audio/sfx assets/audio/music

      - name: Download music from SoundSafari/CC0-1.0-Music
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/download-music.js

      - name: Generate SFX via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-sfx.js

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/
          if git diff --staged --quiet; then
            echo "No new SFX generated (all skipped or failed)"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "Generate ElevenLabs SFX assets (${COUNT} files)"
            git pull --rebase origin HEAD
            git push origin HEAD
          fi
