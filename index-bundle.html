          const key = `${at.col},${at.row}`;
          if (!highlighted.has(key)) {
            highlighted.add(key);
            const { x, y } = this._tileTL(at.col, at.row);
            g.fillStyle(0xff2222, 0.25);
            g.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
          }
        });
      });
    });
    this._dangerZoneActive = true;
  }

  _clearDangerZone() {
    if (this._dangerGfx) {
      this._dangerGfx.destroy();
      this._dangerGfx = null;
    }
    this._dangerZoneActive = false;
  }

  toggleDangerZone() {
    if (this._dangerZoneActive) {
      this._clearDangerZone();
    } else {
      this._showAllEnemyRanges();
    }
  }

  // ============================================================================
  // PAIR-UP mechanic
  // ============================================================================

  onActionPairUp(ally) {
    const carrier = this._selected;
    if (!carrier || !ally || ally.isPaired) return;
    if (carrier.team !== 'player' || ally.team !== 'player') return;

    // Pair: ally rides on carrier
    carrier.passenger = ally;
    ally.isPaired     = true;
    ally.hasActed     = true; // paired unit cannot act independently this turn

    // Stat bonuses to carrier: +floor(ally.def/2) DEF, +1 MOV (capped at 8)
    carrier._pairDefBonus = Math.floor((ally.def || 0) / 2);
    carrier._pairMovBonus = 1;

    // Visual: fade ally sprite to show it's mounted
    if (ally.sprite)   this.tweens.add({ targets: ally.sprite,   alpha: 0.0, duration: 300 });
    if (ally.spriteBg) this.tweens.add({ targets: ally.spriteBg, alpha: 0.0, duration: 300 });
    // Move ally to same tile as carrier (visually paired)
    ally.col = carrier.col;
    ally.row = carrier.row;

    // Show a small indicator on carrier
    this._showPairBadge(carrier);

    // End turn for the carrier too (pair-up counts as using the turn)
    carrier.hasActed = true;
    this._getUI()?.hideActionMenu();
    this._getUI()?.updateUnitInfo(carrier);
    this._clearHighlights();
    this._setState(BS.IDLE);
    this._dimActedUnits();
  }

  onActionSeparate(carrier) {
    if (this._state === BS.VICTORY || this._state === BS.DEFEAT || this._state === BS.ANIMATING) return;
    const passenger = carrier?.passenger;
    if (!carrier || !passenger) return;

    // Find an empty adjacent tile to place the passenger
    const dirs = [{dc:0,dr:-1},{dc:1,dr:0},{dc:0,dr:1},{dc:-1,dr:0}];
    let placed = false;
    for (const {dc, dr} of dirs) {
      const nc = carrier.col + dc, nr = carrier.row + dr;
      if (nc < 0 || nr < 0) continue;
      if (nr >= this.mapGrid.length || nc >= this.mapGrid[0].length) continue;
      const tileVal = this.mapGrid[nr][nc];
      if (tileVal === 10 || tileVal === 3) continue; // wall or water
      const occupied = this.units.find(u => !u.dead && u.col === nc && u.row === nr && u !== passenger);
      if (occupied) continue;
      // Place passenger here
      passenger.col = nc;
      passenger.row = nr;
      placed = true;
      break;
    }
    if (!placed) {
      // No adjacent tile — can't separate right now
      this._getUI()?.showMessage('No room to separate!');
      return;
    }

    // Remove pair bond
    passenger.isPaired      = false;
    passenger.hasActed      = false; // give passenger a chance to act after separating
    carrier.passenger       = null;
    carrier._pairDefBonus   = 0;
    carrier._pairMovBonus   = 0;

    // Restore passenger sprite
    if (passenger.sprite) {
      const { x, y } = this._tileCenter(passenger.col, passenger.row);
      passenger.sprite.setAlpha(1).setPosition(x, y);
    }
    if (passenger.spriteBg) {
      const { x: bx, y: by } = this._tileTL(passenger.col, passenger.row);
      passenger.spriteBg.setAlpha(1).setPosition(bx, by);
    }

    // Remove pair badge
    if (carrier._pairBadge) { carrier._pairBadge.destroy(); carrier._pairBadge = null; }

    this._getUI()?.hideActionMenu();
    this._getUI()?.updateUnitInfo(carrier);
    this._setState(BS.IDLE);
    this._dimActedUnits();
  }

  _showPairBadge(carrier) {
    if (carrier._pairBadge) carrier._pairBadge.destroy();
    const { x: cx, y: cy } = this._tileCenter(carrier.col, carrier.row);
    carrier._pairBadge = this.add.text(cx + 10, cy - 14, '👫', {
      fontSize: '10px',
    }).setOrigin(0.5).setDepth(12);
  }

  _getPairDefBonus(unit) {
    return unit._pairDefBonus || 0;
  }

  _getPairMovBonus(unit) {
    return unit._pairMovBonus || 0;
  }
}

  _showSkillInfo(unit) {
    if (!unit || !unit.skills || unit.skills.length === 0) return;
    const W = GAME_W, H = GAME_H;

    // Dark overlay
    const overlay = this.add.graphics().setDepth(200);
    overlay.fillStyle(0x000000, 0.7);

    const popW = W - 32, popH = Math.min(unit.skills.length * 90 + 80, H - 80);

      const rangeStr = sk.range ? `Range: ${sk.range}` : '';

      const statsLine = [powerStr, rangeStr, mpStr].filter(Boolean).join('  •  ');

      const nameT = this.add.text(popX + 16, sy, `${sk.name}`, {

  _buildActionMenu() {
    this._actionMenu = this.add.container(0, 0).setVisible(false);

    const W = GAME_W;
    const BAR_Y = 682;
    const BAR_H = 38;
    const btnW = W / 5;          //  96 px each (480/5)
    const btnH = BAR_H;          // full bar height
    const btnY = BAR_Y;

    const btnData = [
      { key: 'atk',    label: 'Attack',   color: 0x223355, hi: 0x335588 },
      { key: 'mag',    label: 'Skill',    color: 0x223355, hi: 0x335588 },
      { key: 'item',   label: 'Item',     color: 0x223355, hi: 0x335588 },
      { key: 'wait',   label: 'Wait',     color: 0x223355, hi: 0x335588 },

      { key: 'pairup', label: 'Pair Up',  color: 0x1a3344, hi: 0x2a5566, slot: 0 },
      { key: 'sep',    label: 'Separate', color: 0x2a1a44, hi: 0x4a2a66, slot: 1 },

    this._actionBtns = {};
    btnData.forEach((b, i) => {
      const x = (b.slot !== undefined ? b.slot : i) * btnW;

      const bg = this.add.graphics();

      const drawNormal = () => {
        bg.clear();
        bg.fillStyle(b.color, 1);
        bg.fillRect(x, btnY, btnW - 1, btnH); // 1px gap between buttons
        // subtle top-highlight
        bg.fillStyle(0x4455aa, 1);
        bg.fillRect(x, btnY, btnW - 1, 1);
      };
      const drawHover = () => {
        bg.clear();
        bg.fillStyle(b.hi, 1);
        bg.fillRect(x, btnY, btnW - 1, btnH);
        bg.fillStyle(0x6677cc, 1);
        bg.fillRect(x, btnY, btnW - 1, 1);
      };
      drawNormal();

      const txt = this.add.text(x + btnW / 2, btnY + btnH / 2, b.label, {
        fontSize: '18px', color: '#aabbff',
        fontFamily: 'Nunito, Arial, sans-serif',

        stroke: '#000022',

      }).setOrigin(0.5);

      const zone = this.add.zone(x + btnW / 2, btnY + btnH / 2, btnW - 1, btnH)
        .setInteractive({ useHandCursor: true });

      zone.on('pointerover',  () => drawHover());
      zone.on('pointerout',   () => drawNormal());
      zone.on('pointerdown', () => {
        AudioManager.play(this, 'cursor_move');
        this.tweens.add({ targets: txt, scaleX: 0.9, scaleY: 0.9, duration: 80, yoyo: true });
        this._onActionBtn(b.key);
      });

      // pairup and sep start hidden; shown only when applicable
      const startsHidden = b.key === 'pairup' || b.key === 'sep';
      if (startsHidden) {
        bg.setVisible(false);
        txt.setVisible(false);
        zone.disableInteractive();
      }

      this._actionMenu.add([bg, txt, zone]);
      this._actionBtns[b.key] = { bg, txt, zone, bData: b, x, y: btnY, w: btnW, h: btnH, drawNormal, drawHover };

  _onActionBtn(key) {
    const bs = this._battle;
    if (!bs) return;
    switch (key) {
      case 'atk':  bs.onActionAttack(); break;
      case 'mag':  bs.onActionMagic();  break;
      case 'item': {
        const unit = this._selectedUnit;
        if (unit && unit.items.length > 1) {
          this.showItemMenu(unit, bs);
        } else {
          bs.onActionItem();
        }
        break;
      }
      case 'wait': bs.onActionWait();   break;
      case 'undo': bs.onActionCancel?.();  break;
      case 'pairup': {
        const adj = this._getAdjacentAlly(bs);
        if (adj) bs.onActionPairUp(adj);
        break;
      }
      case 'sep':
        bs.onActionSeparate(this._selectedUnit);
        break;
    }
    // Menu visibility is managed entirely by BattleScene action methods —
    // do NOT auto-hide here, so a failed action (e.g. no targets) keeps the
    // menu open and the player isn't left with no way to act.
  }

  _getAdjacentAlly(bs) {
    const unit = this._selectedUnit;
    if (!unit || !bs) return null;
    const dirs = [{dc:0,dr:-1},{dc:1,dr:0},{dc:0,dr:1},{dc:-1,dr:0}];
    return bs.units.find(u =>
      !u.dead && !u.isPaired && u.team === 'player' && u !== unit &&
      dirs.some(({dc, dr}) => u.col === unit.col + dc && u.row === unit.row + dr)
    ) || null;

  _buildEndTurnBtn() {
    const BAR_Y = 682;

      stroke: '#001133',

    zone.on('pointerover', () => {

  // ==========================================================================
  // MUTE TOGGLE BUTTON — compact, top-right above bar
  // ==========================================================================

  _buildMuteBtn() {
    const BAR_Y = 682;
    const BAR_H = 38;
    const w = 30, h = 30;
    // Sit just left of the END TURN button
    const endX = GAME_W - 66 - 4;
    const x = endX - w - 4;
    const y = BAR_Y - h - 4;

    const bg = this.add.graphics();
    bg.fillStyle(0x113344, 1);
    bg.fillRoundedRect(x, y, w, h, 6);
    bg.lineStyle(1, 0x2266aa, 0.9);
    bg.strokeRoundedRect(x, y, w, h, 6);

    const isMuted = () => {
      const bs = this.scene.get('BattleScene');

      bg.clear();
      bg.fillStyle(0x2255aa, 1);

    zone.on('pointerout', () => {
      bg.clear();
      bg.fillStyle(0x113344, 1);
      bg.fillRoundedRect(x, y, w, h, 6);

      if (bs) {

        txt.setText(bs.sound.mute ? '🔇' : '🔊');
      }
      this.tweens.add({ targets: txt, scaleX: 0.85, scaleY: 0.85, duration: 80, yoyo: true });
    });

    this._muteBtn = { bg, txt, zone };
  }


  // ==========================================================================
  // DANGER ZONE TOGGLE BUTTON — compact, left of mute button
  // ==========================================================================

  _buildDangerBtn() {
    const BAR_Y = 682;
    const BAR_H = 38;
    const w = 52, h = 30;
    // Sit just left of the MUTE button
    const muteX = GAME_W - 66 - 4 - 30 - 4; // 376
    const x = muteX - w - 4;                  // 320
    const y = BAR_Y - h - 4;                  // 648

    this._dangerOn = false;

    const bg = this.add.graphics();
    const drawBg = (on) => {
      bg.clear();
      bg.fillStyle(on ? 0x661111 : 0x113344, 1);
      bg.fillRoundedRect(x, y, w, h, 6);
      bg.lineStyle(1, on ? 0xff4444 : 0x2266aa, 0.9);
      bg.strokeRoundedRect(x, y, w, h, 6);
    };
    drawBg(false);

    const txt = this.add.text(x + w / 2, y + h / 2, '⚠ DANGER', {
      fontSize: '10px', color: '#ff8888',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
    }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    const zone = this.add.zone(x + w / 2, y + h / 2, w, h).setInteractive({ useHandCursor: true });
    zone.on('pointerover', () => {
      bg.clear();
      bg.fillStyle(this._dangerOn ? 0x881111 : 0x1a3a55, 1);
      bg.fillRoundedRect(x, y, w, h, 6);
      bg.lineStyle(1, this._dangerOn ? 0xff6666 : 0x3388cc, 0.9);
      bg.strokeRoundedRect(x, y, w, h, 6);
    });
    zone.on('pointerout', () => {
      drawBg(this._dangerOn);
    });
    zone.on('pointerdown', () => {
      this._dangerOn = !this._dangerOn;
      drawBg(this._dangerOn);
      txt.setColor(this._dangerOn ? '#ffaaaa' : '#ff8888');
      this.tweens.add({ targets: txt, scaleX: 0.9, scaleY: 0.9, duration: 80, yoyo: true });
      const bs = this.scene.get('BattleScene');
      if (bs && typeof bs.toggleDangerZone === 'function') bs.toggleDangerZone();
    });

    this._dangerBtn = { bg, txt, zone };
  }

  // ==========================================================================
  // TURN BANNER
  // ==========================================================================

  _buildTurnBanner() {
    const W = GAME_W;
    this._bannerBg = this.add.graphics().setVisible(false);
    this._bannerTxt = this.add.text(W / 2, GAME_H / 2 - 30, '', {
      fontFamily: 'Nunito, Georgia, serif',
      fontSize: '38px',
      fontStyle: 'bold',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 5,
    }).setOrigin(0.5).setVisible(false);
  }

  showTurnBanner(text, color) {
    const W = GAME_W;
    this._bannerBg.setVisible(true);
    this._bannerTxt.setVisible(true);
    this._bannerBg.clear();
    this._bannerBg.fillStyle(0x000000, 0.6);
    this._bannerBg.fillRect(0, GAME_H / 2 - 60, W, 80);
    this._bannerBg.lineStyle(2, color, 0.8);
    this._bannerBg.lineBetween(0, GAME_H / 2 - 60, W, GAME_H / 2 - 60);
    this._bannerBg.lineBetween(0, GAME_H / 2 + 20, W, GAME_H / 2 + 20);

    this._bannerTxt.setText(text);
    this._bannerTxt.setStyle({ color: '#' + color.toString(16).padStart(6, '0') });

    this._bannerBg.setAlpha(1);
    this._bannerTxt.setAlpha(1);

    this.tweens.add({
      targets: [this._bannerBg, this._bannerTxt],
      alpha: 0,
      duration: 600,
      delay: 900,
      onComplete: () => {
        this._bannerBg.setVisible(false);
        this._bannerTxt.setVisible(false);
      },
    });

    // Update turn / phase labels in the bottom bar
    const bn = this._battle;
    if (bn) {
      this._turnLabel?.setText(`TURN ${bn.turnNumber}`);
      this._phaseLabel?.setText(bn.playerTurn ? 'YOUR TURN' : 'ENEMY TURN');
      this._phaseLabel?.setStyle({ color: bn.playerTurn ? '#4488ff' : '#ff4444' });
    }

    // M3: Objective banner
    this._updateObjective();
  }

  _updateObjective() {
    if (!this._battle) return;
    const bn = this._battle;
    if (!this._objectiveLabel) return;
    const chapter = typeof CHAPTERS !== 'undefined' ? CHAPTERS[bn.chapterId - 1] : null;
    const obj = chapter?.objective;
    if (obj === 'survive_turns') {
      // MED-4: turnNumber is incremented during enemy turn — show the player-facing turn number
      const playerTurnNum = bn.playerTurn ? bn.turnNumber : bn.turnNumber - 1;
      const done = playerTurnNum >= chapter.surviveTurns;
      const txt = done
        ? 'Objective: Survived! 🐾'
        : `Objective: Survive ${chapter.surviveTurns} turns  [${playerTurnNum}/${chapter.surviveTurns}]`;
      const col = done ? '#44ff88' : '#aaddff';
      this._objectiveLabel.setText(txt).setStyle({ color: col }).setVisible(true);
    } else if (obj === 'seize_tile') {
      this._objectiveLabel.setText('Objective: Seize the throne! 👑').setStyle({ color: '#f8d030' }).setVisible(true);
    } else if (obj === 'escort_vip') {
      this._objectiveLabel.setText('Objective: Escort VIP to safety! 🐕').setStyle({ color: '#88eeaa' }).setVisible(true);
    } else if (obj === 'defeat_boss' || chapter?.bossId) {
      // LOW-6: restore underscore-to-space for boss name display
      const bossName = (chapter?.bossId || 'the boss').replace(/_/g, ' ');
      this._objectiveLabel.setText(`Objective: Defeat ${bossName}`).setStyle({ color: '#ffcc44' }).setVisible(true);
    } else {
      this._objectiveLabel.setVisible(false);
    }
  }

  // ==========================================================================
  // UNIT INFO  — populates the floating top-right panel
  // ==========================================================================

  showUnitInfo(unit) {
    if (!unit) { this.clearUnitInfo(); return; }

    const FP = this._FP;

    // Draw / redraw the floating panel background
    this._fpBg.clear();
    this._fpBg.fillStyle(0x000000, 0.75);
    this._fpBg.fillRoundedRect(FP.x, FP.y, FP.w, FP.h, 6);
    this._fpBg.lineStyle(2, 0xf8d030, 1);
    this._fpBg.strokeRoundedRect(FP.x, FP.y, FP.w, FP.h, 6);
    this._fpBg.setVisible(true);

    // Portrait — 40x40 at top-left of panel
    const portraitKey = `portrait_${unit.id}`;
    if (this._portraitImg && this.textures.exists(portraitKey)) {
      this._portraitImg
        .setTexture(portraitKey)
        .setDisplaySize(40, 40)
        .setPosition(FP.x + 6, FP.y + 6)
        .setVisible(true);
      this._unitEmojiTxt?.setVisible(false);
    } else {
      this._portraitImg?.setVisible(false);
      this._unitEmojiTxt
        ?.setPosition(FP.x + 6 + 20, FP.y + 6 + 20)
        .setText(unit.emoji)
        .setVisible(true);
    }

    // Unit name
    const promoted = unit.promoted ? '★' : '';
    const nameColor = unit.team === 'player' ? '#f8d030' : '#ff8888';
    this._unitNameTxt
      ?.setText(`${unit.name}${promoted}`)
      .setStyle({ color: nameColor })
      .setPosition(FP.x + 52, FP.y + 6)
      .setVisible(true);

    // Class + level
    this._unitClassTxt
      ?.setText(`${unit.unitClass}  •  Lv ${unit.level}`)
      .setPosition(FP.x + 52, FP.y + 22)
      .setVisible(true);

    // Stats row
    this._unitStatsTxt
      ?.setText(`ATK:${unit.atk}  DEF:${unit.def}  MOV:${unit.mov}  AGI:${unit.agi}`)
      .setPosition(FP.x + 52, FP.y + 34)
      .setVisible(true);
    this._unitStats2Txt?.setText('').setVisible(false);

    // HP  -----------------------------------------------------------------
    const hpRatio  = Math.max(0, unit.hp / unit.maxHp);
    const hpColor  = hpRatio > 0.5 ? '#44cc66' : hpRatio > 0.25 ? '#ffcc00' : '#ff4444';
    const hpColor2 = hpRatio > 0.5 ? 0x38c864  : hpRatio > 0.25 ? 0xf8d030  : 0xc83030;
    const barX = FP.x + 25;   // after "HP" label
    const barW = FP.w - 31;   // leaves room for fraction on right
    const hpBarY = FP.y + 54;

    this._hpLabel?.setPosition(FP.x + 6, FP.y + 60).setVisible(true);

    this._hpBarBg?.clear();
    this._hpBarBg?.fillStyle(0x333333, 1);
    this._hpBarBg?.fillRoundedRect(barX, hpBarY, barW, 12, 4);
    this._hpBarBg?.setVisible(true);

    this._hpBarFg?.clear();
    this._hpBarFg?.fillStyle(hpColor2, 1);
    this._hpBarFg?.fillRoundedRect(barX, hpBarY, Math.max(4, barW * hpRatio), 12, 4);
    this._hpBarFg?.setVisible(true);

    this._unitHpTxt
      ?.setText(`${unit.hp}/${unit.maxHp}`)
      .setStyle({ color: '#ffffff', stroke: '#000000', strokeThickness: 2, fontSize: '12px', fontStyle: 'bold' })
      .setPosition(FP.x + FP.w - 6, FP.y + 60)
      .setVisible(true);

    // MP  -----------------------------------------------------------------
    const mpBarY  = FP.y + 72;
    const mpRatio = (unit.maxMp > 0) ? Math.max(0, unit.mp / unit.maxMp) : 0;

    this._mpBarBg?.clear();
    this._mpBarFg?.clear();

    if (unit.maxMp > 0) {
      this._mpLabel?.setPosition(FP.x + 6, FP.y + 78).setVisible(true);

      this._mpBarBg?.fillStyle(0x333333, 1);
      this._mpBarBg?.fillRoundedRect(barX, mpBarY, barW, 12, 4);
      this._mpBarBg?.setVisible(true);

      this._mpBarFg?.fillStyle(0x4466ff, 1);
      this._mpBarFg?.fillRoundedRect(barX, mpBarY, Math.max(2, barW * mpRatio), 12, 4);
      this._mpBarFg?.setVisible(true);

      this._mpTxt
        ?.setText(`${unit.mp}/${unit.maxMp}`)
        .setPosition(FP.x + FP.w - 6, FP.y + 78)
        .setVisible(true);
    } else {
      this._mpLabel?.setVisible(false);
      this._mpBarBg?.setVisible(false);
      this._mpBarFg?.setVisible(false);
      this._mpTxt?.setVisible(false);
    }

    // EXP  -----------------------------------------------------------------
    const expBarY = FP.y + 86;
    const expVal  = unit.team === 'player' ? (unit.exp || 0) : -1;

    this._expBarBg?.clear();
    this._expBarFg?.clear();

    if (expVal >= 0) {
      const expRatio = Math.min(1, expVal / 100);
      this._expLabel?.setPosition(FP.x + 6, FP.y + 92).setVisible(true);
      this._expBarBg?.fillStyle(0x333333, 1);
      this._expBarBg?.fillRoundedRect(barX, expBarY, barW, 8, 3);
      this._expBarBg?.setVisible(true);
      this._expBarFg?.fillStyle(0xddcc00, 1);
      this._expBarFg?.fillRoundedRect(barX, expBarY, Math.max(2, barW * expRatio), 8, 3);
      this._expBarFg?.setVisible(true);
      this._expTxt?.setText(`${expVal}/100`).setPosition(FP.x + FP.w - 6, FP.y + 92).setVisible(true);
    } else {
      this._expLabel?.setVisible(false);
      this._expBarBg?.setVisible(false);
      this._expBarFg?.setVisible(false);
      this._expTxt?.setVisible(false);
    }

    // Status effect icons  ------------------------------------------------
    const icons = [];
    if (unit.guardActive)  icons.push({ icon: '🛡', label: ' Guard', color: '#88aaff' });
    if (unit.burnStacks > 0) icons.push({ icon: '🔥', label: ` ×${unit.burnStacks}`, color: '#ff8844' });

    [this._statusIcon1, this._statusIcon2].forEach((txt, i) => {
      if (!txt) return;
      if (icons[i]) {
        txt.setText(icons[i].icon + icons[i].label)
          .setColor(icons[i].color)
          .setVisible(true);
      } else {
        txt.setVisible(false);
      }
    });

    // Veteran history
    const battles = unit.battlesParticipated || 0;
    const kills   = unit.killCount || 0;
    const vetStr  = battles > 0 ? `⚔ ${kills} KO · ${battles} battles` : '';
    const vetColor = kills >= 10 ? '#ffd700' : kills >= 5 ? '#ff9944' : '#aabbcc';
    this._unitVetTxt
      ?.setText(vetStr)
      .setStyle({ color: vetColor })
      .setPosition(FP.x + 6, FP.y + 120)
      .setVisible(true);

    // Skill chips  --------------------------------------------------------
    this._skillsTxt?.setVisible(false);
    this._drawSkillChips(unit);

    // Update turn label
    if (this._battle) {
      this._turnLabel?.setText(`TURN ${this._battle.turnNumber}`);
    }
  }

  clearUnitInfo() {
    // Hide all floating panel elements
    this._fpBg?.setVisible(false);
    this._portraitImg?.setVisible(false);
    this._unitEmojiTxt?.setVisible(false);
    this._unitNameTxt?.setVisible(false);
    this._unitClassTxt?.setVisible(false);
    this._unitStatsTxt?.setVisible(false);
    this._unitStats2Txt?.setVisible(false);
    this._hpLabel?.setVisible(false);
    this._hpBarBg?.clear().setVisible(false);
    this._hpBarFg?.clear().setVisible(false);
    this._unitHpTxt?.setVisible(false);
    this._mpLabel?.setVisible(false);
    this._mpBarBg?.clear().setVisible(false);
    this._mpBarFg?.clear().setVisible(false);
    this._mpTxt?.setVisible(false);
    this._expLabel?.setVisible(false);
    this._expBarBg?.clear().setVisible(false);
    this._expBarFg?.clear().setVisible(false);
    this._expTxt?.setVisible(false);
    this._statusIcon1?.setVisible(false);
    this._statusIcon2?.setVisible(false);
    this._unitVetTxt?.setVisible(false);
    this._skillsTxt?.setVisible(false);
    this._clearSkillChips();
  }

  // ==========================================================================
  // SKILL CHIPS HELPERS
  // ==========================================================================

  _clearSkillChips() {
    (this._skillChips || []).forEach(({ bg, txt }) => { bg?.destroy(); txt?.destroy(); });
    this._skillChips = [];
  }

  _drawSkillChips(unit) {
    this._clearSkillChips();
    if (!unit) return;

    const FP = this._FP;
    let chipX = FP.x + 6;
    const chipY = FP.y + 106;
    const chipH = 14;
    const maxRight = FP.x + FP.w - 6;

    (unit.skills || []).forEach(skillId => {
      const sk = SKILLS[skillId];
      const label = sk?.name || skillId;
      const chipW = Math.min(label.length * 6 + 10, 72);
      if (chipX + chipW > maxRight) return;

      const bg = this.add.graphics();
      bg.fillStyle(0x1a3050, 1);
      bg.fillRoundedRect(chipX, chipY, chipW, chipH, 3);
      bg.lineStyle(1, 0x4466aa, 1);
      bg.strokeRoundedRect(chipX, chipY, chipW, chipH, 3);
      const txt = this.add.text(chipX + 5, chipY + 2, label, {
        fontSize: '11px', color: '#aaccff',
        fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      }).setOrigin(0, 0);
      this._skillChips.push({ bg, txt });
      chipX += chipW + 3;
    });

    // Item chips
    (unit.items || []).forEach(itemId => {
      const it = ITEMS?.[itemId];
      const label = it?.emoji || '📦';
      const chipW = 20;
      if (chipX + chipW > maxRight) return;
      const bg = this.add.graphics();
      bg.fillStyle(0x103010, 1);
      bg.fillRoundedRect(chipX, chipY, chipW, chipH, 3);
      bg.lineStyle(1, 0x336633, 1);
      bg.strokeRoundedRect(chipX, chipY, chipW, chipH, 3);
      const txt = this.add.text(chipX + 3, chipY + 1, label, {
        fontSize: '11px', fontFamily: 'Nunito, Arial, sans-serif',
      }).setOrigin(0, 0);
      this._skillChips.push({ bg, txt });
      chipX += chipW + 3;
    });
  }

  // ==========================================================================
  // ACTION MENU — show / hide
  // ==========================================================================

  showActionMenu(unit, battleScene) {
    this._selectedUnit = unit;
    this._battle = battleScene;
    this._actionMenu.setVisible(true);

    const canAttack  = !unit.hasActed;
    const hasMagic   = canAttack && unit.skills.length > 0;
    const hasItem    = unit.items.length > 0;
    const hasPairUp  = !unit.hasActed && !unit.passenger && !!this._getAdjacentAlly(battleScene);
    const hasSep     = !!unit.passenger;

    const atkBtn    = this._actionBtns['atk'];
    const magBtn    = this._actionBtns['mag'];
    const itmBtn    = this._actionBtns['item'];
    const pairupBtn = this._actionBtns['pairup'];
    const sepBtn    = this._actionBtns['sep'];

    // pairup occupies slot 0 (same position as atk); sep occupies slot 1 (same as mag).
    // Show pairup/sep in place of atk/mag when applicable.
    if (pairupBtn) {
      pairupBtn.bg.setVisible(hasPairUp);
      pairupBtn.txt.setVisible(hasPairUp);
      if (hasPairUp) pairupBtn.zone.setInteractive({ useHandCursor: true });
      else pairupBtn.zone.disableInteractive();
    }
    if (sepBtn) {
      sepBtn.bg.setVisible(hasSep);
      sepBtn.txt.setVisible(hasSep);
      if (hasSep) sepBtn.zone.setInteractive({ useHandCursor: true });
      else sepBtn.zone.disableInteractive();
    }

    if (atkBtn) {
      const showAtk = !hasPairUp;
      atkBtn.bg.setVisible(showAtk);
      atkBtn.txt.setVisible(showAtk);
      if (showAtk && canAttack) atkBtn.zone.setInteractive({ useHandCursor: true });
      else atkBtn.zone.disableInteractive();
      if (showAtk) atkBtn.txt.setAlpha(canAttack ? 1 : 0.4);
    }
    if (magBtn) {
      const showMag = !hasSep;
      magBtn.bg.setVisible(showMag);
      magBtn.txt.setVisible(showMag);
      if (showMag && hasMagic) magBtn.zone.setInteractive({ useHandCursor: true });
      else magBtn.zone.disableInteractive();
      if (showMag) magBtn.txt.setAlpha(hasMagic ? 1 : 0.4);
    }
    if (itmBtn) {
      itmBtn.txt.setAlpha(hasItem ? 1 : 0.4);
      if (hasItem) itmBtn.zone.setInteractive({ useHandCursor: true });
      else itmBtn.zone.disableInteractive();
    }

    const undoBtn = this._actionBtns['undo'];
    // Show Undo only when unit has moved but hasn't committed an action yet
    const canUndo = unit.hasMoved && !unit.hasActed;
    if (undoBtn) {
      undoBtn.txt.setAlpha(canUndo ? 1 : 0.4);
      if (canUndo) undoBtn.zone.setInteractive({ useHandCursor: true });
      else undoBtn.zone.disableInteractive();
    }
  }

  hideActionMenu() {
    this._actionMenu.setVisible(false);
  }

  // ==========================================================================
  // SKILL SELECTOR SUB-MENU
  // ==========================================================================

  showSkillMenu(unit, battleScene) {
    if (!unit || !unit.skills || unit.skills.length === 0) return;
    this._selectedUnit = unit;
    this._battle = battleScene;
    this._actionMenu.setVisible(false);

    const W = GAME_W;
    const menuW = 300;
    const menuX = (W - menuW) / 2;  // centered: x=90
    const rowH  = 44;
    const headerH = 28;
    const cancelH = 32;
    const padV = 8;
    const skillCount = unit.skills.length;
    const menuH = padV + headerH + skillCount * (rowH + 4) + 4 + cancelH + padV;
    const menuY = 682 - menuH - 4;  // float above bottom bar

    const container = this.add.container(0, 0).setDepth(50);

    // Panel background with gold border
    const panelBg = this.add.graphics();
    panelBg.fillStyle(0x0a1428, 0.97);
    panelBg.fillRoundedRect(menuX, menuY, menuW, menuH, 10);
    panelBg.lineStyle(2, 0xf8d030, 1);
    panelBg.strokeRoundedRect(menuX, menuY, menuW, menuH, 10);
    // Inner accent line
    panelBg.lineStyle(1, 0x4488cc, 0.5);
    panelBg.strokeRoundedRect(menuX + 3, menuY + 3, menuW - 6, menuH - 6, 8);
    container.add(panelBg);

    // Header
    const headerTxt = this.add.text(W / 2, menuY + padV + 4, '✦  Choose Skill  ✦', {
      fontSize: '13px', color: '#f8d030',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
    }).setOrigin(0.5, 0);
    container.add(headerTxt);

    // Divider under header
    const divider = this.add.graphics();
    divider.lineStyle(1, 0xf8d030, 0.4);
    divider.beginPath();
    divider.moveTo(menuX + 10, menuY + padV + headerH);
    divider.lineTo(menuX + menuW - 10, menuY + padV + headerH);
    divider.strokePath();
    container.add(divider);

    const destroy = () => { container.destroy(true); };

    // Cursor text (shared, moved per hover)
    const cursorTxt = this.add.text(menuX + 8, menuY, '►', {
      fontSize: '12px', color: '#f8d030',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
    }).setOrigin(0, 0.5).setVisible(false);
    container.add(cursorTxt);

    unit.skills.forEach((skillId, idx) => {
      const sk = SKILLS[skillId];
      if (!sk) return;

      const canAfford = (sk.mpCost || 0) === 0 || unit.mp >= (sk.mpCost || 0);
      const rowY = menuY + padV + headerH + 4 + idx * (rowH + 4);
      const rowX = menuX + 8;
      const rowW = menuW - 16;

      const bgColor = canAfford ? 0x112244 : 0x111111;
      const borderColor = canAfford ? 0x3366aa : 0x2a2a2a;
      const textAlpha = canAfford ? 1.0 : 0.4;

      const bg = this.add.graphics();
      const drawBg = (fill, border) => {
        bg.clear();
        bg.fillStyle(fill, 1);
        bg.fillRoundedRect(rowX, rowY, rowW, rowH, 6);
        bg.lineStyle(1, border, 0.9);
        bg.strokeRoundedRect(rowX, rowY, rowW, rowH, 6);
      };
      drawBg(bgColor, borderColor);
      container.add(bg);

      // Skill icon
      const icon = sk.icon || sk.emoji || '⚡';
      const iconTxt = this.add.text(rowX + 8, rowY + rowH / 2 - 2, icon, {
        fontSize: '18px', fontFamily: 'Nunito, Arial, sans-serif',
      }).setOrigin(0, 0.5).setAlpha(textAlpha);
      container.add(iconTxt);

      // Skill name
      const nameTxt = this.add.text(rowX + 34, rowY + 8, sk.name, {
        fontSize: '13px', color: '#ffffff',
        fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      }).setOrigin(0, 0).setAlpha(textAlpha);
      container.add(nameTxt);

      // Description sub-line
      const desc = sk.desc || sk.type || '';
      const descTxt = this.add.text(rowX + 34, rowY + 26, desc, {
        fontSize: '11px', color: '#aabbcc',
        fontFamily: 'Nunito, Arial, sans-serif',
      }).setOrigin(0, 0).setAlpha(textAlpha);
      container.add(descTxt);

      // MP cost badge (right side)
      if (sk.mpCost) {
        const badgeColor = canAfford ? 0x1144aa : 0x222222;
        const badgeTxt = `MP ${sk.mpCost}`;
        const badgeW = 38;
        const badgeX = rowX + rowW - badgeW - 4;
        const badgeY = rowY + (rowH - 16) / 2;
        const badgeBg = this.add.graphics();
        badgeBg.fillStyle(badgeColor, 1);
        badgeBg.fillRoundedRect(badgeX, badgeY, badgeW, 16, 4);
        badgeBg.lineStyle(1, canAfford ? 0x4488ff : 0x333333, 1);
        badgeBg.strokeRoundedRect(badgeX, badgeY, badgeW, 16, 4);
        container.add(badgeBg);
        const badgeLbl = this.add.text(badgeX + badgeW / 2, badgeY + 8, badgeTxt, {

  showDamagePreview(attacker, defender, terrainDef, effectiveness = 1.0, options = {}) {
    const agiDiff  = attacker.agi - defender.agi;
    const hitPct   = Phaser.Math.Clamp(88 + agiDiff * 2, 55, 99);
    const critPct  = Phaser.Math.Clamp(8 + Math.max(0, agiDiff), 2, 30);
    const guardBonus = defender.guardActive ? Math.floor(defender.def * 0.5) : 0;

    // M4: Adjacency support preview
    const bn = this._battle;
    const atkSupport = bn ? Math.min(3, bn.units.filter(u =>
      !u.dead && u !== attacker && u.team === attacker.team &&
      Math.abs(u.col - attacker.col) + Math.abs(u.row - attacker.row) === 1
    ).length) : 0;
    const defSupport = bn ? Math.min(3, bn.units.filter(u =>
      !u.dead && u !== defender && u.team === defender.team &&
      Math.abs(u.col - defender.col) + Math.abs(u.row - defender.row) === 1
    ).length) : 0;

    const rawDmg = Math.max(1, (attacker.atk + atkSupport) - (defender.def + guardBonus + defSupport + (terrainDef || 0)));
    const minDmg   = rawDmg;
    const maxDmg   = rawDmg + Math.floor(attacker.atk * 0.15);
    const willDouble = agiDiff >= 7;

    // C2: Pending skill power multiplier
    const pendingSkill = this._battle?._pendingSkill;
    const skillPower = pendingSkill && typeof SKILLS !== 'undefined' ? (SKILLS[pendingSkill]?.power || 1) : 1;
    const skillHits  = pendingSkill && typeof SKILLS !== 'undefined' ? (SKILLS[pendingSkill]?.hits  || 1) : 1;
    const adjMin = Math.max(1, Math.floor(minDmg * Math.abs(skillPower)));
    const adjMax = Math.max(1, Math.floor(maxDmg * Math.abs(skillPower)));
    const willKill = defender.hp <= (adjMax * (willDouble ? 2 : 1) * skillHits);
    const hitsStr = skillHits > 1 ? `  ×${skillHits}` : '';

    // Weapon triangle prefix
    let prefix = '';
    if (effectiveness > 1.0)      prefix = '▲ ';  // green triangle up
    else if (effectiveness < 1.0) prefix = '▼ ';  // red triangle down

    // Redraw background (in case it was previously hidden/cleared)
    const { _dmgPreviewPanX: panX, _dmgPreviewPanY: panY,
            _dmgPreviewPanW: panW, _dmgPreviewPanH: panH } = this;
    this._dmgPreviewBg.clear();
    this._dmgPreviewBg.fillStyle(0x000000, 0.82);
    this._dmgPreviewBg.fillRoundedRect(panX, panY, panW, panH, 7);
    this._dmgPreviewBg.lineStyle(1, 0xff6644, 0.85);
    this._dmgPreviewBg.strokeRoundedRect(panX, panY, panW, panH, 7);
    this._dmgPreviewBg.setVisible(true);

    // Line 1 — attacker forecast with double/kill indicators
    const atkLine = `${prefix}${attacker.name} → ${adjMin === adjMax ? adjMin : adjMin + '-' + adjMax}  HIT:${hitPct}%  CRIT:${critPct}%${willDouble ? '  ×2' : ''}${hitsStr}${willKill ? '  KILL' : ''}`;
    const line1Color = effectiveness > 1.0 ? '#88ff88' : effectiveness < 1.0 ? '#ff8888' : '#ffcc88';
    this._dmgPreviewLine1.setText(atkLine).setStyle({ color: line1Color }).setVisible(true);

    // Line 2 — hide (was old simple counter; now replaced by line3)
    this._dmgPreviewLine2.setVisible(false);

    // Counter-attack forecast (m1 fix: use attacker's tile terrain def for counter calc)
    const dist = Math.abs(attacker.col - defender.col) + Math.abs(attacker.row - defender.row);
    const canCounter = dist <= (defender.range || 1);
    if (canCounter) {
      const atkTDef = options.defenderTerrainDef || 0;
      const cGuard = attacker.guardActive ? Math.floor(attacker.def * 0.5) : 0;
      const cRaw = Math.max(1, defender.atk - (attacker.def + cGuard + atkTDef));
      const cMin = cRaw;
      const cMax = cRaw + Math.floor(defender.atk * 0.1);
      const cAgiDiff = defender.agi - attacker.agi;
      const cHit = Phaser.Math.Clamp(85 + cAgiDiff * 2, 55, 99);
      const cCrit = Phaser.Math.Clamp(6 + Math.max(0, cAgiDiff), 2, 25);
      const defDouble = cAgiDiff >= 7;
      const counterText = `${defender.name} ← ${cMin === cMax ? cMin : cMin + '-' + cMax}  HIT:${cHit}%  CRIT:${cCrit}%${defDouble ? '  ×2' : ''}`;
      this._dmgPreviewLine3.setText(counterText).setVisible(true);
      this._dmgPreviewLine4.setVisible(false);
    } else {
      this._dmgPreviewLine3.setText('No counter-attack').setVisible(true);
      this._dmgPreviewLine4.setVisible(false);
    }
  }

  hideDamagePreview() {
    this._dmgPreviewBg?.clear().setVisible(false);
    this._dmgPreviewLine1?.setVisible(false);
    this._dmgPreviewLine2?.setVisible(false);
    this._dmgPreviewLine3?.setVisible(false);
    this._dmgPreviewLine4?.setVisible(false);
  }

  _buildDialogueBox() {
    const W = GAME_W;

    const boxY = GAME_H - boxH - 10;

    this._dlgContainer = this.add.container(0, 0).setVisible(false);

    dBg.fillRoundedRect(10, boxY, W - 20, boxH, 10);
    dBg.lineStyle(2, 0x4455aa, 0.85);
    dBg.strokeRoundedRect(10, boxY, W - 20, boxH, 10);

    this._dlgPortrait = this.add.text(28, boxY + 14, '', { fontSize: '38px' });
    this._dlgSpeaker  = this.add.text(76, boxY + 12, '', {
      fontSize: '16px', color: '#f8d030',
      fontFamily: 'Nunito, Georgia, serif',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 2,
    });
    this._dlgText = this.add.text(76, boxY + 34, '', {
      fontSize: '16px', color: '#ddeeff',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      wordWrap: { width: W - 106 },
      lineSpacing: 5,
    });
    this._dlgPrompt = this.add.text(W - 24, boxY + boxH - 18, '▶ TAP', {
      fontSize: '13px', color: '#aabbcc',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
    }).setOrigin(1, 0.5);

    this.tweens.add({
      targets: this._dlgPrompt, alpha: { from: 0.3, to: 1 },
      duration: 600, yoyo: true, repeat: -1,
    });

    this._dlgContainer.add([dBg, this._dlgPortrait, this._dlgSpeaker, this._dlgText, this._dlgPrompt]);

    // Tap zone — advances dialogue when player taps the dialogue box directly
    const dlgTapZone = this.add.zone(W / 2, boxY + boxH / 2, W, boxH)
      .setInteractive({ useHandCursor: true });
    dlgTapZone.on('pointerdown', () => {
      this._battle?._advanceDialogue();
    });
    this._dlgContainer.add([dlgTapZone]);
  }

  showDialogue(line) {
    this._dlgContainer.setVisible(true);
    this._dlgPortrait.setText(line.portrait || '');
    this._dlgSpeaker.setText(line.speaker || '');
    // Cancel any in-progress typewriter timer
    if (this._typewriterTimer) {
      this._typewriterTimer.remove(false);
      this._typewriterTimer = null;
    }
    // Typewriter effect
    const fullText = line.text || '';
    this._dlgText.setText('');
    let i = 0;
    this._typewriterTimer = this.time.addEvent({
      delay: 28, repeat: fullText.length - 1,
      callback: () => {
        this._dlgText.setText(fullText.slice(0, ++i));
      },
    });
  }

  hideDialogue() {
    this._dlgContainer.setVisible(false);
  }

  // ==========================================================================
  // CHAPTER TITLE CARD
  // ==========================================================================

  showChapterTitle(chapterId) {
    const chap = CHAPTERS[chapterId - 1];
    const W = GAME_W;

      fontStyle: 'bold',
      stroke: '#000000',

    const chSub = this.add.text(W / 2, GAME_H / 2 + 24, chap.subtitle, {

    this.time.delayedCall(2200, () => {
      this.tweens.add({
        targets: [overlay, chNum, chTitle, chSub], alpha: 0, duration: 500,
        onComplete: () => { overlay.destroy(); chNum.destroy(); chTitle.destroy(); chSub.destroy(); },
      });
    });
  }

'use strict';
// =============================================================================
// Puppy Force — VictoryScene.js
// Chapter victory, game over, and final victory screens
// =============================================================================

class VictoryScene extends Phaser.Scene {
  constructor() { super({ key: 'VictoryScene' }); }

  init(data) {
    this.result       = data.result;     // 'victory' | 'defeat'
    this.chapter      = data.chapter;
    this.saveData     = data.saveData;
    this.newUnits     = data.newUnits || [];
    this.levelUps     = data.levelUps || [];
    this.victoryLines = data.victoryLines || [];
    this.totalDamage  = data.totalDamage || 0;
    this.unitsLost    = data.unitsLost   || 0;
    this.turns        = data.turns       || 0;
  }

  preload() {
    // Audio (graceful — files are optional and may not exist yet)
    AudioManager.preloadSFX(this);
  }

  create() {
    const W = GAME_W, H = GAME_H;
    const isVictory = this.result === 'victory';

    // ── Background ───────────────────────────────────────────────────────────
    const bg = this.add.graphics();
    if (isVictory) {
      bg.fillGradientStyle(0x0a1a2a, 0x0a1a2a, 0x1a2a0a, 0x1a2a0a, 1);
    } else {
      bg.fillGradientStyle(0x1a0a0a, 0x1a0a0a, 0x0a0a0a, 0x0a0a0a, 1);
    }
    bg.fillRect(0, 0, W, H);

    // ── Audio stings ─────────────────────────────────────────────────────────
    if (isVictory) {
      AudioManager.stopMusic(this);
      AudioManager.play(this, 'victory_fanfare');
    } else {
      AudioManager.stopMusic(this);
      AudioManager.play(this, 'defeat_sting');
    }

    if (isVictory) {
      this._showVictoryDialogue();
    } else {
      this._showDefeat();
    }
  }

  _showVictoryDialogue() {
    if (this.victoryLines.length === 0) { this._buildVictoryContent(); return; }
    const W = this.scale.width, H = this.scale.height;
    const lines = this.victoryLines;
    let idx = 0;

    // Dialogue box
    const boxH = 110, boxY = H - boxH - 10;
    const dBg = this.add.graphics();
    dBg.fillStyle(0x0a1a2e, 0.95);
    dBg.fillRoundedRect(10, boxY, W - 20, boxH, 10);
    dBg.lineStyle(2, 0x4488cc, 0.8);
    dBg.strokeRoundedRect(10, boxY, W - 20, boxH, 10);

    // Portrait setup — use PNG image if available, else fall back to emoji text
    const portraitX = 36, portraitY = boxY + 14;
    const firstLine = lines[0];
    const firstKey  = (typeof SPEAKER_PORTRAIT_KEY !== 'undefined' && firstLine.speaker)
                        ? SPEAKER_PORTRAIT_KEY[firstLine.speaker] : undefined;
    const firstIsPlayer = firstKey && firstKey.startsWith('player_png_');

    // Border rectangle (68×68) behind the portrait image
    const portraitBorder = this.add.rectangle(
      portraitX + 32, portraitY + 32,
      68, 68,
      firstIsPlayer ? 0x2255cc : 0xcc2222, 0.85
    );

    let portrait;
    let portraitIsImage = false;
    if (firstKey && this.textures.exists(firstKey)) {
      portrait = this.add.image(portraitX + 32, portraitY + 32, firstKey).setDisplaySize(64, 64);
      portraitIsImage = true;
    } else {
      portraitBorder.setVisible(false);
      portrait = this.add.text(portraitX, portraitY, firstLine.portrait || '', { fontSize: '36px' });
    }

    const speaker  = this.add.text(92, boxY + 12, '', {
      fontSize: '16px', color: '#f8d030',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 2,
    });
    const dlgText  = this.add.text(92, boxY + 34, '', {
      fontSize: '15px', color: '#ddeeff',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      wordWrap: { width: W - 122 }, lineSpacing: 5,
    });
    const tapHint  = this.add.text(W - 24, boxY + boxH - 16, '▶ TAP', {
      fontSize: '12px', color: '#aabbcc',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
    }).setOrigin(1, 0.5);
    this.tweens.add({ targets: tapHint, alpha: { from: 0.3, to: 1 }, duration: 600, yoyo: true, repeat: -1 });

    const showLine = (i) => {
      const line = lines[i];
      const key = (typeof SPEAKER_PORTRAIT_KEY !== 'undefined' && line.speaker)
                    ? SPEAKER_PORTRAIT_KEY[line.speaker] : undefined;
      const isPlayer = key && key.startsWith('player_png_');

      if (key && this.textures.exists(key)) {
        // Show image portrait
        portraitBorder.setVisible(true);
        portraitBorder.setFillStyle(isPlayer ? 0x2255cc : 0xcc2222, 0.85);
        if (portraitIsImage) {
          portrait.setTexture(key);
        } else {
          // Was emoji text — destroy and replace with image
          portrait.destroy();
          portrait = this.add.image(portraitX + 32, portraitY + 32, key).setDisplaySize(64, 64);
          portraitIsImage = true;
        }
      } else {
        // Fall back to emoji text
        portraitBorder.setVisible(false);
        if (portraitIsImage) {
          // Was image — destroy and replace with text
          portrait.destroy();
          portrait = this.add.text(portraitX, portraitY, line.portrait || '', { fontSize: '36px' });
          portraitIsImage = false;
        } else {
          portrait.setText(line.portrait || '');
        }
      }

      speaker.setText(line.speaker || '');
      dlgText.setText(line.text || '');
    };
    showLine(0);

    const advance = () => {
      idx++;
      if (idx >= lines.length) {
        // Done — destroy dialogue elements and show stats
        [dBg, portraitBorder, portrait, speaker, dlgText, tapHint].forEach(o => o.destroy());
        tapZone.destroy();
        this._buildVictoryContent();
        return;
      }
      showLine(idx);
    };

    const tapZone = this.add.zone(W / 2, boxY + boxH / 2, W, boxH)
      .setInteractive({ useHandCursor: true });
    tapZone.on('pointerdown', advance);
  }

  _buildVictoryContent() {
    const W = GAME_W, H = GAME_H;
    const chap = CHAPTERS[this.chapter - 1];
    const isFinal = this.chapter === 7;

    // Confetti particles
    for (let i = 0; i < 40; i++) {
      const colors = [0xf8d030, 0x4488ff, 0xff4466, 0x44cc66, 0xcc44ff];
      const dot = this.add.rectangle(
        Phaser.Math.Between(0, W), Phaser.Math.Between(-20, 0),
        Phaser.Math.Between(4, 10), Phaser.Math.Between(4, 10),
        Phaser.Utils.Array.GetRandom(colors)
      );
      this.tweens.add({
        targets: dot, y: H + 20, x: dot.x + Phaser.Math.Between(-60, 60),
        rotation: Math.random() * 6,
        duration: Phaser.Math.Between(1500, 3000),
        delay: Phaser.Math.Between(0, 1500),
        repeat: -1,
      });
    }

    // Title
    const titleText = isFinal ? '🏆  VICTORY!  🏆' : `Chapter ${this.chapter} Clear!`;
    this.add.text(W / 2, 80, titleText, {
      fontFamily: 'Nunito, Georgia, serif',
      fontSize: isFinal ? '42px' : '36px',
      fontStyle: 'bold',
      color: '#f8d030',
      stroke: '#000000',
      strokeThickness: 5,
    }).setOrigin(0.5);

    // Chapter name
    this.add.text(W / 2, 128, chap.title, {
      fontSize: '20px', color: '#88ccff',
      fontFamily: 'Nunito, Courier New, monospace',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 2,
    }).setOrigin(0.5);

    // Hero emojis
    const heroRow = ['🐶','🐕','🦮','🐩','🐾','🐕‍🦺','🐺','🦊'];
    heroRow.forEach((e, i) => {
      const x = W/2 - (heroRow.length/2)*30 + i*30 + 15;
      const t = this.add.text(x, 170, e, { fontSize: '28px' }).setOrigin(0.5);
      this.tweens.add({ targets:t, y:160, duration:400+i*50, yoyo:true, repeat:-1 });
    });

    // M2: Fallen unit indicator — use accurate unitsLost count (tracked by BattleScene)
    const _rosterEntries = (this.saveData && this.saveData.roster) ? this.saveData.roster : [];
    const _hpByName = {};
    _rosterEntries.forEach(r => { _hpByName[r.name] = r.hp; });

    // Casualties summary line — use this.unitsLost (set by BattleScene._unitsLost)
    let yOff = 222;
    if (this.unitsLost > 0) {
      this.add.text(W / 2, yOff,
        `${this.unitsLost} unit${this.unitsLost > 1 ? 's' : ''} fell in battle (revived)`, {
        fontSize: '11px', color: '#ff6644',
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'italic',
      }).setOrigin(0.5).setDepth(50);
      yOff += 20;
    }

    // Level up summary
    if (this.levelUps.length > 0) {
      this.add.text(W/2, yOff, '⬆ Level Ups:', {
        fontSize:'16px', color:'#ffcc44',
        fontFamily:'Nunito, Courier New, monospace',
        fontStyle:'bold',
        stroke:'#000000', strokeThickness:2,
      }).setOrigin(0.5);
      yOff += 26;
      this.levelUps.slice(0, 5).forEach(lu => {
        const luText = this.add.text(W/2, yOff, `${lu.emoji} ${lu.name}: Lv ${lu.newLevel}`, {
          fontSize:'15px', color:'#ccdeff',
          fontFamily:'Nunito, Courier New, monospace',
          fontStyle:'bold',
        }).setOrigin(0.5);
        // M2: KO'd indicator for units revived from death (hp === 1 proxy)
        if (_hpByName[lu.name] !== undefined && _hpByName[lu.name] <= 1) {
          const lx = luText.x + luText.width / 2;
          this.add.text(lx + 6, yOff, "KO'd", {
            fontSize: '9px', color: '#ff4444',
            fontFamily: 'Nunito, Arial, sans-serif',
            fontStyle: 'bold',
          }).setOrigin(0, 0.5).setDepth(50);
        }
        yOff += 22;
      });
      yOff += 10;
    }

    // New recruits
    if (this.newUnits.length > 0) {
      this.add.text(W/2, yOff, '🐾 New Allies:', {
        fontSize:'16px', color:'#44ff88',
        fontFamily:'Nunito, Courier New, monospace',
        fontStyle:'bold',
        stroke:'#000000', strokeThickness:2,
      }).setOrigin(0.5);
      yOff += 26;
      this.newUnits.forEach(u => {
        this.add.text(W/2, yOff, `${u.emoji}  ${u.name}  joined!`, {
          fontSize:'15px', color:'#ccffcc',
          fontFamily:'Nunito, Courier New, monospace',
          fontStyle:'bold',
        }).setOrigin(0.5);
        yOff += 22;
      });
      yOff += 10;
    }

    // Battle stats
    if (this.totalDamage || this.unitsLost || this.turns) {
      yOff += 6;
      const statsLines = [
        `⚔ Damage dealt: ${this.totalDamage}`,
        `💀 Allies lost:  ${this.unitsLost}`,
        `🕐 Turns taken:  ${this.turns}`,
      ];
      statsLines.forEach(line => {
        this.add.text(W/2, yOff, line, {
          fontSize:'13px', color:'#8899aa',
          fontFamily:'Nunito, Courier New, monospace',
          fontStyle:'bold',
        }).setOrigin(0.5);
        yOff += 19;
      });
      yOff += 6;
    }

    // Buttons
    if (!isFinal) {
      this._btn(W/2, H - 140, '⚔  NEXT CHAPTER', 0x1a4422, 0x33bb55, () => {
        this.scene.start('ComicScene', {
          currentChap: this.chapter,
          chapter:     this.chapter + 1,
          saveData:    this.saveData,
        });
      });
    } else {
      this.add.text(W/2, H - 180, 'ALL 7 CHAPTERS COMPLETE!\nBarkville is saved forever!', {
        fontSize:'18px', color:'#f8d030',
        fontFamily:'Nunito, Georgia, serif',
        fontStyle:'bold',
        align:'center',
        stroke:'#000000', strokeThickness:3,
      }).setOrigin(0.5);
    }

    this._btn(W/2, H - 70, '🏠  TITLE SCREEN', 0x112244, 0x2255aa, () => {
      this.scene.start('TitleScene');
    });
  }

  _showDefeat() {
    const W = GAME_W, H = GAME_H;

    // Rain-like effect
    for (let i = 0; i < 30; i++) {
      const drop = this.add.rectangle(
        Phaser.Math.Between(0, W), Phaser.Math.Between(-H, 0),
        1, Phaser.Math.Between(10, 25), 0x4488cc, 0.4
      );
      this.tweens.add({
        targets: drop, y: H + 30,
        duration: Phaser.Math.Between(800, 1800),
        repeat: -1, delay: Phaser.Math.Between(0, 2000),
      });
    }

    this.add.text(W/2, 130, 'DEFEATED...', {
      fontFamily:'Nunito, Georgia, serif', fontSize:'46px',
      fontStyle:'bold',
      color:'#dd3333', stroke:'#000000', strokeThickness:5,
    }).setOrigin(0.5);

    this.add.text(W/2, 190, 'The cats overwhelmed your force...', {
      fontSize:'16px', color:'#99aabb',
      fontFamily:'Nunito, Courier New, monospace',
      fontStyle:'bold',
      stroke:'#000000', strokeThickness:2,
    }).setOrigin(0.5);

    this.add.text(W/2, 234, '😿🐱🐈😿', { fontSize:'44px' }).setOrigin(0.5);

    this.add.text(W/2, 306, 'Your brave dogs fought with honor.\nTry again and reclaim Barkville!', {
      fontSize:'15px', color:'#8899aa',
      fontFamily:'Nunito, Courier New, monospace',
      fontStyle:'bold',
      align:'center',
      stroke:'#000000', strokeThickness:2,
    }).setOrigin(0.5);

    // Battle stats
    if (this.totalDamage || this.unitsLost || this.turns) {
      const statsLines = [
        `⚔ Damage dealt: ${this.totalDamage}`,
        `💀 Allies lost:  ${this.unitsLost}`,
        `🕐 Turns taken:  ${this.turns}`,
      ];
      let sY = 362;
      statsLines.forEach(line => {
        this.add.text(W/2, sY, line, {
          fontSize:'13px', color:'#556677',
          fontFamily:'Nunito, Courier New, monospace',
          fontStyle:'bold',
        }).setOrigin(0.5);
        sY += 19;
      });
    }

    this._btn(W/2, H - 140, '🔄  RETRY CHAPTER', 0x2a1a00, 0x885500, () => {
      this.scene.start('BattleScene', {
        chapter: this.chapter,
        saveData: this.saveData,
      });
    });

    this._btn(W/2, H - 70, '🏠  TITLE SCREEN', 0x112244, 0x2255aa, () => {
      this.scene.start('TitleScene');
    });
  }

  _btn(x, y, label, colorDark, colorLight, cb) {
    const W_btn = 240, H_btn = 48;
    const bg = this.add.graphics();
    bg.fillStyle(colorDark, 1);
    bg.fillRoundedRect(x - W_btn/2, y - H_btn/2, W_btn, H_btn, 10);
    bg.lineStyle(2, colorLight, 0.9);
    bg.strokeRoundedRect(x - W_btn/2, y - H_btn/2, W_btn, H_btn, 10);

    const txt = this.add.text(x, y, label, {
      fontSize:'19px', color:'#ffffff',
      fontFamily:'Nunito, Courier New, monospace', fontStyle:'bold',
      stroke:'#000000', strokeThickness:2,
    }).setOrigin(0.5);

    const zone = this.add.zone(x, y, W_btn, H_btn).setInteractive({ useHandCursor: true });
    zone.on('pointerdown', () => {
      this.tweens.add({ targets:[bg,txt], scaleX:0.95, scaleY:0.95, duration:80, yoyo:true });
      setTimeout(cb, 120);
    });
  }
}


// === js/pf/scenes/CutsceneScene.js ===
'use strict';
// =============================================================================
// Puppy Force — CutsceneScene.js
// Animated inter-chapter cutscene with Fire Emblem-style portrait dialogue bars
// =============================================================================

class CutsceneScene extends Phaser.Scene {
  constructor() { super({ key: 'CutsceneScene' }); }

  init(data) {
    this.nextChapter = data.chapter;        // chapter to load after cutscene
    this.currentChap = data.currentChap;    // chapter that was just won
    this.saveData    = data.saveData;
    this.hasSkipped  = false;
  }

  // ---------------------------------------------------------------------------
  // Improvement 1: Preload portrait PNGs (graceful — same pattern as BattleScene)
  preload() {
    AudioManager.preloadMusic(this);

    // Enemy portrait PNGs — v1 through v4 variants
    // File naming: assets/enemies/<lowercase_id>_v1.png
    const ENEMY_PNG_IDS = [
      'ALLEY_CAT',
      'SIAMESE_ASSASSIN',
      'LYNX_RANGER',
      'SNOW_LEOPARD',
      'RIVER_PANTHER',
      'SAND_CAT_KING',
      'PERSIAN_QUEEN',
      'CAT_EMPEROR',
      'TIGER_GENERAL',
      'PERSIAN_SORCERER',
      'SCOUT_CAT',
    ];
    ENEMY_PNG_IDS.forEach(id => {
      // Load v1–v4 variants for each enemy
      for (let v = 1; v <= 4; v++) {
        const pngKey = v === 1 ? `enemy_png_${id}` : `enemy_png_${id}_v${v}`;
        if (!this.textures.exists(pngKey)) {
          try {
            const fileName = id.toLowerCase() + `_v${v}.png`;
            this.load.image(pngKey, `assets/enemies/${fileName}`);
          } catch (e) {
            // silently skip — emoji fallback will be used
          }
        }
      }
    });

    // Player chibi PNGs
    // File naming: assets/characters/<id>_chibi_v1.png
    const PLAYER_PNG_IDS = [
      'PUPPY_KNIGHT', 'CORGI_HEALER', 'LABRADOR_SCOUT', 'BEAGLE_ARCHER',
      'BULLDOG_TANK', 'POODLE_MAGE', 'HUSKY_RIDER', 'TERRIER_THIEF',
      'FOX_SCOUT', 'DOG_PALADIN', 'OTTER_ALLY',
    ];
    PLAYER_PNG_IDS.forEach(id => {
      const pngKey = `player_png_${id}`;
      if (!this.textures.exists(pngKey)) {
        try {
          this.load.image(pngKey, `assets/characters/${id.toLowerCase()}_chibi_v1.png`);
        } catch (e) {
          // silently skip — emoji fallback will be used
        }
      }
    });
  }

  create() {
    const W = GAME_W, H = GAME_H;

    AudioManager.playMusic(this, 'overworld', 0.4);

    this._buildBackground(W, H);
    this._buildParticles(W, H);
    this._buildSkipButton(W);
    this._playSequence(W, H);
  }

  // ---------------------------------------------------------------------------
  _buildBackground(W, H) {
    // Gradient background — use next chapter's bgColor if available
    const nextChap = CHAPTERS[this.nextChapter - 1] || CHAPTERS[0];
    const bg = this.add.graphics();
    bg.fillGradientStyle(
      0x0a0f1a, 0x0a0f1a,
      nextChap.bgColor || 0x1a2a10, nextChap.bgColor || 0x1a2a10,
      1
    );
    bg.fillRect(0, 0, W, H);

    // Subtle horizontal rule lines for cinematic feel
    for (let i = 0; i < 6; i++) {
      const line = this.add.graphics();
      line.lineStyle(1, 0x334466, 0.15);
      line.lineBetween(0, i * (H / 5), W, i * (H / 5));
    }

    // Top and bottom letterbox bars (cinematic black bars)
    this.add.rectangle(W / 2, 22, W, 44, 0x000000, 1).setDepth(10);
    this.add.rectangle(W / 2, H - 22, W, 44, 0x000000, 1).setDepth(10);
  }

  _buildParticles(W, H) {
    // Falling stars / sparkles for atmosphere
    for (let i = 0; i < 18; i++) {
      const sym = Phaser.Math.RND.pick(['✦', '·', '✧', '⭑']);
      const p = this.add.text(
        Phaser.Math.Between(0, W),
        Phaser.Math.Between(-60, H),
        sym,
        { fontSize: '14px', color: '#aabbcc', alpha: 0.4 }
      ).setAlpha(Phaser.Math.FloatBetween(0.15, 0.5));

      this.tweens.add({
        targets: p,
        y: p.y + H + 80,
        alpha: 0,
        duration: Phaser.Math.Between(5000, 10000),
        ease: 'Linear',
        repeat: -1,
        delay: Phaser.Math.Between(0, 4000),
      });
    }
  }

  _buildSkipButton(W) {
    const skipTxt = this.add.text(W - 14, 14, 'SKIP ▶▶', {
      fontSize: '12px', color: '#778899',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      backgroundColor: '#00000066',
      padding: { x: 6, y: 3 },
    }).setOrigin(1, 0).setDepth(20).setInteractive({ useHandCursor: true });

    skipTxt.on('pointerover', () => skipTxt.setColor('#aabbff'));
    skipTxt.on('pointerout',  () => skipTxt.setColor('#778899'));
    skipTxt.on('pointerdown', () => {
      if (!this.hasSkipped) {
        this.hasSkipped = true;
        this._fadeToNextChapter();
      }
    });
  }

  // ---------------------------------------------------------------------------
  _playSequence(W, H) {
    // Build beats from ChapterData story
    const beats = this._buildBeats();

    beats.forEach(beat => {
      this.time.delayedCall(beat.t, () => {
        if (this.hasSkipped) return;
        switch (beat.type) {
          case 'enter':    this._beatEnter(beat, W, H);    break;
          case 'caption':  this._beatCaption(beat, W, H);  break;
          case 'shake':    this.cameras.main.shake(350, 0.018); break;
          case 'end':      this._fadeToNextChapter();       break;
        }
      });
    });
  }

  _buildBeats() {
    const cur  = CHAPTERS[(this.currentChap  || 1) - 1] || {};
    const next = CHAPTERS[(this.nextChapter  || 2) - 1] || {};
    const vict = cur.victory  || [];
    const intr = next.intro   || [];

    const beats = [];
    let t = 200;

    // Victory lines — heroes reflect on the win
    vict.forEach((line, i) => {
      const side = i % 2 === 0 ? 'left' : 'right';
      beats.push({ type: 'enter', t, portrait: line.portrait || '🐶', text: line.text || '', speaker: line.speaker || '', side, hold: 2800 });
      t += 3200;
    });

    // Transition pause
    t += 400;

    // Villain intro from next chapter — dramatic entrance
    const villainLine = intr.find(l => l.speaker && (l.speaker.includes('Cat') || l.speaker.includes('Boss') || l.speaker.includes('Assassin') || l.speaker.includes('General') || l.speaker.includes('Queen') || l.speaker.includes('Emperor') || l.portrait === '🐱' || l.portrait === '😾' || l.portrait === '🐈'));
    if (villainLine) {
      beats.push({ type: 'shake', t: t - 100 });
      beats.push({ type: 'enter', t, portrait: villainLine.portrait || '😾', text: villainLine.text || '', speaker: villainLine.speaker || '', side: 'top', hold: 2800, villain: true });
      t += 3400;
    }

    // Chapter title card
    const nextTitle = next.title || `Chapter ${this.nextChapter}`;
    beats.push({ type: 'caption', t, text: `Chapter ${this.nextChapter}`, subtitle: nextTitle, hold: 2000 });
    t += 2600;

    // End
    beats.push({ type: 'end', t });

    return beats;
  }

  // ---------------------------------------------------------------------------
  // Improvement 2 & 3 & 4: _beatEnter with portrait images, bottom dialogue bar,
  // villain v2 variant, and villain entrance flash
  _beatEnter(beat, W, H) {
    const isVillain = beat.villain || false;

    // Determine portrait texture keys
    const baseKey     = SPEAKER_PORTRAIT_KEY[beat.speaker] || null;
    const isEnemyKey  = baseKey && baseKey.startsWith('enemy_png_');

    // Improvement 3: villain "reveal" — use _v2 variant for the large upper portrait
    let largeKey = baseKey;
    if (isEnemyKey && baseKey) {
      const v2Key = baseKey + '_v2';
      if (this.textures.exists(v2Key)) {
        largeKey = v2Key;
      }
    }

    // Improvement 4: villain entrance flash + camera shake
    if (isVillain && isEnemyKey) {
      const flash = this.add.rectangle(W / 2, H / 2, W, H, 0xffffff)
        .setAlpha(0)
        .setDepth(20);
      this.tweens.add({
        targets: flash,
        alpha: 0.5,
        duration: 150,
        yoyo: true,
        hold: 0,
        ease: 'Linear',
        onComplete: () => flash.destroy(),
      });
      this.cameras.main.shake(200, 0.01);
    }

    // -------------------------------------------------------------------------
    // Upper large portrait (slides in from off-screen — kept but reduced in size)
    const centerY = H * 0.42;

    let startX, startY, targetX, targetY;
    if (beat.side === 'top') {
      startX = W / 2;  startY = -140;
      targetX = W / 2; targetY = centerY - 40;
    } else if (beat.side === 'left') {
      startX = -130;   startY = centerY;
      targetX = W * 0.28; targetY = centerY;
    } else {
      startX = W + 130; startY = centerY;
      targetX = W * 0.72; targetY = centerY;
    }

    // Try to use portrait PNG for large upper portrait (120x120), else emoji at 52px
    let largePortraitObj;
    const hasLargePng = largeKey && this.textures.exists(largeKey);
    if (hasLargePng) {
      largePortraitObj = this.add.image(startX, startY, largeKey)
        .setDisplaySize(120, 120)
        .setOrigin(0.5)
        .setDepth(5);
    } else {
      largePortraitObj = this.add.text(startX, startY, beat.portrait, {
        fontSize: '52px',
      }).setOrigin(0.5).setDepth(5);
    }

    // Slide / drop in
    const ease = beat.side === 'top' ? 'Bounce.out' : 'Power2.out';
    this.tweens.add({ targets: largePortraitObj, x: targetX, y: targetY, duration: 700, ease });

    // Bounce idle animation
    this.tweens.add({
      targets: largePortraitObj,
      y: targetY - (isVillain ? 14 : 8),
      duration: isVillain ? 500 : 700,
      yoyo: true, repeat: -1,
      ease: 'Sine.inOut',
      delay: 750,
    });

    // -------------------------------------------------------------------------
    // Improvement 2: Fire Emblem bottom dialogue bar
    // Bar sits at y = H*0.70, height ~110px (above the 44px bottom letterbox)
    const barY      = H * 0.70;
    const barH      = 110;
    const barBgCol  = 0x0a1a2e;
    const barBorder = isVillain ? 0xdd2222 : 0x4488ff;

    // Background panel
    const barBg = this.add.graphics().setDepth(7);
    barBg.fillStyle(barBgCol, 0.92);
    barBg.fillRect(0, barY, W, barH);
    barBg.lineStyle(2, barBorder, 0.9);
    barBg.strokeRect(0, barY, W, barH);

    // --- Portrait thumbnail (left side of bar) ---
    // v1 key for the bottom bar (always use v1 for consistency)
    const barPortraitKey = baseKey;
    const hasBarPng = barPortraitKey && this.textures.exists(barPortraitKey);

    let barPortraitObj = null;
    if (hasBarPng) {
      // Circular mask for portrait image
      const maskShape = this.make.graphics({ x: 16, y: barY + 15, add: false });
      maskShape.fillStyle(0xffffff);
      maskShape.fillCircle(40, 40, 40);
      const mask = maskShape.createGeometryMask();

      barPortraitObj = this.add.image(16 + 40, barY + 15 + 40, barPortraitKey)
        .setDisplaySize(80, 80)
        .setOrigin(0.5)
        .setDepth(8)
        .setMask(mask);
    } else {
      // Fallback: emoji at 36px
      barPortraitObj = this.add.text(16 + 18, barY + 15 + 18, beat.portrait, {
        fontSize: '36px',
      }).setOrigin(0.5).setDepth(8);
    }

    // Speaker name label (bold, gold for ally / red for villain)
    const nameColor = isVillain ? '#ff8888' : '#f8d030';
    const nameLabel = this.add.text(108, barY + 12, beat.speaker, {
      fontSize: '14px',
      color: nameColor,
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 2,
    }).setDepth(8).setOrigin(0, 0);

    // Dialogue typewriter text
    const dialogueText = this.add.text(108, barY + 34, '', {
      fontSize: '13px',
      color: isVillain ? '#ffcccc' : '#ddeeff',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      wordWrap: { width: W - 120 },
    }).setDepth(8).setOrigin(0, 0);

    // Typewriter effect
    const full = beat.text;
    let ci = 0;
    this.time.addEvent({
      delay: 30, repeat: full.length - 1,
      callback: () => { dialogueText.setText(full.slice(0, ++ci)); },
    });

    // Fade bar in
    const barObjects = [barBg, nameLabel, dialogueText];
    if (barPortraitObj) barObjects.push(barPortraitObj);
    barObjects.forEach(o => o.setAlpha(0));
    this.tweens.add({ targets: barObjects, alpha: 1, duration: 300, delay: 400 });

    // -------------------------------------------------------------------------
    // Fade everything out before next beat
    this.time.delayedCall(beat.hold, () => {
      const allObjects = [largePortraitObj, ...barObjects];
      this.tweens.add({
        targets: allObjects,
        alpha: 0, duration: 400,
        onComplete: () => {
          allObjects.forEach(o => { if (o && o.destroy) o.destroy(); });
        },
      });
    });
  }

  // ---------------------------------------------------------------------------
  _beatCaption(beat, W, H) {
    const label = this.add.text(W / 2, H * 0.44, beat.text.toUpperCase(), {
      fontSize: '13px', color: '#aabbcc', letterSpacing: 6,
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 2,
    }).setOrigin(0.5).setAlpha(0).setDepth(8);

    const title = this.add.text(W / 2, H * 0.44 + 28, beat.subtitle, {
      fontSize: '28px', color: '#f8d030',
      fontFamily: 'Nunito, Georgia, serif', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 4,
    }).setOrigin(0.5).setAlpha(0).setDepth(8);

    this.tweens.add({ targets: [label, title], alpha: 1, duration: 400 });

    this.time.delayedCall(beat.hold, () => {
      this.tweens.add({
        targets: [label, title], alpha: 0, duration: 400,
        onComplete: () => { label.destroy(); title.destroy(); },
      });
    });
  }

  // ---------------------------------------------------------------------------
  _fadeToNextChapter() {
    if (this._fading) return;
    this._fading = true;
    this.tweens.killAll();

    const W = GAME_W, H = GAME_H;
    const overlay = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(50);
    this.tweens.add({
      targets: overlay, alpha: 1, duration: 600,
      onComplete: () => {
        this.scene.start('PrepScene', {
          chapter:  this.nextChapter,
          saveData: this.saveData,
        });
      },
    });
  }
}
