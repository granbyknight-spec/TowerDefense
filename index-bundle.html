  constructor(def, col, row) {
    this.id       = def.id;
    this.name     = def.name;
    this.emoji    = def.emoji;
    this.unitClass = def.unitClass;
    this.team     = def.team;
    this.col      = col;
    this.row      = row;

    // Stats (copy from def)
    const s = def.baseStats;
    this.maxHp = s.maxHp;
    this.hp    = s.maxHp;
    this.atk   = s.atk;
    this.def   = s.def;
    this.mov   = s.mov;
    this.agi   = s.agi;
    this.level = s.level || 1;
    this.exp   = s.exp   || 0;

    this.maxMp = def.maxMp || 0;
    this.mp    = def.maxMp || 0;

    this._skillsAtLevel         = def.skillsAtLevel         || [];
    this._promotedSkillsAtLevel = def.promotedSkillsAtLevel || [];

    this.weapon   = def.weapon || 'sword';
    this.range    = def.range  || 1;
    this.skills   = Array.from(def.skills  || []);
    this.items    = Array.from(def.items   || []);
    this.growth   = def.growth || { hp:3, atk:2, def:1, agi:1 };
    this.ai       = def.ai    || 'aggressive';
    this.isBoss   = def.isBoss || false;
    this.tileSize = def.tileSize || 1; // footprint width & height in tiles
    this.expReward= def.expReward || 20;
    this.promoted = false;
    this.promotedData = def.promotedData || null;
    this.specialMovement = def.specialMovement || [];

    // Battle history (persisted)
    this.battlesParticipated = s.battlesParticipated || 0;
    this.killCount           = s.killCount           || 0;

    // Turn state
    this.hasMoved  = false;
    this.hasActed  = false;
    this.dead      = false;
    this.skipTurn  = false;  // guard buff used

    // Phaser display objects (assigned by scene)
    this.sprite      = null; // text object (emoji)
    this.hpBarBg     = null;
    this.hpBar       = null;
    this.highlight   = null;

    // Temporary buffs [{stat, amount, turns}]
    this.buffs = [];
  }

  // --------------------------------------------------------------------------
  get canAct()  { return !this.dead && !this.hasMoved && !this.hasActed; }
  get isPlayer(){ return this.team === 'player'; }
  get isEnemy() { return this.team === 'enemy'; }

  // --------------------------------------------------------------------------
  // Movement cost for a terrain tile (with special movement overrides)
  moveCostFor(terrainId) {
    const td = TERRAIN[terrainId];
    if (!td) return 1;
    // Special movement: can traverse normally-impassable tiles
    if (td.movCost === 99 && this.specialMovement.includes(td.name)) return 2;
    return td.movCost;
  }

  // --------------------------------------------------------------------------
  // EXP and leveling
  gainExp(amount) {
    const maxLvl = this.promoted ? 20 : 10;
    if (this.level >= maxLvl) { this.exp = 0; return false; }
    this.exp += amount;
    let leveled = false;
    while (this.exp >= 100 && this.level < maxLvl) {
      this.exp -= 100;
      this.level++;
      this._applyLevelUp();
      leveled = true;
    }
    if (this.level >= maxLvl) this.exp = 0;
    return leveled;
  }

  _applyLevelUp() {
    const g = this.growth;

    // Convert raw growth values (scale 0-6) to percentage chances, capped at 95.
    // Formula: pct = Math.min(growthVal * 25, 95)
    const toP = v => Math.min((v || 0) * 25, 95);

    // Stats subject to percentage-based rolls (everything except HP and mov).
    const rollStats = ['atk', 'def', 'agi'];
    if (this.maxMp > 0) rollStats.push('mp');

    // Helper: roll one attempt, returns gains object { atk, def, agi[, mp] }.
    const rollOnce = () => {
      const gains = {};
      for (const stat of rollStats) {
        gains[stat] = (Math.random() * 100 < toP(g[stat])) ? 1 : 0;
      }
      return gains;
    };

    // Guarantee at least 2 stat gains (max 3 roll attempts).
    let gains;
    let attempts = 0;
    do {
      gains = rollOnce();
      attempts++;
    } while (Object.values(gains).reduce((a, b) => a + b, 0) < 2 && attempts < 3);

    // If still fewer than 2 gains after 3 attempts, force the top-2 growth-rate stats.
    if (Object.values(gains).reduce((a, b) => a + b, 0) < 2) {
      // Sort roll stats by their growth percentage descending, pick top 2.
      const sorted = [...rollStats].sort((a, b) => toP(g[b]) - toP(g[a]));
      for (const stat of rollStats) gains[stat] = 0;
      gains[sorted[0]] = 1;
      if (sorted.length > 1) gains[sorted[1]] = 1;
    }

    // Apply non-HP stat gains.
    for (const stat of rollStats) {
      if (gains[stat]) {
        if (stat === 'mp') {
          this.maxMp += 1;
          this.mp = Math.min(this.mp + 1, this.maxMp);
        } else {
          this[stat] += 1;
        }
      }
    }

    // HP: always +1; roll for bonus +1 (total +2 on success).
    const hpPct  = toP(g.hp);
    const hpGain = (Math.random() * 100 < hpPct) ? 2 : 1;
    this.maxHp += hpGain;
    this.hp     = Math.min(this.hp + Math.ceil(hpGain / 2), this.maxHp);

    // Movement bonus every 4 levels.
    if (this.level % 4 === 0) this.mov = Math.min(this.mov + 1, 9);

    // Store last level-up gains for display by VictoryScene or UI.
    this.lastLevelGains = { hp: hpGain, ...gains };

    // Unlock skills at level milestones.
    const progressionList = this.promoted ? this._promotedSkillsAtLevel : this._skillsAtLevel;
    progressionList.forEach(entry => {
      if (entry.level === this.level && !this.skills.includes(entry.skill)) {
        this.skills.push(entry.skill);
      }
    });
  }

  canPromote() {
    return !this.promoted && this.level >= 10 && this.promotedData !== null;
  }

  promote() {
    if (!this.canPromote()) return false;
    const pd = this.promotedData;
    this.promoted  = true;
    this.name      = pd.name;
    this.emoji     = pd.emoji;
    this.unitClass = pd.unitClass;
    const b = pd.bonus;
    this.maxHp += b.hp;
    this.hp     = Math.min(this.hp + b.hp, this.maxHp);
    this.atk   += b.atk;
    this.def   += b.def;
    this.mov    = Math.min(this.mov + (b.mov || 0), 9);
    this.agi   += b.agi;
    this.level  = 1;
    this.exp    = 0;

    // Unlock promoted level-1 skills immediately
    this._promotedSkillsAtLevel.forEach(entry => {
      if (entry.level === 1 && !this.skills.includes(entry.skill)) {
        this.skills.push(entry.skill);
      }
    });
    return true;
  }

  recoverMp(amount) {
    this.mp = Math.min(this.mp + amount, this.maxMp);
  }

  useMp(amount) {
    this.mp = Math.max(0, this.mp - amount);
  }

  // --------------------------------------------------------------------------
  // Buff management
  applyBuff(stat, amount, turns) {
    this[stat] += amount;
    this.buffs.push({ stat, amount, turns });
  }

  tickBuffs() {
    this.buffs = this.buffs.filter(b => {
      b.turns--;
      if (b.turns <= 0) {
        this[b.stat] -= b.amount;
        return false;
      }
      return true;
    });
  }

  // --------------------------------------------------------------------------
  // Turn management
  resetTurn() {
    this.hasMoved = false;
    if (!this.isPaired) this.hasActed = false; // paired passengers stay unable to act until freed
    this.skipTurn = false;
    this.tickBuffs();
  }

  endTurn() {
    this.hasMoved = true;
    this.hasActed = true;
  }

  // --------------------------------------------------------------------------
  // Damage/healing
  takeDamage(amount) {
    this.hp = Math.max(0, this.hp - amount);
    if (this.hp === 0) this.dead = true;
    return this.hp === 0;
  }

  heal(amount) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amount);
    return this.hp - before;
  }

  // --------------------------------------------------------------------------
  // Use item
  useItem(itemId) {
    const idx = this.items.indexOf(itemId);
    if (idx < 0) return false;
    const item = ITEMS[itemId];
    if (!item) return false;
    if (item.heal) this.heal(item.heal);
    if (item.promote) this.promote();
    this.items.splice(idx, 1);
    return true;
  }

  // --------------------------------------------------------------------------
  // Serialization for save/load
  toSave() {
    return {
      id: this.id,
      name: this.name,
      emoji: this.emoji,
      hp: this.hp,
      maxHp: this.maxHp,
      atk: this.atk,
      def: this.def,
      mov: this.mov,
      agi: this.agi,
      level: this.level,
      exp: this.exp,
      promoted: this.promoted,
      weapon: this.weapon,
      range: this.range,
      unitClass: this.unitClass,
      items: [...this.items],
      skills: [...this.skills],
      mp: this.mp,
      maxMp: this.maxMp,
      battlesParticipated: this.battlesParticipated,
      killCount: this.killCount,
    };
  }

  static fromSave(saveData, def) {
    const unit = new Unit(def, 0, 0);
    unit.name     = saveData.name;
    unit.emoji    = saveData.emoji;
    unit.hp       = saveData.hp;
    unit.maxHp    = saveData.maxHp;
    unit.atk      = saveData.atk;
    unit.def      = saveData.def;
    unit.mov      = saveData.mov;
    unit.agi      = saveData.agi;
    unit.level    = saveData.level;
    unit.exp      = saveData.exp;
    unit.promoted = saveData.promoted;
    if (saveData.weapon)    unit.weapon    = saveData.weapon;
    if (saveData.range)     unit.range     = saveData.range;
    if (saveData.unitClass) unit.unitClass = saveData.unitClass;
    unit.items    = [...(saveData.items || [])];
    unit.skills   = [...(saveData.skills || [])];
    if (saveData.mp    !== undefined) unit.mp    = saveData.mp;
    if (saveData.maxMp !== undefined) unit.maxMp = saveData.maxMp;
    if (saveData.battlesParticipated !== undefined) unit.battlesParticipated = saveData.battlesParticipated;
    if (saveData.killCount           !== undefined) unit.killCount           = saveData.killCount;
    return unit;
  }

  // --------------------------------------------------------------------------
  /** Returns all {col, row} tile positions this unit occupies. */
  getTilesOccupied() {
    const tiles = [];
    for (let dc = 0; dc < this.tileSize; dc++) {
      for (let dr = 0; dr < this.tileSize; dr++) {
        tiles.push({ col: this.col + dc, row: this.row + dr });
      }
    }
    return tiles;
  }

  /** Returns true if this unit occupies the given tile. */
  isOccupyingTile(col, row) {
    return col >= this.col && col < this.col + this.tileSize &&
           row >= this.row && row < this.row + this.tileSize;
  }
}

// Puppy Force — Pathfinding.js
// Flood-fill movement range + A* path finding

// Compact binary min-heap for pathfinding priority queue
class MinHeap {
  constructor() { this._d = []; }
  push(item) {
    this._d.push(item);
    let i = this._d.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this._d[p].cost <= this._d[i].cost) break;
      [this._d[p], this._d[i]] = [this._d[i], this._d[p]];
      i = p;
    }
  }
  pop() {
    const top = this._d[0];
    const last = this._d.pop();
    if (this._d.length > 0) {
      this._d[0] = last;
      let i = 0;
      while (true) {
        let s = i, l = 2*i+1, r = 2*i+2;
        if (l < this._d.length && this._d[l].cost < this._d[s].cost) s = l;
        if (r < this._d.length && this._d[r].cost < this._d[s].cost) s = r;
        if (s === i) break;
        [this._d[s], this._d[i]] = [this._d[i], this._d[s]];
        i = s;
      }
    }
    return top;
  }
  get size() { return this._d.length; }
}

// Per-class terrain movement cost overrides
// Terrain IDs: GRASS=0, FOREST=1, MOUNTAIN=2, WATER=3, ROAD=4, SAND=5, CASTLE=6, VILLAGE=7, SNOW=8, BRIDGE=9, WALL=10, OASIS=11
const CLASS_MOV_OVERRIDES = {
  Knight:   { 5: 3 },            // sand cost 3 (armored)
  General:  { 5: 3 },            // same as Knight
  Cavalry:  { 2: 99 },           // mountains impassable
  Champion: { 2: 99 },           // same as Cavalry
  Thief:    { 1: 1, 2: 2 },     // agile: forest cost 1, mountain cost 2
  Ninja:    { 1: 1, 2: 2 },     // same as Thief
};

// Returns terrain movement cost, with optional per-unit-class overrides
function getMovCost(terrainId, unitClass) {
  const override = unitClass && CLASS_MOV_OVERRIDES[unitClass]?.[terrainId];
  if (override !== undefined) return override;
  return (TERRAIN[terrainId] || TERRAIN[0]).movCost;
}

/**
 * Returns true if ALL tiles of `unit`'s footprint anchored at (nc, nr) are:
 *  - within map bounds
 *  - not impassable terrain (movCost < 99)
 *  - not occupied by an enemy unit
 * Friendly-occupied tiles are allowed (pass-through).
 */
function _footprintClear(unit, nc, nr, mapGrid, occupied) {
  const sz = 1; // bosses move as 1x1 (visual 2x2 footprint doesn't restrict movement)
  const rows = mapGrid.length;
  const cols = mapGrid[0].length;
  for (let dc = 0; dc < sz; dc++) {
    for (let dr = 0; dr < sz; dr++) {
      const c = nc + dc, r = nr + dr;
      if (c < 0 || c >= cols || r < 0 || r >= rows) return false;
      // terrain check — use unit's moveCostFor if available, else raw tile value
      const tileId = mapGrid[r][c];
      const cost = unit.moveCostFor ? unit.moveCostFor(tileId) : (tileId === 10 || tileId === 3 ? 99 : 1);
      if (cost >= 99) return false;
      const blocker = occupied.get(`${c},${r}`);
      if (blocker && blocker.team !== unit.team) return false;
    }
  }
  return true;
}

/**
 * Returns array of {col, row} tiles a unit can reach, excluding its own tile.
 * Friendly units can be passed through but not stopped on.
 * Enemy-occupied tiles block movement.
 */
function getReachableTiles(unit, mapGrid, allUnits) {
  const rows = mapGrid.length;
  const cols = mapGrid[0].length;

  // Build occupancy map (register all tiles each unit occupies)
  const occupied = new Map();
  allUnits.forEach(u => {
    if (!u.dead && u !== unit) {
      u.getTilesOccupied().forEach(({ col, row }) => {
        occupied.set(`${col},${row}`, u);
      });
    }
  });

  const visited  = new Map(); // key -> min cost spent
  const reachable = [];
  const queue = new MinHeap();
  queue.push({ col: unit.col, row: unit.row, cost: 0 });
  visited.set(`${unit.col},${unit.row}`, 0);

  const DIR = [[0,1],[0,-1],[1,0],[-1,0]];

  while (queue.size > 0) {
    const cur = queue.pop();

    // Can we stop here?
    const occ = occupied.get(`${cur.col},${cur.row}`);
    const isOwnTile = cur.col === unit.col && cur.row === unit.row;
    if (!isOwnTile) {
      if (!occ) {
        reachable.push({ col: cur.col, row: cur.row });
      }
      // Friendly tile: can pass through but not stop
    }

    if (cur.cost >= unit.mov) continue;

    for (const [dc, dr] of DIR) {
      const nc = cur.col + dc;
      const nr = cur.row + dr;

      // Validate the full footprint at (nc, nr)
      if (!_footprintClear(unit, nc, nr, mapGrid, occupied)) continue;

      const terrainId = mapGrid[nr][nc];
      const movCost   = unit && unit.moveCostFor ? unit.moveCostFor(terrainId) : getMovCost(terrainId, unit && unit.unitClass);

      const newCost = cur.cost + movCost;
      if (newCost > unit.mov) continue;

      const key = `${nc},${nr}`;
      if (!visited.has(key) || visited.get(key) > newCost) {
        visited.set(key, newCost);
        queue.push({ col: nc, row: nr, cost: newCost });
      }
    }
  }

  return reachable;
}

/**
 * A* pathfinding from unit position to (targetCol, targetRow).
 * Returns array of {col,row} steps INCLUDING destination, or null if no path.
 * ignoreOccupancy: if true, pass through all units (used by AI for planning).
 */
function findPath(unit, targetCol, targetRow, mapGrid, allUnits, ignoreOccupancy = false) {
  const rows = mapGrid.length;
  const cols = mapGrid[0].length;

  const occupied = new Map();
  if (!ignoreOccupancy) {
    allUnits.forEach(u => {
      if (!u.dead && u !== unit) {
        u.getTilesOccupied().forEach(({ col, row }) => {
          occupied.set(`${col},${row}`, u);
        });
      }
    });
  }

  const h = (c, r) => Math.abs(c - targetCol) + Math.abs(r - targetRow);
  const key = (c, r) => `${c},${r}`;

  // A* open set uses .cost field (= f score) for the MinHeap
  const startNode = { col: unit.col, row: unit.row, g: 0, f: h(unit.col, unit.row), path: [], cost: h(unit.col, unit.row) };
  const open   = new MinHeap();
  open.push(startNode);
  const closed = new Set();
  // Track best g score per tile for duplicate detection
  const bestG = new Map();
  bestG.set(key(unit.col, unit.row), 0);

  while (open.size > 0) {
    const cur = open.pop();

    if (cur.col === targetCol && cur.row === targetRow) {
      return [...cur.path, { col: targetCol, row: targetRow }];
    }

    const ck = key(cur.col, cur.row);
    if (closed.has(ck)) continue;
    closed.add(ck);

    const DIR = [[0,1],[0,-1],[1,0],[-1,0]];
    for (const [dc, dr] of DIR) {
      const nc = cur.col + dc;
      const nr = cur.row + dr;
      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;

      const nk = key(nc, nr);
      if (closed.has(nk)) continue;

      const terrainId = mapGrid[nr][nc];
      const movCost   = unit && unit.moveCostFor ? unit.moveCostFor(terrainId) : getMovCost(terrainId, unit && unit.unitClass);
      const isTarget  = nc === targetCol && nr === targetRow;

      // Allow stepping onto target even if impassable terrain (e.g. attack from side)
      if (movCost >= 99 && !isTarget) continue;

      // For non-target tiles, validate the full footprint at (nc, nr)
      if (!isTarget && !_footprintClear(unit, nc, nr, mapGrid, occupied)) continue;

      const g = cur.g + (movCost >= 99 ? 1 : movCost);
      if (bestG.has(nk) && bestG.get(nk) <= g) continue;
      bestG.set(nk, g);
      const f = g + h(nc, nr);
      open.push({ col: nc, row: nr, g, f, cost: f,
        path: [...cur.path, { col: cur.col, row: cur.row }] });
    }
  }
  return null;
}

/**
 * Returns all tiles in attack range from a given position.
 * For tileSize=1: Manhattan distance from (col, row) to candidate tile.
 * For tileSize>1: minimum Manhattan distance from ANY footprint tile to candidate tile.
 * Range window: [minRange, unit.range].
 */
function getAttackTiles(unit, mapGrid, fromCol, fromRow) {
  const col = (fromCol !== undefined) ? fromCol : unit.col;
  const row = (fromRow !== undefined) ? fromRow : unit.row;
  const sz = unit.tileSize || 1;
  const minDist = unit.minRange || 1;
  const rows = mapGrid.length;
  const cols = mapGrid[0].length;
  const result = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // find min Manhattan dist from any footprint tile to (c, r)
      let minD = Infinity;
      for (let dc = 0; dc < sz; dc++) {
        for (let dr = 0; dr < sz; dr++) {
          const d = Math.abs((col + dc) - c) + Math.abs((row + dr) - r);
          if (d < minD) minD = d;
        }
      }
      if (minD >= minDist && minD <= unit.range) {
        result.push({ col: c, row: r });
      }
    }
  }
  return result;
}

/**
 * Check if two grid positions are adjacent (Manhattan distance = 1).
 */
function isAdjacent(c1, r1, c2, r2) {
  return Math.abs(c1 - c2) + Math.abs(r1 - r2) === 1;
}

'use strict';
// =============================================================================
// Puppy Force — EnemyAI.js
// Enemy AI decision making: aggressive, defensive, flanker, ranged, boss
// =============================================================================

/**
 * Given an enemy unit and game state, returns { moveTo:{col,row}, target:Unit|null }
 * moveTo is always a valid reachable tile (could be current position).
 */
function computeEnemyAction(unit, mapGrid, allUnits) {
  const players = allUnits.filter(u => !u.dead && u.team === 'player');
  if (players.length === 0) {
    return { moveTo: { col: unit.col, row: unit.row }, target: null };
  }

  switch (unit.ai) {
    case 'aggressive': return _aggressive(unit, mapGrid, allUnits, players);
    case 'flanker':    return _flanker(unit, mapGrid, allUnits, players);
    case 'ranged':     return _ranged(unit, mapGrid, allUnits, players);
    case 'defensive':  return _defensive(unit, mapGrid, allUnits, players);
    case 'boss':       return _boss(unit, mapGrid, allUnits, players);
    case 'healer':     return _healer(unit, mapGrid, allUnits);
    default:           return _aggressive(unit, mapGrid, allUnits, players);
  }
}

// Moves toward nearest player and attacks if in range
function _aggressive(unit, mapGrid, allUnits, players) {
  const reachable = getReachableTiles(unit, mapGrid, allUnits);
  const allTiles  = [{ col: unit.col, row: unit.row }, ...reachable];

  // Find best tile that allows attacking a player
  let bestMove = null, bestTarget = null, bestTargetHp = Infinity;

  for (const tile of allTiles) {
    const atkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
    for (const atk of atkTiles) {
      const target = players.find(u => u.col === atk.col && u.row === atk.row);
      if (target) {
        // Prefer weakest target
        if (!bestTarget || target.hp < bestTargetHp) {
          bestMove   = tile;
          bestTarget = target;
          bestTargetHp = target.hp;
        }
      }
    }
  }

  if (bestMove && bestTarget) return { moveTo: bestMove, target: bestTarget };

  // No attack possible: move toward nearest player
  const nearest = _nearestPlayer(unit, players);
  const moveTo  = _moveToward(unit, nearest, reachable);
  return { moveTo, target: null };
}

// ---------------------------------------------------------------------------
// Flanker AI — True flanking: approaches from the sides of the formation
// Targets the lowest-DEF player that is NOT the front-line unit (closest enemy)
// and tries to approach from col < leftmost_player or col > rightmost_player.
function _flanker(unit, mapGrid, allUnits, players) {
  const reachable = getReachableTiles(unit, mapGrid, allUnits);
  const allTiles  = [{ col: unit.col, row: unit.row }, ...reachable];

  // Front-line player = the one closest to this enemy unit (to avoid)
  const frontLine = _nearestPlayer(unit, players);

  // Flank target: lowest DEF player that is not the front-liner
  // Fall back to any player if all are front-liners (single player left)
  const nonFront = players.filter(p => p !== frontLine);
  const flankCandidates = nonFront.length > 0 ? nonFront : players;
  const flankTarget = flankCandidates.reduce((best, p) =>
    (p.def < best.def ? p : best), flankCandidates[0]);

  // Determine flanking column bounds (outside leftmost or rightmost player col)
  const playerCols = players.map(p => p.col);
  const leftCol    = Math.min(...playerCols);
  const rightCol   = Math.max(...playerCols);

  // Score tiles: prefer those that attack flankTarget AND approach from outside cols
  let bestMove = null, bestScore = -Infinity, bestTarget = null;

  for (const tile of allTiles) {
    const atkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
    const hitsFlank = atkTiles.some(a => a.col === flankTarget.col && a.row === flankTarget.row);
    if (!hitsFlank) continue;

    // Score: +2 if approaching from outside formation cols, else 0
    const flanking = (tile.col < leftCol || tile.col > rightCol) ? 2 : 0;
    const score = flanking;
    if (!bestMove || score > bestScore) {
      bestMove   = tile;
      bestTarget = flankTarget;
      bestScore  = score;
    }
  }

  if (bestMove && bestTarget) return { moveTo: bestMove, target: bestTarget };

  // Can't attack flankTarget yet; try any player from a flanking column tile
  for (const tile of allTiles) {
    const atkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
    for (const atk of atkTiles) {
      const target = players.find(u => u.col === atk.col && u.row === atk.row);
      if (target) return { moveTo: tile, target };
    }
  }

  // No attack possible: move toward flank target, preferring outer-column tiles
  const moveTo = _moveTowardFlanking(unit, flankTarget, reachable, leftCol, rightCol);
  return { moveTo, target: null };
}

// ---------------------------------------------------------------------------
// Ranged AI — Kiting: prefer max-range tiles; retreat if possible after attacking
function _ranged(unit, mapGrid, allUnits, players) {
  const reachable = getReachableTiles(unit, mapGrid, allUnits);
  const allTiles  = [{ col: unit.col, row: unit.row }, ...reachable];
  const maxRange  = unit.range || 1;

  let bestMove = null, bestTarget = null, bestDist = -1;

  for (const tile of allTiles) {
    const atkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
    for (const atk of atkTiles) {
      const target = players.find(u => u.col === atk.col && u.row === atk.row);
      if (!target) continue;
      const dist = Math.abs(tile.col - target.col) + Math.abs(tile.row - target.row);
      // Prefer tiles at MAX range first, then by distance desc, then weakest target on tie
      const isBetter = !bestMove
        || dist > bestDist
        || (dist === bestDist && target.hp < bestTarget.hp);
      if (isBetter) {
        bestMove   = tile;
        bestTarget = target;
        bestDist   = dist;
      }
    }
  }

  if (bestMove && bestTarget) {
    // Kiting: if we can move to a tile that is still at max range but farther from
    // all players than the current bestMove, prefer that tile.
    const kiteTile = _findKiteTile(unit, bestTarget, reachable, maxRange, players);
    if (kiteTile) return { moveTo: kiteTile, target: bestTarget };
    return { moveTo: bestMove, target: bestTarget };
  }

  // No attack possible: move AWAY from nearest player to buy time
  const nearest = _nearestPlayer(unit, players);
  const moveTo  = _moveAwayFrom(unit, nearest, reachable);
  return { moveTo, target: null };
}

// ---------------------------------------------------------------------------
// Defensive AI — Formation holding: stay put unless players are within 3 tiles
function _defensive(unit, mapGrid, allUnits, players) {
  const reachable = getReachableTiles(unit, mapGrid, allUnits);

  // Attack if someone is in range right now (from current position)
  const atkTiles = getAttackTiles(unit, mapGrid, unit.col, unit.row);
  for (const atk of atkTiles) {
    const target = players.find(u => u.col === atk.col && u.row === atk.row);
    if (target) return { moveTo: { col: unit.col, row: unit.row }, target };
  }

  // If nearest player is more than 4 tiles away, hold position
  const nearest = _nearestPlayer(unit, players);
  const distToNearest = Math.abs(nearest.col - unit.col) + Math.abs(nearest.row - unit.row);
  if (distToNearest > 4) {
    // Tighten formation: find boss unit and move 1 tile toward it, or stay put
    const boss = allUnits.find(u => !u.dead && u.team === 'enemy' && u.isBoss);
    if (boss) {
      const tightenTile = _moveToward(unit, boss, reachable);
      // Only tighten if it gets us closer to boss (max 1 tile adjustment)
      const curDistBoss = Math.abs(unit.col - boss.col) + Math.abs(unit.row - boss.row);
      const newDistBoss = Math.abs(tightenTile.col - boss.col) + Math.abs(tightenTile.row - boss.row);
      if (newDistBoss < curDistBoss) return { moveTo: tightenTile, target: null };
    }
    return { moveTo: { col: unit.col, row: unit.row }, target: null };
  }

  // Player is within 3 tiles — only advance aggressively at range ≤ 3
  if (distToNearest <= 3) {
    // Bodyguard: prefer tiles between the boss (or spawn point) and nearest player
    const boss = allUnits.find(u => !u.dead && u.team === 'enemy' && u.isBoss);
    const guardTarget = boss || nearest; // anchor point to guard in front of

    const allTiles = [{ col: unit.col, row: unit.row }, ...reachable];
    let bestMove = null, bestTarget = null;

    // Check all reachable tiles for attack opportunities, preferring bodyguard position
    let bestScore = -Infinity;
    for (const tile of allTiles) {
      const tileAtkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
      const canAtk = tileAtkTiles.some(a =>
        players.find(u => u.col === a.col && u.row === a.row)
      );

      // Bodyguard score: prefer tiles that are between boss and nearest player
      const bodyguardScore = boss
        ? _bodyguardScore(tile, boss, nearest)
        : 0;

      if (canAtk) {
        const score = 10 + bodyguardScore;
        if (score > bestScore) {
          // Find the best target from this tile (weakest player)
          let tgt = null, tgtHp = Infinity;
          for (const atk of tileAtkTiles) {
            const t = players.find(u => u.col === atk.col && u.row === atk.row);
            if (t && t.hp < tgtHp) { tgt = t; tgtHp = t.hp; }
          }
          bestMove   = tile;
          bestTarget = tgt;
          bestScore  = score;
        }
      }
    }

    if (bestMove && bestTarget) return { moveTo: bestMove, target: bestTarget };

    // No attack: advance toward nearest player from bodyguard position
    const moveTo = _moveToward(unit, nearest, reachable);
    return { moveTo, target: null };
  }

  // 3 < distToNearest <= 4: hold position
  return { moveTo: { col: unit.col, row: unit.row }, target: null };
}

// ---------------------------------------------------------------------------
// Boss AI — targets highest-ATK player (greatest threat)
function _boss(unit, mapGrid, allUnits, players) {
  const reachable = getReachableTiles(unit, mapGrid, allUnits);
  const allTiles  = [{ col: unit.col, row: unit.row }, ...reachable];

  // Priority: highest ATK first (greatest threat), break ties by lowest HP
  const priority = [...players].sort((a, b) =>
    b.atk !== a.atk ? b.atk - a.atk : a.hp - b.hp
  );

  for (const p of priority) {
    for (const tile of allTiles) {
      const atkTiles = getAttackTiles(unit, mapGrid, tile.col, tile.row);
      if (atkTiles.some(a => a.col === p.col && a.row === p.row)) {
        return { moveTo: tile, target: p };
      }
    }
  }

  // Move toward priority target (highest ATK)
  const moveTo = _moveToward(unit, priority[0], reachable);
  return { moveTo, target: null };
}

// --------------------------------------------------------------------------
// Helpers

function _nearestPlayer(unit, players) {
  return players.reduce((best, p) => {
    const da = Math.abs(unit.col - best.col) + Math.abs(unit.row - best.row);
    const db = Math.abs(unit.col - p.col)    + Math.abs(unit.row - p.row);
    return db < da ? p : best;
  });
}

function _moveToward(unit, target, reachable) {
  if (reachable.length === 0) return { col: unit.col, row: unit.row };
  // Current tile is also a valid option
  const all = [{ col: unit.col, row: unit.row }, ...reachable];
  return all.reduce((best, tile) => {
    const da = Math.abs(best.col - target.col) + Math.abs(best.row - target.row);
    const db = Math.abs(tile.col - target.col) + Math.abs(tile.row - target.row);
    return db < da ? tile : best;
  });
}

// Move AWAY from a target — find reachable tile that maximizes distance
function _moveAwayFrom(unit, target, reachable) {
  if (reachable.length === 0) return { col: unit.col, row: unit.row };
  const all = [{ col: unit.col, row: unit.row }, ...reachable];
  return all.reduce((best, tile) => {
    const da = Math.abs(best.col - target.col) + Math.abs(best.row - target.row);
    const db = Math.abs(tile.col - target.col) + Math.abs(tile.row - target.row);
    return db > da ? tile : best;
  });
}

// Kiting helper: find a reachable tile that can still attack `target` at exactly
// maxRange distance AND is farther from ALL players than the current position.
// Returns null if no such tile exists (caller falls back to bestMove).
function _findKiteTile(unit, target, reachable, maxRange, players) {
  const curDist = _totalDistToPlayers(unit.col, unit.row, players);
  let kiteTile = null, kiteDist = curDist;

  for (const tile of reachable) {
    const distToTarget = Math.abs(tile.col - target.col) + Math.abs(tile.row - target.row);
    if (distToTarget !== maxRange) continue; // must stay at max range of chosen target
    const totalDist = _totalDistToPlayers(tile.col, tile.row, players);
    if (totalDist > kiteDist) {
      kiteDist = totalDist;
      kiteTile = tile;
    }
  }
  return kiteTile;
}

function _totalDistToPlayers(col, row, players) {
  return players.reduce((sum, p) =>
    sum + Math.abs(col - p.col) + Math.abs(row - p.row), 0);
}

// Move toward target preferring tiles outside formation column bounds
function _moveTowardFlanking(unit, target, reachable, leftCol, rightCol) {
  if (reachable.length === 0) return { col: unit.col, row: unit.row };
  const all = [{ col: unit.col, row: unit.row }, ...reachable];
  return all.reduce((best, tile) => {
    const distA = Math.abs(best.col - target.col) + Math.abs(best.row - target.row);
    const distB = Math.abs(tile.col - target.col) + Math.abs(tile.row - target.row);
    const flankA = (best.col < leftCol || best.col > rightCol) ? 1 : 0;
    const flankB = (tile.col < leftCol || tile.col > rightCol) ? 1 : 0;
    // Primary: flanking bonus; secondary: closeness to target
    if (flankB !== flankA) return flankB > flankA ? tile : best;
    return distB < distA ? tile : best;
  });
}

// Bodyguard score: higher when the tile is between the boss and the nearest player
// Uses dot-product approach: positive when tile is "in front of" boss toward player
function _bodyguardScore(tile, boss, player) {
  // Vector from boss to player
  const bpCol = player.col - boss.col;
  const bpRow = player.row - boss.row;
  // Vector from boss to tile
  const btCol = tile.col - boss.col;
  const btRow = tile.row - boss.row;
  // Dot product: positive = tile is on the boss→player side
  return bpCol * btCol + bpRow * btRow;
}

// ---------------------------------------------------------------------------
// Healer AI — find weakest injured ally in range and heal; else move toward weakest
function _healer(unit, mapGrid, allUnits) {
  const allies = allUnits.filter(u => !u.dead && u.team === 'enemy' && u !== unit);
  const reachable = getReachableTiles(unit, mapGrid, allUnits);
  const allPositions = [{ col: unit.col, row: unit.row }, ...reachable];
  const range = unit.range || 2;

  let bestMove = null, bestTarget = null, bestMissing = 0;

  for (const pos of allPositions) {
    for (const ally of allies) {
      if (ally.hp >= ally.maxHp) continue;
      const dist = Math.abs(pos.col - ally.col) + Math.abs(pos.row - ally.row);
      if (dist > range) continue;
      const missing = ally.maxHp - ally.hp;
      if (missing > bestMissing) {
        bestMissing = missing;
        bestTarget = ally;
        bestMove = pos;
      }
    }
  }

  if (bestMove && bestTarget) {
    return { moveTo: bestMove, target: bestTarget, isHeal: true };
  }

  // No hurt allies in heal range — move toward weakest ally
  if (allies.length > 0) {
    const weakest = allies.reduce((w, a) => (a.hp / a.maxHp < w.hp / w.maxHp ? a : w));
    const moveTo = reachable.length > 0
      ? reachable.reduce((best, t) => {
          const dBest = Math.abs(best.col - weakest.col) + Math.abs(best.row - weakest.row);
          const dT    = Math.abs(t.col   - weakest.col) + Math.abs(t.row   - weakest.row);
          return dT < dBest ? t : best;
        }, { col: unit.col, row: unit.row })
      : { col: unit.col, row: unit.row };
    return { moveTo, target: null };
  }

  // m6: No allies at all — fall back based on weapon type
  if (unit.weapon === 'staff') {
    // Staff healers cannot attack players; pre-position near weakest ally instead
    // (allies array is empty here, so stay put)
    return { moveTo: { col: unit.col, row: unit.row }, target: null };
  }

  // Non-staff healer: fall back to defensive attack behavior
  const players = allUnits.filter(u => !u.dead && u.team === 'player');
  if (players.length > 0) {
    // Move toward nearest player and attack if in range
    const nearest = players.reduce((n, p) => {
      const dN = Math.abs(n.col - unit.col) + Math.abs(n.row - unit.row);
      const dP = Math.abs(p.col - unit.col) + Math.abs(p.row - unit.row);
      return dP < dN ? p : n;
    });
    // Check if any player in attack range from current or reachable position
    const nonStaffRange = unit.range || 1;
    let attackMove = null, attackTarget = null;
    for (const pos of [{ col: unit.col, row: unit.row }, ...reachable]) {
      for (const player of players) {
        const dist = Math.abs(pos.col - player.col) + Math.abs(pos.row - player.row);
        if (dist <= nonStaffRange) {
          attackMove = pos;
          attackTarget = player;
          break;
        }
      }
      if (attackTarget) break;
    }
    if (attackMove && attackTarget) {
      return { moveTo: attackMove, target: attackTarget, isHeal: false };
    }
    // Move toward nearest player without attacking
    const moveTo = reachable.length > 0
      ? reachable.reduce((best, t) => {
          const dB = Math.abs(best.col - nearest.col) + Math.abs(best.row - nearest.row);
          const dT = Math.abs(t.col - nearest.col) + Math.abs(t.row - nearest.row);
          return dT < dB ? t : best;
        }, { col: unit.col, row: unit.row })
      : { col: unit.col, row: unit.row };
    return { moveTo, target: null };
  }
  return { moveTo: { col: unit.col, row: unit.row }, target: null };
}

// Helper: build a Unit from an enemy spawn definition
function buildEnemyUnit(spawnDef, allUnits) {
  const def = ENEMY_DEFS[spawnDef.defId];
  if (!def) { console.warn('Unknown enemy def:', spawnDef.defId); return null; }

  // Clone the def so we can scale stats by level
  const scaledDef = JSON.parse(JSON.stringify(def));
  const baseLevel  = scaledDef.baseStats.level;
  const levelDiff  = Math.max(0, (spawnDef.level || baseLevel) - baseLevel);
  const g = scaledDef.growth || { hp:2, atk:1, def:1, agi:1 };

  scaledDef.baseStats.level  = spawnDef.level || baseLevel;
  scaledDef.baseStats.maxHp += g.hp  * levelDiff;
  scaledDef.baseStats.atk   += g.atk * levelDiff;
  scaledDef.baseStats.def   += g.def * levelDiff;
  // m8: AGI scales at 50% rate (half of other stats) to prevent high-level enemies being easily double-attacked
  scaledDef.baseStats.agi   += Math.floor((g.agi || 0) * 0.5 * levelDiff);

  const unit = new Unit(scaledDef, spawnDef.col, spawnDef.row);
  return unit;
}

'use strict';
// =============================================================================
// Puppy Force — SaveManager.js
// localStorage save / load for roster and chapter progress
// =============================================================================

const SAVE_KEY = 'puppy_force_save_v1';

const SaveManager = {

  // Returns default fresh save
  newGame() {
    return {
      currentChapter: 1,
      completedChapters: [],
      roster: _buildDefaultRoster(),
    };
  },

  save(data) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.warn('Save failed:', e);
      return false;
    }
  },

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Load failed:', e);
      return null;
    }
  },

  hasSave() {
    return localStorage.getItem(SAVE_KEY) !== null;
  },

  deleteSave() {
    localStorage.removeItem(SAVE_KEY);
  },

  // Serialize live Unit objects to save-friendly format
  serializeRoster(units) {
    return units.map(u => u.toSave());
  },

  // Rebuild Unit objects from save data
  deserializeRoster(saveRoster) {
    const units = [];
    for (const sd of saveRoster) {
      const def = HERO_DEFS[sd.id] || ALLY_DEFS[sd.id];
      if (!def) continue;
      const unit = Unit.fromSave(sd, def);
      // Backward compatibility: old saves without weapon/range/unitClass for promoted units
      if (sd.promoted && def.promotedData) {
        if (!sd.weapon)    unit.weapon    = def.promotedData.weapon    || def.weapon || 'sword';
        if (!sd.range)     unit.range     = def.promotedData.range     || def.range  || 1;
        if (!sd.unitClass) unit.unitClass = def.promotedData.unitClass || def.unitClass;
      }
      unit.hp = unit.maxHp;
      units.push(unit);
    }
    return units;
  },

  // Per-unit art style preference (persisted separately from save data)
  // Returns the saved style string ('dark'|'chibi'|'svg') or null (auto).
  getUnitStyle(unitId) {
    const prefs = JSON.parse(localStorage.getItem('pf_unit_styles') || '{}');
    return prefs[unitId] || null;
  },

  // Persist the chosen art style for a unit.
  setUnitStyle(unitId, style) {
    const prefs = JSON.parse(localStorage.getItem('pf_unit_styles') || '{}');
    prefs[unitId] = style;
    localStorage.setItem('pf_unit_styles', JSON.stringify(prefs));
  },

  // Global sprite style for battle map display ('chibi' | 'dark'). Defaults to 'chibi'.
  getArtStyle() {
    return localStorage.getItem('pf_art_style') || 'chibi';
  },
  setArtStyle(style) {
    localStorage.setItem('pf_art_style', style);
  },
};

// Build the starting roster from hero definitions
function _buildDefaultRoster() {
  const ids = ['PUPPY_KNIGHT','CORGI_HEALER','LABRADOR_SCOUT',
               'POODLE_MAGE','HUSKY_RIDER','BEAGLE_ARCHER','TERRIER_THIEF'];
  return ids.map(id => {
    const def  = HERO_DEFS[id];
    const unit = new Unit(def, 0, 0);
    return unit.toSave();
  });
}

  const b64 = btoa(unescape(encodeURIComponent(svgStr)));

/**
 * Register all SVG textures as Phaser canvas textures.
 * Call in BattleScene.preload().
 */
function preloadUnitSprites(scene) {
  const all = [...Object.entries(UNIT_SPRITES), ...Object.entries(FALLBACK_SPRITES)];
  for (const [, info] of all) {
    if (scene.textures.exists(info.key)) continue;
    const ct  = scene.textures.createCanvas(info.key, 64, 64);
    const uri = svgToDataURI(info.svg);
    const img = new Image();
    img.onload  = () => { ct.getContext().drawImage(img, 0, 0, 64, 64); ct.refresh(); };
    img.onerror = () => console.warn('[SpriteSheet] failed:', info.key);
    img.src = uri;
  }
}

/**
 * Returns the Phaser texture key for a given unit.
 */
function getSpriteKey(unit, scene) {
  if (scene && typeof SaveManager !== 'undefined') {
    const preferred = SaveManager.getArtStyle(); // 'chibi' | 'dark', defaults to 'chibi'
    const fallback  = preferred === 'chibi' ? 'dark' : 'chibi';
    const prefKey  = `inn_${preferred}_${unit.id}`;
    const fallKey  = `inn_${fallback}_${unit.id}`;
    if (scene.textures.exists(prefKey))  return prefKey;
    if (scene.textures.exists(fallKey))  return fallKey;
  }
  if (unit.promoted && unit.id === 'PUPPY_KNIGHT') return UNIT_SPRITES['DOG_PALADIN'].key;
  const info = UNIT_SPRITES[unit.id];
  if (info) return info.key;
  return (FALLBACK_SPRITES[unit.team] || FALLBACK_SPRITES['neutral']).key;
}

'use strict';
// =============================================================================
// Puppy Force — AudioManager.js
// Static utility class wrapping Phaser 3's sound system.
// All audio files are OPTIONAL — gracefully skipped if not yet present.
// =============================================================================

class AudioManager {
  // --------------------------------------------------------------------------
  // PRELOAD helpers (call from each scene's preload())
  // --------------------------------------------------------------------------

  static preloadMusic(scene) {
    const tracks = [
      { key: 'battle',    path: 'assets/audio/music/battle.mp3'    },
      { key: 'title',     path: 'assets/audio/music/title.mp3'     },
      { key: 'victory',   path: 'assets/audio/music/victory.mp3'   },
      { key: 'overworld', path: 'assets/audio/music/overworld.mp3' },
    ];
    tracks.forEach(({ key, path }) => {
      // Skip if already cached (prevents duplicate-load warnings on scene restart)
      if (scene.cache && scene.cache.audio && scene.cache.audio.exists(key)) return;
      try {
        scene.load.audio(key, path);
      } catch (e) {
        console.error('[AudioManager] preloadMusic failed for', key, e);
      }
    });
  }

  static preloadSFX(scene) {
    const sfx = [
      { key: 'attack_slash',   path: 'assets/audio/sfx/attack_slash.mp3'   },
      { key: 'magic_cast',     path: 'assets/audio/sfx/magic_cast.mp3'     },
      { key: 'heal',           path: 'assets/audio/sfx/heal.mp3'           },
      { key: 'level_up',       path: 'assets/audio/sfx/level_up.mp3'       },
      { key: 'cursor_move',    path: 'assets/audio/sfx/cursor_move.mp3'    },
      { key: 'unit_death',     path: 'assets/audio/sfx/unit_death.mp3'     },
      { key: 'burn_crackle',   path: 'assets/audio/sfx/burn_crackle.mp3'   },
      { key: 'victory_fanfare',path: 'assets/audio/sfx/victory_fanfare.mp3'},
      { key: 'defeat_sting',   path: 'assets/audio/sfx/defeat_sting.mp3'   },
      { key: 'dog_bark',       path: 'assets/audio/sfx/dog_bark.mp3'       },
    ];
    sfx.forEach(({ key, path }) => {
      if (scene.cache && scene.cache.audio && scene.cache.audio.exists(key)) return;
      try {
        scene.load.audio(key, path);
      } catch (e) {
        console.error('[AudioManager] preloadSFX failed for', key, e);
      }
    });
  }

  // --------------------------------------------------------------------------
  // MUSIC (looping background tracks)
  // --------------------------------------------------------------------------

  // Play a looping music track. Replaces the currently playing track.
  // Skips gracefully if the audio key is not loaded.
  // Defers playback until after the first user gesture if the Web Audio
  // context is still suspended (browser autoplay policy).
  static playMusic(scene, key, volume = 0.5) {
    console.log('[AudioManager] playMusic called', key, 'exists:', scene.cache && scene.cache.audio && scene.cache.audio.exists(key), 'locked:', scene.sound && scene.sound.locked);
    if (AudioManager._currentMusicKey === key && AudioManager._currentMusic && AudioManager._currentMusic.isPlaying) {
      return;
    }
    AudioManager.stopMusic(scene);
    if (!scene.cache || !scene.cache.audio || !scene.cache.audio.exists(key)) return;

    if (scene.sound.locked) {
      // Store the latest intent — overwrites any earlier pending request
      AudioManager._pendingKey    = key;
      AudioManager._pendingVolume = volume;
      AudioManager._pendingScene  = scene;
      // Register the unlock handler only once
      if (!AudioManager._unlockBound) {
        AudioManager._unlockBound = true;
        scene.sound.once('unlocked', () => {
          AudioManager._unlockBound = false;
          if (AudioManager._pendingKey) {
            AudioManager._startTrack(
              AudioManager._pendingScene,
              AudioManager._pendingKey,
              AudioManager._pendingVolume
            );
            AudioManager._pendingKey    = null;
            AudioManager._pendingVolume = null;
            AudioManager._pendingScene  = null;
          }
        });
      }
    } else {
      AudioManager._startTrack(scene, key, volume);
    }
  }

  static _startTrack(scene, key, volume) {
    try {
      const music = scene.sound.add(key, { loop: true, volume });
      music.play();
      AudioManager._currentMusic    = music;
      AudioManager._currentMusicKey = key;
    } catch (e) {
      console.error('[AudioManager] playMusic failed for', key, e);
    }
  }

  // Stop current background music
  static stopMusic(scene) {
    if (AudioManager._currentMusic) {
      try {
        AudioManager._currentMusic.stop();
        AudioManager._currentMusic.destroy();
      } catch (e) {
        // Ignore — music object may already be destroyed if scene was restarted
      }
      AudioManager._currentMusic    = null;
      AudioManager._currentMusicKey = null;
    }
  }

  // --------------------------------------------------------------------------
  // SFX (one-shot sounds)
  // --------------------------------------------------------------------------

  // Play a one-shot sound effect. Silently skips if key is not loaded.
  static play(scene, key, volume = 1.0) {
    if (!scene.cache || !scene.cache.audio || !scene.cache.audio.exists(key)) return;
    try {
      scene.sound.play(key, { volume });
    } catch (e) {
      console.error('[AudioManager] play failed for', key, e);
    }
  }
}

// Static state — shared across all scenes
AudioManager._currentMusic    = null;
AudioManager._currentMusicKey = null;
AudioManager._pendingKey      = null;
AudioManager._pendingVolume   = null;
AudioManager._pendingScene    = null;
AudioManager._unlockBound     = false;

    bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 4);
    bg.lineStyle(1, 0x2255aa, 0.7);
    bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 4);

    this.add.text(x, y - 4, `Ch${chapNum}`, {
      fontSize: '10px', color: '#aaccff',
      fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
    }).setOrigin(0.5).setDepth(1);
    this.add.text(x, y + 5, `Lv${targetLv}`, {
      fontSize: '9px', color: '#7799bb',
      fontFamily: 'Nunito, Courier New, monospace',
    }).setOrigin(0.5).setDepth(1);

    const zone = this.add.zone(x, y, W_btn, H_btn).setInteractive({ useHandCursor: true });
    zone.on('pointerover',  () => { bg.clear(); bg.fillStyle(0x1a3355, 1); bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 4); });
    zone.on('pointerout',   () => { bg.clear(); bg.fillStyle(0x112233, 0.9); bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 4); bg.lineStyle(1, 0x2255aa, 0.7); bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 4); });
    zone.on('pointerdown',  () => { setTimeout(cb, 80); });
  }

  _makeSmallDebugBtn(x, y, label, cb) {
    const W_btn = 210, H_btn = 24;
    const bg = this.add.graphics();
    bg.fillStyle(0x111122, 0.85);
    bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 5);
    bg.lineStyle(1, 0x334455, 0.6);
    bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 5);

    const txt = this.add.text(x, y, label, {
      fontSize: '11px', color: '#8899bb',
      fontFamily: 'Nunito, Courier New, monospace',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    const zone = this.add.zone(x, y, W_btn, H_btn).setInteractive({ useHandCursor: true });
    zone.on('pointerover',  () => txt.setColor('#8899bb'));
    zone.on('pointerout',   () => txt.setColor('#556677'));
    zone.on('pointerdown',  () => { setTimeout(cb, 80); });
  }
}

// Build a save-data object with all heroes leveled to chapter-appropriate level
function _buildDebugSaveData(chapterNumber) {
  const data = SaveManager.newGame();
  const targetLevel = DEBUG_CHAPTER_LEVELS[chapterNumber] || 1;

  // Build roster from ALL hero definitions so later chapters have full party
  const units = Object.keys(HERO_DEFS).map(id => new Unit(HERO_DEFS[id], 0, 0));

  if (targetLevel > 1) {
    units.forEach(u => {
      while (u.level < targetLevel) {
        u.gainExp(999);
      }
      u.hp = u.maxHp;
    });
  }

  data.roster = SaveManager.serializeRoster(units);
  data.currentChapter = chapterNumber;
  data.completedChapters = Array.from({ length: chapterNumber - 1 }, (_, i) => i + 1);
  return data;
}

'use strict';
// =============================================================================
// Puppy Force — BattleScene.js
// Core turn-based tactical battle
// =============================================================================

// State machine states
const BS = {
  IDLE:         'IDLE',
  UNIT_SEL:     'UNIT_SEL',
  UNIT_MOVED:   'UNIT_MOVED',
  TARGET_ATK:   'TARGET_ATK',
  TARGET_HEAL:  'TARGET_HEAL',
  ENEMY_TURN:   'ENEMY_TURN',
  ANIMATING:    'ANIMATING',
  DIALOGUE:     'DIALOGUE',
  VICTORY:      'VICTORY',
  DEFEAT:       'DEFEAT',
};

class BattleScene extends Phaser.Scene {
  constructor() { super({ key: 'BattleScene' }); }

  // --------------------------------------------------------------------------
  preload() {
    // Load all unit SVG sprites as Phaser textures (self-contained data URIs)
    preloadUnitSprites(this);
    // Audio (graceful — files are optional and may not exist yet)
    AudioManager.preloadMusic(this);
    AudioManager.preloadSFX(this);
    // Suppress load errors for missing optional art assets
    this.load.on('loaderror', () => {}); // silently skip missing optional assets
    // Battle background for current chapter (graceful — file may not exist)
    try {
      const bgKey = `bg_ch${this.chapterId}`;
      this.load.image(bgKey, `assets/backgrounds/chapter_${this.chapterId}_v1.png`);
    } catch (e) {
      // silently skip if the file doesn't exist
    }
    // Enemy portrait/sprite PNG overrides (graceful — fall back to SVG if missing)
    // File naming convention: assets/enemies/<lowercase_id>_v1.png
    const ENEMY_PNG_IDS = [
      'SCOUT_CAT',
      'ALLEY_CAT',
      'SIAMESE_ASSASSIN',
      'PERSIAN_SORCERER',
      'TIGER_GENERAL',
      'LYNX_RANGER',
      'SNOW_LEOPARD',
      'RIVER_PANTHER',
      'SAND_CAT_KING',
      'PERSIAN_QUEEN',
      'CAT_EMPEROR',
    ];
    ENEMY_PNG_IDS.forEach(id => {
      const pngKey = `enemy_png_${id}`;
      if (!this.textures.exists(pngKey)) {
        const fileName = id.toLowerCase() + '_v1.png';
        try {
          this.load.image(pngKey, `assets/enemies/${fileName}`);
        } catch (e) {
          // silently skip — SVG fallback will be used
        }
      }
    });
    // Player chibi PNGs — generated by generate-characters.js using AI Horde
    // File naming: assets/characters/<id>_chibi_v1.png  (graceful — falls back to SVG dog)
    const PLAYER_PNG_IDS = [
      'PUPPY_KNIGHT', 'CORGI_HEALER', 'LABRADOR_SCOUT', 'BEAGLE_ARCHER',
      'POODLE_MAGE', 'BULLDOG_TANK', 'HUSKY_RIDER', 'TERRIER_THIEF',
      'FOX_SCOUT', 'OTTER_ALLY', 'DOG_PALADIN',
    ];
    PLAYER_PNG_IDS.forEach(id => {
      const pngKey = `player_png_${id}`;
      if (!this.textures.exists(pngKey)) {
        try {
          this.load.image(pngKey, `assets/characters/${id.toLowerCase()}_chibi_v1.png`);
        } catch (e) {
          // silently skip — SVG dog sprite will be used instead
        }
      }
    });
    // Terrain tile PNGs (graceful — fall back to colored graphics if missing)
    TERRAIN.forEach((td, i) => {
      const key = `terrain_${i}`;
      if (!this.textures.exists(key)) {
        try {
          this.load.image(key, `assets/terrain/${td.name.toLowerCase()}_v1.png`);
        } catch (e) {
          // silently skip — colored rectangle fallback used in _buildMap
        }
      }
    });
    // Inn art-style variants — match InnScene's file naming exactly
    Object.keys(HERO_DEFS || {}).forEach(id => {
      const lc = id.toLowerCase();
      if (!this.textures.exists(`inn_dark_${id}`))
        this.load.image(`inn_dark_${id}`,  `assets/characters/${lc}_sprite_v1.png`);
      if (!this.textures.exists(`inn_chibi_${id}`))
        this.load.image(`inn_chibi_${id}`, `assets/characters/${lc}_chibi_v1.png`);
    });
    Object.keys(ENEMY_DEFS || {}).forEach(id => {
      const lc = id.toLowerCase();
      if (!this.textures.exists(`inn_dark_${id}`))
        this.load.image(`inn_dark_${id}`,  `assets/enemies/${lc}_pl_v1.png`);
      if (!this.textures.exists(`inn_chibi_${id}`))
        this.load.image(`inn_chibi_${id}`, `assets/enemies/${lc}_chibi_v1.png`);
    });
  }

  // --------------------------------------------------------------------------
  init(data) {
    this.chapterId  = data.chapter || 1;
    this.saveData   = data.saveData || SaveManager.newGame();
    this._state     = BS.IDLE;
    this._selected  = null;    // selected Unit
    this._moveTiles = [];      // reachable tiles
    this._atkTiles  = [];      // attackable tiles
    this._healTiles = [];      // heal-range tiles
    this._preMovPos   = null;    // {col,row} before move for undo
    this._pendingSkill= null;    // offensive skill queued before attack target
    this._lastSkillUsed = null;  // skill used in last _executeCombat call
    this._dlgQueue  = [];        // dialogue lines
    this._dlgIndex  = 0;
    this._enemyQueue= [];      // enemies still to act this turn
    this._levelUps  = [];      // collected during battle
    this._newUnits  = [];      // newly recruited
    this._battleEnded = false; // latch: prevents _endBattle from firing twice
    this._battleGen   = (this._battleGen || 0) + 1; // generation counter for setTimeout safety
    this.turnNumber = 1;
    this._dangerZoneActive = false;
    this._dangerGfx = null;
    this.playerTurn = true;
    this._enemyFast = false;
  }

  // --------------------------------------------------------------------------
  create() {
    const chapter = CHAPTERS[this.chapterId - 1];

    // Load roster from save, then place units
    this.roster = SaveManager.deserializeRoster(this.saveData.roster);
    this.mapGrid= chapter.mapGrid;
    this.units  = [];

    // ── Build player units ──────────────────────────────────────────────────
    const maxSlots = Math.min(chapter.playerStart.length, 8);
    for (let i = 0; i < maxSlots; i++) {
      const slot = chapter.playerStart[i];
      const saved= this.roster.find(u => u.id === slot.unitId);
      if (!saved) continue;
      saved.col = slot.col;
      saved.row = slot.row;
      this.units.push(saved);
    }

    // ── Track battle participation ───────────────────────────────────────────
    this.units.filter(u => u.team === 'player').forEach(u => u.battlesParticipated++);

    // ── Build enemy units ───────────────────────────────────────────────────
    chapter.enemies.forEach(spawn => {
      const enemy = buildEnemyUnit(spawn, this.units);
      if (enemy) {
        if (spawn.deathQuote) enemy.deathQuote = spawn.deathQuote;
        if (spawn.isBoss) enemy.isBoss = true;
        this.units.push(enemy);
      }
    });

    // ── Build recruitable units (neutral, stand still) ─────────────────────
    this._recruitables = [];
    (chapter.recruitable || []).forEach(r => {
      const def  = HERO_DEFS[r.unitId] || ALLY_DEFS[r.unitId];
      if (!def) return;
      const unit = new Unit(def, r.col, r.row);
      unit.team  = 'neutral';
      unit.rescueMsg = r.rescueMsg;
      this.units.push(unit);
      this._recruitables.push(unit);
    });

    // ── Battle stats for win screen ─────────────────────────────────────────
    this._totalDamageDealt = 0;
    this._unitsLost        = 0;

    // ── Dark background behind the tile grid ────────────────────────────────
    this.add.graphics().setDepth(-20)
      .fillStyle(PAL.BG, 1)
      .fillRect(0, 0, GAME_W, GAME_H);

    // ── Build map and sprites ────────────────────────────────────────────────
    this._buildMap();
    this._buildHighlightLayers();
    this._buildUnitSprites();
    this._buildGridOverlay();

    // ── Camera bounds (support large maps) ───────────────────────────────────
    const mapPixelW = this.mapGrid[0].length * TILE + GRID_X * 2;
    const mapPixelH = this.mapGrid.length    * TILE + GRID_Y * 2;
    this.cameras.main.setBounds(0, 0, mapPixelW, mapPixelH);

    // ── Pan state ────────────────────────────────────────────────────────────
    this._panStart = null;   // {x, y, camX, camY} when drag begins
    this._panning  = false;

    // ── Center camera on player units at start ───────────────────────────────
    const players = this.units.filter(u => u.team === 'player' && !u.dead);
    if (players.length > 0) {
      const avgCol = players.reduce((s, u) => s + u.col, 0) / players.length;
      const avgRow = players.reduce((s, u) => s + u.row, 0) / players.length;
      const { x, y } = this._tileCenter(Math.round(avgCol), Math.round(avgRow));
      this.cameras.main.centerOn(x, y);
    }

    // ── Battle music ─────────────────────────────────────────────────────────
    if (this.cache.audio.exists('battle')) {
      AudioManager.playMusic(this, 'battle');
    } else {
      this.load.once('complete', () => AudioManager.playMusic(this, 'battle'));
      this.load.start();
    }

    // ── UIScene overlay (runs parallel) ─────────────────────────────────────
    if (!this.scene.isActive('UIScene')) {
      this.scene.launch('UIScene', { battleScene: this });
    } else {
      this.scene.get('UIScene').reset(this);
    }

    // ── Input ────────────────────────────────────────────────────────────────
    this.input.on('pointerdown', (pointer) => {
      // Record pan start position for drag-to-pan detection
      this._panStart = {
        x: pointer.x, y: pointer.y,
        camX: this.cameras.main.scrollX,
        camY: this.cameras.main.scrollY,
      };
      this._panning = false;
    }, this);
    this.input.on('pointerdown', this._onTap, this);

    // ── Pinch-to-zoom (two-finger) ───────────────────────────────────────────
    this.input.manager.addPointer(1);   // enable 2nd pointer slot
    this._pinchActive = false;
    this._pinchDist0  = 0;
    this._pinchZoom0  = 1;
    this.input.on('pointermove', (pointer) => {
      const down = this.input.manager.pointers.filter(p => p.isDown);
      if (down.length < 2) {
        this._pinchActive = false;
        // Single-finger drag-to-pan
        if (this._panStart) {
          const dx = pointer.x - this._panStart.x;
          const dy = pointer.y - this._panStart.y;
          if (!this._panning && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
            this._panning = true;
          }
          if (this._panning) {
            this.cameras.main.setScroll(
              this._panStart.camX - dx,
              this._panStart.camY - dy
            );
          }
        }
        return;
      }
      const dx   = down[0].x - down[1].x;
      const dy   = down[0].y - down[1].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (!this._pinchActive) {
        this._pinchActive = true;
        this._pinchDist0  = dist;
        this._pinchZoom0  = this.cameras.main.zoom;
      } else {
        const z = Phaser.Math.Clamp(this._pinchZoom0 * (dist / this._pinchDist0), 1, 2.5);
        this.cameras.main.setZoom(z);
      }
      // M2: Live combat forecast on hover during target selection
      if (this._state === BS.TARGET_ATK && !this._panning) {
        const hCol = Math.floor((pointer.worldX - GRID_X) / TILE);
        const hRow = Math.floor((pointer.worldY - GRID_Y) / TILE);
        const cols = this.mapGrid[0]?.length || 0;
        const rows = this.mapGrid.length || 0;
        if (hCol >= 0 && hCol < cols && hRow >= 0 && hRow < rows) {
          const hoverTarget = this._unitAt(hCol, hRow);
          if (hoverTarget && hoverTarget.team === 'enemy' && this._selected) {
            const tDef = TERRAIN[this.mapGrid[hoverTarget.row]?.[hoverTarget.col]]?.def || 0;
            const eff = typeof this._weaponEffectiveness === 'function'
              ? this._weaponEffectiveness(this._selected, hoverTarget) : 1.0;
            const atkTDef = TERRAIN[this.mapGrid[this._selected.row]?.[this._selected.col]]?.def || 0;
            this._getUI()?.showDamagePreview(this._selected, hoverTarget, tDef, eff, { defenderTerrainDef: atkTDef });
          } else {
            this._getUI()?.hideDamagePreview();
          }
        }
      }
    });

    // ── Pointer up — clear pan state ─────────────────────────────────────────
    this.input.on('pointerup', () => {
      this._panStart = null;
      this._panning  = false;
    }, this);

    // ── Opening dialogue → boss intro → IDLE ─────────────────────────────────
    const intro    = chapter.intro || [];
    const afterIntro = () => {
      const bossUnit = chapter.bossId
        ? this.units.find(u => u.id === chapter.bossId && !u.dead)
        : this.units.find(u => u.isBoss && !u.dead);
      if (bossUnit) {
        this._showBossIntro(bossUnit, () => this._setState(BS.IDLE));
      } else {
        this._setState(BS.IDLE);
      }
    };
    if (intro.length > 0) {
      this._startDialogue(intro, afterIntro);
    } else {
      afterIntro();
    }
  }

  // ==========================================================================
  // MAP RENDERING
  // ==========================================================================

  _buildMap() {
    this._tileGfx = this.add.graphics().setDepth(-4);
    const g = this._tileGfx;

    for (let row = 0; row < this.mapGrid.length; row++) {
      for (let col = 0; col < this.mapGrid[0].length; col++) {
        const tid = this.mapGrid[row][col];
        const td  = TERRAIN[tid];
        const x   = GRID_X + col * TILE;
        const y   = GRID_Y + row * TILE;

        // Base fill
        g.fillStyle(td.color, 1);
        g.fillRect(x, y, TILE, TILE);

        // GBA-style pixel art detail
        this._drawTerrainDetail(g, tid, x, y);

        // Crisp 1px dark border (right + bottom edges only — avoids double-drawing)
        g.fillStyle(0x000000, 0.18);
        g.fillRect(x + TILE - 1, y, 1, TILE);
        g.fillRect(x, y + TILE - 1, TILE, 1);
      }
    }
  }

  // Draw GBA-style pixel art detail on top of the base tile fill.
  // Each terrain type uses fillRect / fillCircle / fillEllipse only — no lineStyle —
  // so the look is clean, opaque, and consistent with the Fire Emblem GBA aesthetic.
  _drawTerrainDetail(g, tid, x, y) {
    const cx = x + TILE / 2, cy = y + TILE / 2;

    if (tid === T.GRASS) {
      // ── Grass: scattered "ε" marks (dark olive squiggles) ────────────────
      g.fillStyle(0x4a6810, 0.75);
      const _em = (mx, my) => {
        g.fillRect(mx+2, my,   4, 2); // top bar
        g.fillRect(mx,   my+2, 2, 2); // upper-left
        g.fillRect(mx+2, my+4, 4, 2); // mid bar
        g.fillRect(mx,   my+6, 2, 2); // lower-left
        g.fillRect(mx+2, my+8, 4, 2); // bot bar
      };
      _em(x+3,  y+4);
      _em(x+21, y+3);
      _em(x+7,  y+20);
      _em(x+23, y+21);

    } else if (tid === T.FOREST) {
      // ── Forest: pine canopy from above — dark star-shaped crown ──────────
      const tx = cx, ty = cy - 2;
      // Drop shadow
      g.fillStyle(0x0c2208, 0.7);
      g.fillCircle(tx + 2, ty + 3, 13);
      // Base canopy
      g.fillStyle(0x1a5010, 1);
      g.fillCircle(tx, ty, 13);
      // Star-shaped branch spokes (8 directions)
      g.fillStyle(0x245e14, 1);
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * Math.PI * 2 - Math.PI / 8;
        g.fillEllipse(tx + Math.cos(ang) * 8, ty + Math.sin(ang) * 8, 9, 6);
      }
      // Inner crown
      g.fillStyle(0x3a7820, 1);
      g.fillCircle(tx, ty, 7);
      // Highlight (upper-left)
      g.fillStyle(0x508a2c, 1);
      g.fillCircle(tx - 2, ty - 3, 4);
      // Trunk stub at bottom
      g.fillStyle(0x5a2c10, 1);
      g.fillRect(cx - 2, cy + 11, 4, 4);

    } else if (tid === T.MOUNTAIN) {
      // ── Mountain: rocky boulders from above ──────────────────────────────
      g.fillStyle(0x4a3828, 0.9);
      g.fillEllipse(cx - 2, cy + 4, 30, 20);
      g.fillStyle(0x686050, 1);
      g.fillEllipse(cx - 4, cy,     26, 18);
      g.fillStyle(0x7a7060, 1);
      g.fillEllipse(cx + 2, cy - 6, 20, 16);
      // Peak highlight
      g.fillStyle(0x9a9088, 0.8);
      g.fillEllipse(cx, cy - 7, 10, 8);
      // Snow cap
      g.fillStyle(0xe8e8f0, 0.7);
      g.fillCircle(cx, cy - 8, 4);

    } else if (tid === T.WATER) {
      // ── Water: horizontal wave bands + sparkles ──────────────────────────
      g.fillStyle(0x1060a0, 0.35);
      g.fillRect(x + 1, y + 5,  TILE - 2, 5);
      g.fillRect(x + 1, y + 15, TILE - 2, 5);
      g.fillRect(x + 1, y + 25, TILE - 2, 5);
      // Wave crests (lighter)
      g.fillStyle(0x58b8e8, 0.55);
      g.fillRect(x + 3,  y + 6,  10, 2);
      g.fillRect(x + 20, y + 6,  12, 2);
      g.fillRect(x + 7,  y + 16, 12, 2);
      g.fillRect(x + 18, y + 16, 10, 2);
      g.fillRect(x + 3,  y + 26, 10, 2);
      g.fillRect(x + 21, y + 26, 11, 2);

    } else if (tid === T.ROAD) {
      // ── Road: worn-path center stripe, minimal (keep it clean) ───────────
      g.fillStyle(0x9a7018, 0.22);
      g.fillRect(cx - 3, y + 2, 6, TILE - 4);

    } else if (tid === T.SAND) {
      // ── Sand: wind-blown ellipse ripples ─────────────────────────────────
      g.fillStyle(0xa88820, 0.38);
      g.fillEllipse(cx - 7, cy - 5, 22, 6);
      g.fillEllipse(cx + 5, cy + 4, 18, 5);
      g.fillEllipse(cx - 4, cy + 1, 20, 5);

    } else if (tid === T.CASTLE) {
      // ── Castle: stone floor — staggered mortar grid ──────────────────────
      g.fillStyle(0x485060, 0.55);
      // Horizontal mortar
      g.fillRect(x, y + 12, TILE, 1);
      g.fillRect(x, y + 24, TILE, 1);
      // Vertical mortar (staggered rows)
      g.fillRect(cx,      y + 1,  1, 11);
      g.fillRect(cx - 9,  y + 13, 1, 11);
      g.fillRect(cx + 9,  y + 13, 1, 11);
      g.fillRect(cx,      y + 25, 1, 10);
      // Tile highlight corners
      g.fillStyle(0x8898b0, 0.2);
      g.fillRect(x + 1,    y + 1,  5, 3);
      g.fillRect(cx + 1,   y + 1,  5, 3);
      g.fillRect(x + 1,    y + 13, 5, 3);
      g.fillRect(cx + 1,   y + 13, 5, 3);
      g.fillRect(x + 1,    y + 25, 5, 3);
      g.fillRect(cx + 1,   y + 25, 5, 3);

    } else if (tid === T.VILLAGE) {
      // ── Village: house from above — roof ridge + walls + door ────────────
      // Outer wall / floor
      g.fillStyle(0xd09060, 0.9);
      g.fillRect(cx - 10, cy - 6, 20, 16);
      // Roof (darker, triangle peak)
      g.fillStyle(0x7a3828, 1);
      g.fillTriangle(cx - 11, cy - 6, cx, cy - 15, cx + 11, cy - 6);
      // Roof highlight
      g.fillStyle(0x9a5040, 0.8);
      g.fillTriangle(cx - 5, cy - 8, cx, cy - 14, cx + 5, cy - 8);
      // Door
      g.fillStyle(0x583818, 0.9);
      g.fillRect(cx - 2, cy + 4, 4, 6);
      // Windows
      g.fillStyle(0x80b0d0, 0.75);
      g.fillRect(cx - 9, cy - 2, 4, 4);
      g.fillRect(cx + 5, cy - 2, 4, 4);

    } else if (tid === T.SNOW) {
      // ── Snow: small cross-shaped snowflakes scattered ─────────────────────
      g.fillStyle(0xd8eef8, 0.72);
      [[-10,-8],[6,-10],[-4,4],[10,2],[-8,10],[4,10],[0,-2],[8,-4]].forEach(([dx,dy]) => {
        g.fillRect(cx + dx - 1, cy + dy - 3, 2, 6);
        g.fillRect(cx + dx - 3, cy + dy - 1, 6, 2);
      });
      // Snow mound
      g.fillStyle(0xe8f4fc, 0.35);
      g.fillEllipse(cx - 6, cy + 4, 16, 8);
      g.fillEllipse(cx + 5, cy - 4, 13, 7);

    } else if (tid === T.BRIDGE) {
      // ── Bridge: water below + horizontal wooden planks ───────────────────
      // Water hint
      g.fillStyle(0x2060a8, 0.45);
      g.fillRect(x, y, TILE, TILE);
      // Planks (5 horizontal strips)
      g.fillStyle(0xa87030, 1);
      for (let i = 0; i < 5; i++) {
        g.fillRect(x + 2, y + 2 + i * 7, TILE - 4, 5);
      }
      // Plank gaps
      g.fillStyle(0x5c3010, 0.9);
      for (let i = 0; i < 4; i++) {
        g.fillRect(x + 2, y + 7 + i * 7, TILE - 4, 1);
      }
      // Side railings
      g.fillStyle(0x784018, 0.95);
      g.fillRect(x,            y, 3, TILE);
      g.fillRect(x + TILE - 3, y, 3, TILE);

    } else if (tid === T.WALL) {
      // ── Wall: GBA-style 3D stone battlement ──────────────────────────────
      // Top face (lighter — viewed from slightly above)
      g.fillStyle(0xb0bcc8, 1);
      g.fillRect(x, y, TILE, 11);
      // Column cap highlights (3 evenly-spaced pillars)
      g.fillStyle(0xc8d4e0, 1);
      g.fillRect(x + 1,  y + 1, 9, 9);
      g.fillRect(x + 14, y + 1, 8, 9);
      g.fillRect(x + 27, y + 1, 8, 9);
      // Column cap shine
      g.fillStyle(0xdce8f0, 0.8);
      g.fillRect(x + 2,  y + 1, 5, 3);
      g.fillRect(x + 15, y + 1, 5, 3);
      g.fillRect(x + 28, y + 1, 5, 3);
      // Front face (medium stone)
      g.fillStyle(0x7078a0, 1);
      g.fillRect(x, y + 11, TILE, 19);
      // Column fronts (slightly recessed / darker)
      g.fillStyle(0x586088, 1);
      g.fillRect(x + 1,  y + 12, 9,  17);
      g.fillRect(x + 14, y + 12, 8,  17);
      g.fillRect(x + 27, y + 12, 8,  17);
      // Mortar lines on front face
      g.fillStyle(0x2c3440, 1);
      g.fillRect(x,      y + 11, TILE, 1);  // top joint
      g.fillRect(x,      y + 22, TILE, 1);  // mid joint
      g.fillRect(x + 10, y + 12, 1,   17);  // vertical joints
      g.fillRect(x + 22, y + 12, 1,   17);
      g.fillRect(x + 5,  y + 22, 1,   8);   // offset verticals
      g.fillRect(x + 17, y + 22, 1,   8);
      g.fillRect(x + 29, y + 22, 1,   8);
      // Bottom shadow
      g.fillStyle(0x1c2430, 1);
      g.fillRect(x, y + 30, TILE, 6);

    } else if (tid === T.OASIS) {
      // ── Oasis: water pool + palm fronds from above ────────────────────────
      g.fillStyle(0x1878b8, 0.65);
      g.fillCircle(cx, cy + 4, 9);
      g.fillStyle(0x38a0d0, 0.45);
      g.fillCircle(cx - 2, cy + 3, 5);
      // Palm fronds (6 radiating leaves)
      g.fillStyle(0x28882c, 1);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        g.fillEllipse(cx + Math.cos(a) * 9, cy - 4 + Math.sin(a) * 7, 9, 5);
      }
      // Trunk
      g.fillStyle(0x8a4820, 1);
      g.fillCircle(cx, cy - 4, 3);
    }
  }

  _buildHighlightLayers() {
    this._hlMove  = this.add.graphics(); // Blue: movement
    this._hlAtk   = this.add.graphics(); // Red: attack
    this._hlHeal  = this.add.graphics(); // Green: heal
    this._hlSel   = this.add.graphics(); // Yellow: selected unit
    this._hlCursor= this.add.graphics(); // White pulse: cursor
  }

  _buildGridOverlay() {
    const g = this.add.graphics();
    g.lineStyle(1, 0x000000, 0.08);
    const mapCols = this.mapGrid[0].length;
    const mapRows = this.mapGrid.length;
    for (let col = 0; col <= mapCols; col++) {
      g.lineBetween(GRID_X + col*TILE, GRID_Y, GRID_X + col*TILE, GRID_Y + mapRows*TILE);
    }
    for (let row = 0; row <= mapRows; row++) {
      g.lineBetween(GRID_X, GRID_Y + row*TILE, GRID_X + mapCols*TILE, GRID_Y + row*TILE);
    }
  }

  _buildUnitSprites() {
    this._unitLayer = this.add.container(0, 0);
    this.units.forEach(u => this._createUnitSprite(u));
  }

  _createUnitSprite(unit) {
    const sz = unit.tileSize || 1;
    const { x, y } = this._unitCenter(unit);
    const r = TILE / 2 - 3;
    const halfFoot = (sz * TILE) / 2;

    // Resolve sprite key first so scale can adapt to PNG vs SVG dimensions.
    const sprKey = getSpriteKey(unit, this);

    // Scale: 2x2 bosses fill their footprint; PNG chibi/dark sprites fill one tile;
    // SVG sprites (64×64) fit inside the ring circle.
    let sprScale;
    if (sz === 2) {
      sprScale = (TILE * 1.85) / 64;
    } else if (sprKey.startsWith('inn_') && this.textures.exists(sprKey)) {
      const naturalW = (this.textures.getFrame(sprKey) || { realWidth: 64 }).realWidth;
      sprScale = TILE / naturalW;
    } else {
      const spriteSize = (r * 2 + 2); // fill ~94% of ring (ringR diameter - 2)
      sprScale = spriteSize / 64;
    }

    let sprite;
    if (this.textures.exists(sprKey)) {
      sprite = this.add.image(x, y - 1, sprKey).setOrigin(0.5).setScale(sprScale);
    } else {
      sprite = this.add.text(x, y - 2, unit.emoji, { fontSize: sz === 2 ? '40px' : '26px' }).setOrigin(0.5);
    }

    // 1x1 boss units render 60% larger; 2x2 bosses already fill their footprint via sprScale
    if (unit.isBoss && sz === 1 && sprite.setScale) {
      sprite.setScale(sprScale * 1.6);
    }

    // ── HP bar background ───────────────────────────────────────────────────
    const hpBarW = sz * TILE - 6;
    const hpBg = this.add.rectangle(x, y + halfFoot + 3, hpBarW, 4, 0x000000, 0.7);

    // ── HP bar foreground ───────────────────────────────────────────────────
    const hpBar = this.add.rectangle(x - hpBarW / 2, y + halfFoot + 3, hpBarW, 4, PAL.HP_G, 1);
    hpBar.setOrigin(0, 0.5);

    // ── Drop shadow (rendered below everything else) ─────────────────────────
    const shadow = this.add.ellipse(x, y + halfFoot - 2, sz * TILE - 8, 10, 0x000000, 0.45);

    // ── Class-colored ring background ──────────────────────────────────────
    const ringColor = CLASS_RING_COLOR[unit.unitClass] ||
      (unit.team === 'player' ? PAL.PLAYER_GLOW :
       unit.team === 'neutral' ? 0x44ff88 : PAL.ENEMY_GLOW);
    const ringR = sz === 2 ? TILE * sz / 2 - 2 : r + 2;
    const spriteBg = this.add.circle(x, y, ringR, ringColor, 0.18);
    // Bosses get a thicker, brighter inner ring
    spriteBg.setStrokeStyle(unit.isBoss ? 5 : 3, ringColor, unit.isBoss ? 1.0 : 0.85);

    // ── Boss outer glow ring (pulsing) ───────────────────────────────────────
    let bossGlow = null;
    if (unit.isBoss) {
      const glowR = TILE * sz - 4;
      bossGlow = this.add.circle(x, y, glowR, ringColor, 0.0);
      bossGlow.setStrokeStyle(3, ringColor, 0.55);
      this.tweens.add({
        targets: bossGlow,
        strokeAlpha: { from: 0.55, to: 0.0 },
        radius:      { from: glowR, to: glowR + 10 },
        duration: 1200,
        repeat: -1,
        ease: 'Sine.easeOut',
      });
    }

    // ── Class badge icon (below hp bar) ─────────────────────────────────────
    const badgeColor = unit.team === 'player' ? '#88bbff'
                     : unit.team === 'neutral' ? '#88ffaa'
                     : '#ff8888';
    const badgeLabel = CLASS_ICON[unit.unitClass] || unit.unitClass.slice(0, 4).toUpperCase();
    const badge = this.add.text(x, y + halfFoot + 10, badgeLabel, {
      fontSize: '9px',
      color: badgeColor,
      fontFamily: 'Courier New, monospace',
      fontStyle: 'bold',
    }).setOrigin(0.5, 0);

    unit.shadow    = shadow;
    unit.bossGlow  = bossGlow;
    unit.spriteBg  = spriteBg;
    unit.sprite    = sprite;
    unit.hpBarBg   = hpBg;
    unit.hpBar     = hpBar;
    unit.badge     = badge;

    const layerItems = [shadow];
    if (bossGlow) layerItems.push(bossGlow);
    layerItems.push(spriteBg, sprite, hpBg, hpBar, badge);
    this._unitLayer.add(layerItems);
    this._updateHPBar(unit);

    // ── Idle bob animation ─────────────────────────────────────────────────
    // Player units gently float up and down to signal readiness
    if (unit.team === 'player') {
      this._startIdleBob(unit);
    }
  }

  // Gentle idle float for player units (stored so it can be killed on act)
  _startIdleBob(unit) {
    if (!unit.sprite) return;
    const baseY = unit.sprite.y;
    const bobTween = this.tweens.add({
      targets: unit.sprite,
      y: { from: baseY - 2, to: baseY + 2 },
      duration: 900,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
      delay: Math.random() * 600, // stagger so units don't all bob in sync
    });
    unit._bobTween = bobTween;
  }

  _stopIdleBob(unit) {
    if (unit._bobTween) {
      unit._bobTween.stop();
      unit._bobTween = null;
      // Snap sprite back to its correct y
      if (unit.sprite) {
        const { y } = this._unitCenter(unit);
        unit.sprite.setY(y - 1);
      }
    }
  }

  // Bounce-pop animation when a unit is selected
  _bounceSprite(unit) {
    if (!unit.sprite) return;
    this._stopIdleBob(unit);
    this.tweens.add({
      targets: unit.sprite,
      scaleX: { from: unit.sprite.scaleX * 1.25, to: unit.sprite.scaleX },
      scaleY: { from: unit.sprite.scaleY * 1.25, to: unit.sprite.scaleY },
      duration: 220,
      ease: 'Back.easeOut',
    });
  }

  _updateHPBar(unit) {
    if (!unit.hpBar) return;
    const sz = unit.tileSize || 1;
    const pct = unit.hp / unit.maxHp;
    const maxW = sz * TILE - 6;
    unit.hpBar.width = maxW * pct;
    unit.hpBar.fillColor = pct > 0.5 ? PAL.HP_G : pct > 0.25 ? PAL.HP_Y : PAL.HP_R;
    const { x } = this._unitCenter(unit);
    unit.hpBar.setX(x - maxW / 2);
    unit.hpBarBg.setX(x);
  }

  _updateSpritePos(unit) {
    if (!unit.sprite) return;
    const sz = unit.tileSize || 1;
    const { x, y } = this._unitCenter(unit);
    const halfFoot = (sz * TILE) / 2;
    if (unit.bossGlow) unit.bossGlow.setPosition(x, y);
    if (unit.spriteBg) unit.spriteBg.setPosition(x, y);
    if (unit.shadow) unit.shadow.setPosition(x, y + halfFoot - 2);
    unit.sprite.setPosition(x, y - 1);
    unit.hpBarBg.setPosition(x, y + halfFoot + 3);
    const hpBarW = sz * TILE - 6;
    unit.hpBar.setX(x - hpBarW / 2);
