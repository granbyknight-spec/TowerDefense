'use strict';
// =============================================================================
// Puppy Force — ComicScene.js
// Manga/anime-style inter-chapter cutscene using chibi portrait assets.
//
// Layout (top→bottom, all panels visible at once, appear sequentially):
//   Panel A — full-width  (victory line 1)
//   Panel B — left half   (victory line 2)
//   Panel C — right half  (villain reveal)
//   Panel D — full-width  (chapter title card)
// =============================================================================

class ComicScene extends Phaser.Scene {
  constructor() { super({ key: 'ComicScene' }); }

  init(data) {
    this.nextChapter = data.chapter;
    this.currentChap = data.currentChap;
    this.saveData    = data.saveData;
    this._done       = false;
  }

  // ---------------------------------------------------------------------------
  preload() {
    AudioManager.preloadMusic(this);

    const ENEMY_IDS = [
      'ALLEY_CAT', 'SIAMESE_ASSASSIN', 'LYNX_RANGER', 'SNOW_LEOPARD',
      'RIVER_PANTHER', 'SAND_CAT_KING', 'PERSIAN_QUEEN', 'CAT_EMPEROR',
      'TIGER_GENERAL', 'PERSIAN_SORCERER', 'SCOUT_CAT',
    ];
    ENEMY_IDS.forEach(id => {
      const key = `enemy_png_${id}`;
      if (!this.textures.exists(key))
        try { this.load.image(key, `assets/enemies/${id.toLowerCase()}_v1.png`); } catch (_) {}
    });

    const PLAYER_IDS = [
      'PUPPY_KNIGHT', 'CORGI_HEALER', 'LABRADOR_SCOUT', 'BEAGLE_ARCHER',
      'BULLDOG_TANK', 'POODLE_MAGE', 'HUSKY_RIDER', 'TERRIER_THIEF',
      'FOX_SCOUT', 'DOG_PALADIN', 'OTTER_ALLY',
    ];
    PLAYER_IDS.forEach(id => {
      const key = `player_png_${id}`;
      if (!this.textures.exists(key))
        try { this.load.image(key, `assets/characters/${id.toLowerCase()}_chibi_v1.png`); } catch (_) {}
    });

    // Manga panel background images (generated by scripts/generate-panels.js)
    // assets/panels/ch<N>_<slot>_v1.png — used as atmospheric BGs behind chibi portraits
    for (let ch = 1; ch <= 7; ch++) {
      ['hero', 'ally', 'villain'].forEach(slot => {
        const key = `panel_bg_${ch}_${slot}`;
        if (!this.textures.exists(key))
          try { this.load.image(key, `assets/panels/ch${ch}_${slot}_v1.png`); } catch (_) {}
      });
    }
  }

  // ---------------------------------------------------------------------------
  create() {
    const W = GAME_W, H = GAME_H;
    AudioManager.playMusic(this, 'overworld', 0.4);

    // Manga parchment background (fills gutters between panels)
    this.add.rectangle(W / 2, H / 2, W, H, 0xd8ceb8).setDepth(0);

    const beats  = this._collectBeats();
    const panels = this._computeLayout(beats, W, H);

    this._buildSkipButton(W);

    // Stagger each panel's reveal: 0 / 1700 / 3000 / 4100 ms
    const STAGGER = [0, 1700, 3000, 4100];
    panels.forEach((panel, i) => {
      this._renderPanel(panel, STAGGER[i] ?? (i * 1300));
    });

    // Auto-advance 2.8 s after the last panel appears
    const lastDelay = STAGGER[panels.length - 1] ?? ((panels.length - 1) * 1300);
    this.time.delayedCall(lastDelay + 2800, () => this._advance());
  }

  // ---------------------------------------------------------------------------
  // Build up to 3 content beats + 1 title card from chapter data
  _collectBeats() {
    const cur  = CHAPTERS[(this.currentChap || 1) - 1] || {};
    const next = CHAPTERS[(this.nextChapter  || 2) - 1] || {};
    const vict = (cur.victory  || []).slice(0, 2);
    const intr =  next.intro   || [];

    const beats = [];
    const curChap  = this.currentChap || 1;
    const nextChap = this.nextChapter  || 2;

    // Victory lines (heroes reflecting on the win)
    vict.forEach((line, i) => {
      beats.push({
        speaker:  line.speaker,
        text:     line.text,
        portrait: line.portrait || '🐶',
        key:      SPEAKER_PORTRAIT_KEY[line.speaker] || null,
        villain:  false,
        bgKey:    `panel_bg_${curChap}_${i === 0 ? 'hero' : 'ally'}`,
      });
    });

    // One villain/boss line from the next chapter's intro
    const VILLAIN_WORDS = [
      'Cat', 'Emperor', 'Queen', 'General', 'Assassin',
      'Panther', 'Leopard', 'Lynx', 'Sorcerer', 'Ranger',
    ];
    const villainLine = intr.find(
      l => VILLAIN_WORDS.some(w => (l.speaker || '').includes(w))
    );
    if (villainLine) {
      beats.push({
        speaker:  villainLine.speaker,
        text:     villainLine.text,
        portrait: villainLine.portrait || '😾',
        key:      SPEAKER_PORTRAIT_KEY[villainLine.speaker] || null,
        villain:  true,
        bgKey:    `panel_bg_${nextChap}_villain`,
      });
    }

    // Chapter title card always last
    beats.push({ type: 'title', chapterNum: this.nextChapter, title: next.title });
    return beats;
  }

  // ---------------------------------------------------------------------------
  // Map beats → panel rects.
  // Up to 3 content panels + 1 title; 3-panel layout uses full + two halves.
  _computeLayout(beats, W, H) {
    const SKIP_H = 30;
    const GAP    = 5;
    const totalH = H - SKIP_H;

    const content = beats.filter(b => !b.type);
    const title   = beats.find(b => b.type === 'title');
    const panels  = [];

    if (content.length === 0) {
      if (title) panels.push({ ...title, x: 0, y: SKIP_H, w: W, h: totalH });

    } else if (content.length === 1) {
      const h1 = Math.floor(totalH * 0.42);
      const h2 = totalH - h1 - GAP;
      panels.push({ ...content[0], x: 0, y: SKIP_H,               w: W, h: h1 });
      if (title) panels.push({ ...title, x: 0, y: SKIP_H+h1+GAP,  w: W, h: h2 });

    } else if (content.length === 2) {
      const h1 = Math.floor(totalH * 0.37);
      const h2 = Math.floor(totalH * 0.37);
      const h3 = totalH - h1 - h2 - GAP * 2;
      panels.push({ ...content[0], x: 0, y: SKIP_H,                    w: W, h: h1 });
      panels.push({ ...content[1], x: 0, y: SKIP_H+h1+GAP,             w: W, h: h2 });
      if (title) panels.push({ ...title, x: 0, y: SKIP_H+h1+h2+GAP*2, w: W, h: h3 });

    } else {
      // 3 content panels: full-top + side-by-side pair + title
      const h1 = Math.floor(totalH * 0.295);
      const h2 = Math.floor(totalH * 0.345);
      const h3 = totalH - h1 - h2 - GAP * 2;
      const hw  = Math.floor((W - GAP) / 2);

      panels.push({ ...content[0], x: 0,       y: SKIP_H,            w: W,         h: h1 });
      panels.push({ ...content[1], x: 0,       y: SKIP_H+h1+GAP,     w: hw,        h: h2 });
      panels.push({ ...content[2], x: hw+GAP,  y: SKIP_H+h1+GAP,     w: W-hw-GAP, h: h2 });
      if (title) panels.push({ ...title, x: 0, y: SKIP_H+h1+h2+GAP*2, w: W,        h: h3 });
    }

    return panels;
  }

  // ---------------------------------------------------------------------------
  // Render one panel (hidden), then animate it into view after `delay` ms.
  _renderPanel(panel, delay) {
    const container = this.add.container(panel.x, panel.y).setAlpha(0).setDepth(5);
    container.setScale(0.88);

    if (panel.type === 'title') {
      this._buildTitlePanel(container, panel.w, panel.h, panel.chapterNum, panel.title);
    } else {
      this._buildDialoguePanel(container, panel);
    }

    this.time.delayedCall(delay, () => {
      this.tweens.add({ targets: container, alpha: 1, scale: 1, duration: 380, ease: 'Back.out' });
    });
  }

  // ---------------------------------------------------------------------------
  _buildDialoguePanel(container, panel) {
    const W = panel.w, H = panel.h;
    const isVillain  = !!panel.villain;
    const isFullWide = W > 280;

    // Background: manga panel image if generated, otherwise gradient fallback
    const hasPanelBg = panel.bgKey && this.textures.exists(panel.bgKey);
    if (hasPanelBg) {
      container.add(
        this.add.image(W / 2, H / 2, panel.bgKey).setDisplaySize(W, H).setOrigin(0.5)
      );
      // Semi-transparent tint overlay for atmosphere + readability
      const overlay = this.add.graphics();
      overlay.fillStyle(isVillain ? 0x220000 : 0xddf5cc, isVillain ? 0.50 : 0.30);
      overlay.fillRect(0, 0, W, H);
      container.add(overlay);
    } else {
      // Gradient fallback (used until panel images are generated)
      const bg = this.add.graphics();
      if (isVillain) {
        bg.fillGradientStyle(0x220a0a, 0x3a0d0d, 0x3a0d0d, 0x220a0a, 1);
      } else {
        bg.fillGradientStyle(0xc4d8a8, 0xd8ecc0, 0xd8ecc0, 0xc4d8a8, 1);
      }
      bg.fillRect(0, 0, W, H);
      container.add(bg);
    }

    // Villain: radiating speed lines behind portrait
    if (isVillain) this._addSpeedLines(container, W, H);

    // Portrait position — hero faces right (default), villain faces left (flipped)
    const maxPortrait = Math.min(W / 2.4, H * 0.88);
    const portraitSz  = Math.round(maxPortrait);
    let px, py;
    if (isFullWide) {
      px = isVillain ? W * 0.76 : W * 0.20;
      py = H * 0.56;
    } else {
      px = W * 0.50;
      py = H * 0.70;
    }

    const key = panel.key;
    let portraitObj;
    if (key && this.textures.exists(key)) {
      portraitObj = this.add.image(px, py, key)
        .setDisplaySize(portraitSz, portraitSz)
        .setOrigin(0.5)
        .setFlipX(isVillain);
    } else {
      portraitObj = this.add.text(px, py, panel.portrait, {
        fontSize: Math.floor(portraitSz * 0.62) + 'px',
      }).setOrigin(0.5);
    }
    container.add(portraitObj);

    // Speech bubble
    this._addSpeechBubble(container, panel, W, H, isFullWide, isVillain);

    // Panel border (drawn last, on top)
    const border = this.add.graphics();
    border.lineStyle(3, 0x111111, 1);
    border.strokeRect(0, 0, W, H);
    if (isVillain) {
      border.lineStyle(2, 0xcc2222, 0.9);
      border.strokeRect(3, 3, W - 6, H - 6);
    }
    container.add(border);
  }

  _addSpeechBubble(container, panel, W, H, isFullWide, isVillain) {
    let bx, by, bw, bh;
    if (isFullWide) {
      bw = Math.floor(W * 0.56);
      bh = Math.floor(H * 0.72);
      bx = isVillain ? 8 : W - bw - 8;
      by = 8;
    } else {
      bx = 6; by = 6;
      bw = W - 12;
      bh = Math.floor(H * 0.44);
    }

    const g = this.add.graphics();
    g.fillStyle(0xffffff, 0.93);
    g.fillRoundedRect(bx, by, bw, bh, 9);
    g.lineStyle(2, isVillain ? 0xcc2222 : 0x222222, 1);
    g.strokeRoundedRect(bx, by, bw, bh, 9);
    container.add(g);

    // Speaker name
    const nameColor = isVillain ? '#cc2222' : '#224488';
    container.add(this.add.text(bx + 8, by + 7, panel.speaker, {
      fontSize: '11px', color: nameColor,
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
    }).setOrigin(0, 0));

    // Divider
    const div = this.add.graphics();
    div.lineStyle(1, 0xbbbbbb, 0.8);
    div.lineBetween(bx + 6, by + 23, bx + bw - 6, by + 23);
    container.add(div);

    // Dialogue
    container.add(this.add.text(bx + 8, by + 29, panel.text || '', {
      fontSize: '10px', color: '#111111',
      fontFamily: 'Nunito, Arial, sans-serif',
      wordWrap: { width: bw - 16 }, lineSpacing: 3,
    }).setOrigin(0, 0));
  }

  // Radiating speed lines contained within the panel bounds
  _addSpeedLines(container, W, H) {
    const g  = this.add.graphics();
    g.lineStyle(1, 0xaa1111, 0.20);
    const cx = W / 2, cy = H / 2;
    // Outer radius capped so lines don't exceed the shorter panel dimension
    const outer = Math.min(W, H) / 2 * 0.96;
    const inner = Math.min(W, H) / 2 * 0.22;
    for (let a = 0; a < 360; a += 10) {
      const rad = (a * Math.PI) / 180;
      g.lineBetween(
        cx + Math.cos(rad) * inner, cy + Math.sin(rad) * inner,
        cx + Math.cos(rad) * outer, cy + Math.sin(rad) * outer,
      );
    }
    container.add(g);
  }

  // ---------------------------------------------------------------------------
  _buildTitlePanel(container, W, H, chapterNum, title) {
    const bg = this.add.graphics();
    bg.fillStyle(0x080c18, 1);
    bg.fillRect(0, 0, W, H);
    container.add(bg);

    // Decorative horizontal rules flanking the text
    const deco = this.add.graphics();
    deco.lineStyle(1, 0x334466, 0.55);
    deco.lineBetween(30, H / 2 - 26, W - 30, H / 2 - 26);
    deco.lineBetween(30, H / 2 + 52, W - 30, H / 2 + 52);
    container.add(deco);

    container.add(this.add.text(W / 2, H / 2 - 32, `CHAPTER ${chapterNum}`, {
      fontSize: '12px', color: '#aabbcc', letterSpacing: 6,
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 2,
    }).setOrigin(0.5));

    container.add(this.add.text(W / 2, H / 2 + 10, title || '', {
      fontSize: '28px', color: '#f8d030',
      fontFamily: 'Nunito, Georgia, serif', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 4,
    }).setOrigin(0.5));

    const border = this.add.graphics();
    border.lineStyle(3, 0x111111, 1);
    border.strokeRect(0, 0, W, H);
    container.add(border);
  }

  // ---------------------------------------------------------------------------
  _buildSkipButton(W) {
    const btn = this.add.text(W - 14, 14, 'SKIP ▶▶', {
      fontSize: '12px', color: '#778899',
      fontFamily: 'Nunito, Arial, sans-serif', fontStyle: 'bold',
      backgroundColor: '#00000088',
      padding: { x: 6, y: 3 },
    }).setOrigin(1, 0).setDepth(20).setInteractive({ useHandCursor: true });

    btn.on('pointerover', () => btn.setColor('#aabbff'));
    btn.on('pointerout',  () => btn.setColor('#778899'));
    btn.on('pointerdown', () => this._advance());
  }

  // ---------------------------------------------------------------------------
  _advance() {
    if (this._done) return;
    this._done = true;
    const W = GAME_W, H = GAME_H;
    const overlay = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0).setDepth(50);
    this.tweens.add({
      targets: overlay, alpha: 1, duration: 600,
      onComplete: () => {
        this.scene.start('PrepScene', { chapter: this.nextChapter, saveData: this.saveData });
      },
    });
  }
}

'use strict';
// =============================================================================
// Puppy Force — PrepScene.js
// Pre-battle preparation / deployment screen
// Shown after CutsceneScene, before BattleScene
// =============================================================================

class PrepScene extends Phaser.Scene {
  constructor() { super({ key: 'PrepScene' }); }

  init(data) {
    this.chapter  = data.chapter;
    this.saveData = data.saveData;
  }

  preload() {
    AudioManager.preloadMusic(this);
    AudioManager.preloadSFX(this);
  }

  create() {
    AudioManager.playMusic(this, 'overworld', 0.35);
    const W = GAME_W, H = GAME_H;

    this._buildBackground(W, H);
    this._buildHeader(W);
    this._buildObjective(W);
    this._buildRoster(W, H);
    this._buildDeployButton(W, H);
  }

  // ---------------------------------------------------------------------------
  _buildBackground(W, H) {
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a1a, 0x0a0a1a, 0x0a1422, 0x0a1422, 1);
    bg.fillRect(0, 0, W, H);

    // Subtle decorative horizontal rules
    for (let i = 1; i < 5; i++) {
      const line = this.add.graphics();
      line.lineStyle(1, 0x223355, 0.18);
      line.lineBetween(0, i * (H / 5), W, i * (H / 5));
    }

    // Corner accent glyphs
    const accentStyle = { fontSize: '13px', color: '#223355', fontFamily: 'Nunito, Arial, sans-serif' };
    this.add.text(10,  10,  '✦', accentStyle);
    this.add.text(W - 22, 10,  '✦', accentStyle);
    this.add.text(10,  H - 22, '✦', accentStyle);
    this.add.text(W - 22, H - 22, '✦', accentStyle);
  }

  // ---------------------------------------------------------------------------
  _buildHeader(W) {
    const chap = CHAPTERS[this.chapter - 1] || {};

    // "CHAPTER N" line
    this.add.text(W / 2, 40, `⚔  CHAPTER ${this.chapter}`, {
      fontSize: '14px',
      color: '#aabbcc',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      letterSpacing: 4,
      stroke: '#000000',
      strokeThickness: 2,
    }).setOrigin(0.5);

    // Chapter title in gold
    this.add.text(W / 2, 70, chap.title || `Chapter ${this.chapter}`, {
      fontSize: '28px',
      color: '#f8d030',
      fontFamily: 'Nunito, Georgia, serif',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 4,
    }).setOrigin(0.5);

    // Subtitle / flavour in muted blue
    if (chap.subtitle) {
      this.add.text(W / 2, 104, chap.subtitle, {
        fontSize: '13px',
        color: '#7799bb',
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'bold',
        stroke: '#000000',
        strokeThickness: 1,
        wordWrap: { width: W - 40 },
        align: 'center',
      }).setOrigin(0.5);
    }

    // Thin gold divider
    const divider = this.add.graphics();
    divider.lineStyle(1, 0xf8d030, 0.35);
    divider.lineBetween(30, 124, W - 30, 124);
  }

  // ---------------------------------------------------------------------------
  _buildObjective(W) {
    const chap = CHAPTERS[this.chapter - 1] || {};

    // Build hint text: prefer explicit bossHint, fall back to bossId label, or generic
    let hintText = chap.bossHint || null;
    if (!hintText && chap.bossId) {
      // Turn "SNOW_LEOPARD" → "Snow Leopard"
      const bossName = chap.bossId
        .split('_')
        .map(w => w.charAt(0) + w.slice(1).toLowerCase())
        .join(' ');
      hintText = `Defeat the ${bossName}`;
    }
    if (!hintText) {
      hintText = 'Defeat all enemies';
    }

    this.add.text(W / 2, 144, 'OBJECTIVE:', {
      fontSize: '12px',
      color: '#f8d030',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      letterSpacing: 3,
      stroke: '#000000',
      strokeThickness: 1,
    }).setOrigin(0.5);

    this.add.text(W / 2, 164, hintText, {
      fontSize: '15px',
      color: '#ddeeff',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 2,
      wordWrap: { width: W - 60 },
      align: 'center',
    }).setOrigin(0.5);

    // Section header for roster
    const lineY = 190;
    const lineGfx = this.add.graphics();
    lineGfx.lineStyle(1, 0x334466, 0.6);
    lineGfx.lineBetween(20, lineY, W - 20, lineY);

    this.add.text(24, lineY - 9, 'YOUR FORCE', {
      fontSize: '11px',
      color: '#778899',
      fontFamily: 'Nunito, Arial, sans-serif',
      fontStyle: 'bold',
      letterSpacing: 3,
      stroke: '#000000',
      strokeThickness: 1,
    });
  }

  // ---------------------------------------------------------------------------
  _buildRoster(W, H) {
    // Deserialize roster; fall back gracefully if saveData is missing or empty
    let units = [];
    if (this.saveData && this.saveData.roster && this.saveData.roster.length > 0) {
      try {
        units = SaveManager.deserializeRoster(this.saveData.roster);
      } catch (e) {
        console.warn('PrepScene: could not deserialize roster', e);
      }
    }

    // If still empty, build a default fresh roster for display
    if (units.length === 0) {
      const defaultIds = ['PUPPY_KNIGHT', 'CORGI_HEALER', 'LABRADOR_SCOUT',
                          'POODLE_MAGE', 'HUSKY_RIDER', 'BEAGLE_ARCHER'];
      defaultIds.forEach(id => {
        const def = (typeof HERO_DEFS !== 'undefined' && HERO_DEFS[id]) ||
                    (typeof ALLY_DEFS !== 'undefined' && ALLY_DEFS[id]);
        if (def) {
          try { units.push(new Unit(def, 0, 0)); } catch (_) {}
        }
      });
    }

    // Show up to 8 units
    const display = units.slice(0, 8);

    const cardW  = W - 40;   // 440
    const cardH  = 46;
    const startY = 200;
    const gap    = 6;

    display.forEach((unit, i) => {
      const cardX = 20;
      const cardY = startY + i * (cardH + gap);

      // --- HP calculations
      const maxHp  = (unit.stats && unit.stats.maxHp) ? unit.stats.maxHp : (unit.baseStats && unit.baseStats.maxHp) || 1;
      const curHp  = (unit.hp !== undefined) ? unit.hp : maxHp;
      const hpPct  = Math.max(0, curHp / maxHp);
      const hpColor = hpPct > 0.5 ? '#44dd77' : (hpPct > 0.25 ? '#f8d030' : '#ee4444');

      // Card background
      const cardBg = this.add.graphics();
      cardBg.fillStyle(0x0d1e33, 0.95);
      cardBg.fillRoundedRect(cardX, cardY, cardW, cardH, 7);
      cardBg.lineStyle(1, 0x334466, 0.7);
      cardBg.strokeRoundedRect(cardX, cardY, cardW, cardH, 7);

      // Thin HP-coloured left accent bar
      const accentGfx = this.add.graphics();
      const accentCol = hpPct > 0.5 ? 0x44dd77 : (hpPct > 0.25 ? 0xf8d030 : 0xee4444);
      accentGfx.fillStyle(accentCol, 0.8);
      accentGfx.fillRoundedRect(cardX, cardY, 4, cardH, { tl: 7, bl: 7, tr: 0, br: 0 });

      // Emoji
      this.add.text(cardX + 14, cardY + cardH / 2, unit.emoji || '🐾', {
        fontSize: '24px',
      }).setOrigin(0, 0.5);

      // Name
      this.add.text(cardX + 50, cardY + 10, unit.name || 'Unknown', {
        fontSize: '14px',
        color: '#eeeeff',
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'bold',
        stroke: '#000000',
        strokeThickness: 1,
      });

      // Class
      const unitClass = (unit.unitClass) || (unit.def && unit.def.unitClass) || '';
      this.add.text(cardX + 50, cardY + 27, unitClass, {
        fontSize: '11px',
        color: '#8899bb',
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'bold',
      });

      // Level (right-aligned, mid-column)
      const level = (unit.stats && unit.stats.level) || (unit.baseStats && unit.baseStats.level) || 1;
      this.add.text(cardX + cardW - 90, cardY + cardH / 2, `Lv${level}`, {
        fontSize: '13px',
        color: '#aabbcc',
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'bold',
        stroke: '#000000',
        strokeThickness: 1,
      }).setOrigin(0, 0.5);

      // HP display  "##/##HP"
      this.add.text(cardX + cardW - 18, cardY + cardH / 2, `${curHp}/${maxHp}HP`, {
        fontSize: '13px',
        color: hpColor,
        fontFamily: 'Nunito, Arial, sans-serif',
        fontStyle: 'bold',
        stroke: '#000000',
        strokeThickness: 1,
      }).setOrigin(1, 0.5);
    });

    // Separator below roster
    const rosterBottomY = startY + display.length * (cardH + gap) + 6;
    const sepGfx = this.add.graphics();
    sepGfx.lineStyle(1, 0x334466, 0.4);
    sepGfx.lineBetween(20, rosterBottomY, W - 20, rosterBottomY);
  }

  // ---------------------------------------------------------------------------
  _buildDeployButton(W, H) {
    this._btn(W / 2, H - 66, '⚔  DEPLOY!', 0x1a4422, 0x33bb55, () => {
      this.scene.start('BattleScene', {
        chapter:  this.chapter,
        saveData: this.saveData,
      });
    });
  }

  // ---------------------------------------------------------------------------
  // Shared button helper — same style as VictoryScene._btn
  _btn(x, y, label, colorDark, colorLight, cb) {
    const W_btn = 260, H_btn = 52;
    const bg = this.add.graphics();
    bg.fillStyle(colorDark, 1);
    bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);
    bg.lineStyle(2, colorLight, 0.9);
    bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);

    const txt = this.add.text(x, y, label, {
      fontSize: '20px',
      color: '#ffffff',
      fontFamily: 'Nunito, Courier New, monospace',
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 2,
    }).setOrigin(0.5);

    const zone = this.add.zone(x, y, W_btn, H_btn).setInteractive({ useHandCursor: true });
    zone.on('pointerover', () => {
      bg.clear();
      bg.fillStyle(colorLight, 1);
      bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);
      bg.lineStyle(2, colorLight, 1);
      bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);
    });
    zone.on('pointerout', () => {
      bg.clear();
      bg.fillStyle(colorDark, 1);
      bg.fillRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);
      bg.lineStyle(2, colorLight, 0.9);
      bg.strokeRoundedRect(x - W_btn / 2, y - H_btn / 2, W_btn, H_btn, 10);
    });
    zone.on('pointerdown', () => {
      this.tweens.add({ targets: [bg, txt], scaleX: 0.95, scaleY: 0.95, duration: 80, yoyo: true });
      setTimeout(cb, 120);
    });
  }
}


// === js/pf/scenes/InnScene.js ===
'use strict';
// =============================================================================
// Puppy Force — InnScene.js
// Character gallery — review and compare Dark Fantasy vs Chibi sprite styles.
// SVG sprites always show as fallback; PixelLab PNGs auto-load when present.
//
// Texture key conventions:
//   inn_dark_<ID>  — PixelLab dark-fantasy sprite variant
//   inn_chibi_<ID> — PixelLab chibi sprite variant
//   spr_<...>      — SVG fallback (generated by SpriteSheet.js)
// =============================================================================

class InnScene extends Phaser.Scene {

  constructor() {
    super({ key: 'InnScene' });
  }

  // ---------------------------------------------------------------------------
  preload() {
    // Ensure SVG sprites are available even if BattleScene hasn't run yet
    preloadUnitSprites(this);

    // Suppress load errors for optional PixelLab PNGs
    this.load.on('loaderror', () => {});

    Object.keys(ENEMY_DEFS).forEach(id => {
      const lc = id.toLowerCase();
      this.load.image(`inn_dark_${id}`,  `assets/enemies/${lc}_pl_v1.png`);
      this.load.image(`inn_chibi_${id}`, `assets/enemies/${lc}_chibi_v1.png`);
    });
    Object.keys(HERO_DEFS).forEach(id => {
      const lc = id.toLowerCase();
      this.load.image(`inn_dark_${id}`,  `assets/characters/${lc}_sprite_v1.png`);
      this.load.image(`inn_chibi_${id}`, `assets/characters/${lc}_chibi_v1.png`);
    });
  }

  // ---------------------------------------------------------------------------
  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    this._filter    = 'all';   // 'all' | 'heroes' | 'enemies'
    this._style     = 'dark';  // 'dark' | 'chibi'
    this._scrollY   = 0;
    this._maxScroll = 0;
    this._dragging  = false;
    this._dragBase  = 0;

    // ── Background ────────────────────────────────────────────────────────────
    this.add.rectangle(W/2, H/2, W, H, 0x0b0a08);
    // Subtle warm grain
    for (let i = 0; i < 60; i++) {
      this.add.rectangle(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        1, 1, 0x3a2a10,
        Phaser.Math.FloatBetween(0.1, 0.5)
      );
    }

    // ── Header ────────────────────────────────────────────────────────────────
    // Warm header bar
    this.add.rectangle(W/2, 36, W, 72, 0x150f08);
    this.add.rectangle(W/2, 72, W, 2, 0xc8820a, 0.6);

    // Back button
    const backLabel = this.add.text(14, 20, '◀ BACK', {
      fontSize: '13px', color: '#aa9966',
      fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
    }).setInteractive({ useHandCursor: true }).setOrigin(0, 0);
    backLabel.on('pointerover', () => backLabel.setColor('#f8d030'));
    backLabel.on('pointerout',  () => backLabel.setColor('#aa9966'));
    backLabel.on('pointerdown', () => this.scene.start('TitleScene'));

    // Title
    this.add.text(W/2, 12, 'THE INN', {
      fontSize: '26px', color: '#f8d030',
      fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
      stroke: '#3a1a00', strokeThickness: 4,
    }).setOrigin(0.5, 0);

    this.add.text(W/2, 42, 'CHARACTER GALLERY  —  PUPPY FORCE', {
      fontSize: '10px', color: '#9a7a50',
      fontFamily: 'Courier New, monospace', letterSpacing: 1,
    }).setOrigin(0.5, 0);

    // Counter (shows how many sprites have been generated)
    const darkCount  = this._countLoaded('dark');
    const chibiCount = this._countLoaded('chibi');
    this.add.text(W/2, 56, `⚡ ${darkCount} dark  ✨ ${chibiCount} chibi  sprites generated`, {
      fontSize: '10px', color: '#886644',
      fontFamily: 'Courier New, monospace',
    }).setOrigin(0.5, 0);

    // ── Filter tabs ───────────────────────────────────────────────────────────
    this._filterBtns = {};
    const TABS = [
      { key: 'all',     label: 'ALL'       },
      { key: 'heroes',  label: '⚔ HEROES'  },
      { key: 'enemies', label: '🐱 ENEMIES' },
      { key: 'bosses',  label: '👑 BOSSES'  },
    ];
    const TAB_W = 100, TAB_H = 28, TAB_Y = 88, TAB_GAP = 4;
    const tabRowW = TABS.length * TAB_W + (TABS.length - 1) * TAB_GAP;
    let tabX = W/2 - tabRowW/2 + TAB_W/2;

    TABS.forEach(tab => {
      const gfx  = this.add.graphics();
      const txt  = this.add.text(tabX, TAB_Y, tab.label, {
        fontSize: '13px', color: '#ccaa66',
        fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
      }).setOrigin(0.5);
      const zone = this.add.zone(tabX, TAB_Y, TAB_W, TAB_H).setInteractive({ useHandCursor: true });
      this._filterBtns[tab.key] = { gfx, txt, zone, x: tabX, y: TAB_Y, w: TAB_W, h: TAB_H };

      zone.on('pointerover', () => {
        if (this._filter !== tab.key) { gfx.clear(); this._strokeTab(gfx, tabX, TAB_Y, TAB_W, TAB_H, 0xc8820a, 0.5); }
      });
      zone.on('pointerout', () => {
        if (this._filter !== tab.key) this._drawTab(tab.key, false);
      });
      zone.on('pointerdown', () => {
        if (this._filter === tab.key) return;
        this._filter = tab.key;
        this._scrollY = 0;
        this._refreshAllTabs();
        this._rebuildGrid();
      });
      tabX += TAB_W + TAB_GAP;
    });

    // ── Style toggle ──────────────────────────────────────────────────────────
    this._styleBtns = {};
    const STYLES = [
      { key: 'dark',  label: '⚡ DARK',  color: 0xff6644 },
      { key: 'chibi', label: '✨ CHIBI', color: 0xff88cc },
    ];
    const ST_W = 96, ST_H = 24, ST_Y = 118, ST_GAP = 6;
    const stRowW = STYLES.length * ST_W + (STYLES.length - 1) * ST_GAP;

    this.add.text(W/2 - stRowW/2 - 6, ST_Y, 'STYLE:', {
      fontSize: '10px', color: '#4a3820',
      fontFamily: 'Courier New, monospace',
    }).setOrigin(1, 0.5);

    let stX = W/2 - stRowW/2 + ST_W/2;
    STYLES.forEach(s => {
      const gfx  = this.add.graphics();
      const txt  = this.add.text(stX, ST_Y, s.label, {
        fontSize: '12px', color: '#886644',
        fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
      }).setOrigin(0.5);
      const zone = this.add.zone(stX, ST_Y, ST_W, ST_H).setInteractive({ useHandCursor: true });
      this._styleBtns[s.key] = { gfx, txt, zone, x: stX, y: ST_Y, w: ST_W, h: ST_H, color: s.color };

      zone.on('pointerdown', () => {
        if (this._style === s.key) return;
        this._style = s.key;
        this._scrollY = 0;
        this._refreshAllStyleBtns();
        this._rebuildGrid();
      });
      stX += ST_W + ST_GAP;
    });

    // ── Scrollable content area ───────────────────────────────────────────────
    const CONTENT_TOP = 134;
    const CONTENT_H   = H - CONTENT_TOP;
    this._cTop = CONTENT_TOP;
    this._cH   = CONTENT_H;

    // Scrollbar track (decorative)
    this._sbTrack = this.add.rectangle(W - 5, CONTENT_TOP + CONTENT_H/2, 3, CONTENT_H, 0x2a1a08, 0.7);
    this._sbThumb = this.add.rectangle(W - 5, CONTENT_TOP + 10, 3, 40, 0xc8820a, 0.6);

    // Scroll container
    this._grid = this.add.container(0, CONTENT_TOP);

    const maskGfx = this.add.graphics();
    maskGfx.fillRect(0, CONTENT_TOP, W, CONTENT_H);
    this._grid.setMask(new Phaser.Display.Masks.GeometryMask(this, maskGfx));

    // Initial render
    this._refreshAllTabs();
    this._refreshAllStyleBtns();
    this._rebuildGrid();
    this._setupInput();
  }

  // ---------------------------------------------------------------------------
  // ── Drawing helpers ─────────────────────────────────────────────────────────

  _strokeTab(gfx, x, y, w, h, color, alpha) {
    gfx.lineStyle(1.5, color, alpha);
    gfx.strokeRoundedRect(x - w/2, y - h/2, w, h, 4);
  }

  _drawTab(key, active) {
    const b = this._filterBtns[key];
    b.gfx.clear();
    if (active) {
      b.gfx.fillStyle(0xc8820a, 0.18);
      b.gfx.fillRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.gfx.lineStyle(2, 0xf8d030, 0.9);
      b.gfx.strokeRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.txt.setColor('#f8d030');
    } else {
      b.gfx.lineStyle(1.5, 0x3a2a10, 0.8);
      b.gfx.strokeRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.txt.setColor('#6a5030');
    }
  }

  _refreshAllTabs() {
    Object.keys(this._filterBtns).forEach(k => this._drawTab(k, k === this._filter));
  }

  _drawStyleBtn(key, active) {
    const b = this._styleBtns[key];
    b.gfx.clear();
    if (active) {
      b.gfx.fillStyle(b.color, 0.2);
      b.gfx.fillRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.gfx.lineStyle(2, b.color, 1.0);
      b.gfx.strokeRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.txt.setColor(key === 'dark' ? '#ffaa88' : '#ffaaee');
    } else {
      b.gfx.lineStyle(1.5, 0x3a2a10, 0.8);
      b.gfx.strokeRoundedRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 4);
      b.txt.setColor('#4a3420');
    }
  }

  _refreshAllStyleBtns() {
    Object.keys(this._styleBtns).forEach(k => this._drawStyleBtn(k, k === this._style));
  }

  // ---------------------------------------------------------------------------
  // ── Card grid ───────────────────────────────────────────────────────────────

  _getUnits() {
    const heroes  = Object.values(HERO_DEFS);
    const enemies = Object.values(ENEMY_DEFS);
    if (this._filter === 'heroes')  return heroes;
    if (this._filter === 'enemies') return enemies;
    if (this._filter === 'bosses')  return enemies.filter(e => e.isBoss);
    return [...heroes, ...enemies];
  }

  _hasTexture(key) {
    return this.textures.exists(key) &&
           this.textures.get(key).key !== '__MISSING';
  }

  _countLoaded(style) {
    const allIds = [
      ...Object.keys(HERO_DEFS),
      ...Object.keys(ENEMY_DEFS),
    ];
    return allIds.filter(id => this._hasTexture(`inn_${style}_${id}`)).length;
  }

  _getBestSpriteKey(unitDef) {
    // Prefer PixelLab PNG for current style
    const plKey = `inn_${this._style}_${unitDef.id}`;
    if (this._hasTexture(plKey)) return { key: plKey, isPixellab: true };
    // SVG fallback
    const svgKey = getSpriteKey(unitDef);
    if (this._hasTexture(svgKey)) return { key: svgKey, isPixellab: false };
    return null;
  }

  // Returns the ordered list of available style strings for a unit.
  // Priority order: 'dark', 'chibi', 'svg'. SVG is always included.
  _getCardStyles(def) {
    const styles = [];
    if (this._hasTexture(`inn_dark_${def.id}`))  styles.push('dark');
    if (this._hasTexture(`inn_chibi_${def.id}`)) styles.push('chibi');
    styles.push('svg');
    return styles;
  }

  // Resolve the texture key for a given style string and unit definition.
  // Returns { key, isPixellab } or null for SVG/emoji fallback.
  _getSpriteKeyForStyle(def, style) {
    if (style === 'dark' || style === 'chibi') {
      const plKey = `inn_${style}_${def.id}`;
      if (this._hasTexture(plKey)) return { key: plKey, isPixellab: true };
    }
    // SVG or fallback
    const svgKey = getSpriteKey(def);
    if (this._hasTexture(svgKey)) return { key: svgKey, isPixellab: false };
    return null;
  }

  _rebuildGrid() {
    this._grid.removeAll(true);

    const W      = this.scale.width;
    const COLS   = 3;
    const CARD_W = 146;
    const CARD_H = 188;
    const GAP_X  = 7;
    const GAP_Y  = 8;
    const MARGIN = Math.floor((W - (COLS * CARD_W + (COLS - 1) * GAP_X)) / 2);
    const PAD_T  = 10;

    const units = this._getUnits();
    units.forEach((def, idx) => {
      const col = idx % COLS;
      const row = Math.floor(idx / COLS);
      const cx  = MARGIN + col * (CARD_W + GAP_X) + CARD_W / 2;
      const cy  = PAD_T  + row * (CARD_H + GAP_Y) + CARD_H / 2;
      this._makeCard(def, cx, cy);
    });

    const rows     = Math.ceil(units.length / COLS);
    const totalH   = PAD_T + rows * CARD_H + (rows - 1) * GAP_Y + 20;
    this._maxScroll = Math.max(0, totalH - this._cH);
    this._scrollY   = Phaser.Math.Clamp(this._scrollY, 0, this._maxScroll);
    this._applyScroll();
  }

  _makeCard(def, cx, cy) {
    const CARD_W = 146;
    const CARD_H = 188;
    const isHero = def.team === 'player';
    const isBoss = !!def.isBoss;

    // Color scheme per team / boss status
    const bgColor  = isHero ? 0x080e1a : (isBoss ? 0x1a0808 : 0x0d0a12);
    const rimColor = isHero ? 0x4466aa : (isBoss ? 0xcc3310 : 0x553322);
    const rimW     = isBoss ? 2.5 : 1.5;
    const rimAlpha = isBoss ? 1.0 : 0.7;

    // ── Card background ───────────────────────────────────────────────────
    const bg = this.add.graphics();
    bg.fillStyle(bgColor, 0.97);
    bg.fillRoundedRect(cx - CARD_W/2, cy - CARD_H/2, CARD_W, CARD_H, 6);
    bg.lineStyle(rimW, rimColor, rimAlpha);
    bg.strokeRoundedRect(cx - CARD_W/2, cy - CARD_H/2, CARD_W, CARD_H, 6);
    this._grid.add(bg);

    // Inner subtle glow on bosses
    if (isBoss) {
      const glow = this.add.graphics();
      glow.lineStyle(6, rimColor, 0.08);
      glow.strokeRoundedRect(cx - CARD_W/2 + 3, cy - CARD_H/2 + 3, CARD_W - 6, CARD_H - 6, 5);
      this._grid.add(glow);
    }

    // ── Determine available styles for this card ──────────────────────────
    const availStyles = this._getCardStyles(def);

    // Use global art style as initial display; fall back to best available.
    const globalStyle = SaveManager.getArtStyle();
    const initialStyle = availStyles.includes(globalStyle) ? globalStyle : availStyles[0];

    // Mutable state for this card (mutated by the tap handler via closure)
    const cardState = { style: initialStyle };

    // ── Style glow overlay (drawn under sprite, above bg) ─────────────────
    // Redrawn on each style cycle. Only visible for non-SVG styles.
    const styleGlow = this.add.graphics();
    this._grid.add(styleGlow);

    const _drawStyleGlow = (style) => {
      styleGlow.clear();
      if (style === 'dark') {
        styleGlow.lineStyle(2, 0xff8844, 0.55);
        styleGlow.strokeRoundedRect(cx - CARD_W/2 + 2, cy - CARD_H/2 + 2, CARD_W - 4, CARD_H - 4, 5);
      } else if (style === 'chibi') {
        styleGlow.lineStyle(2, 0xff88dd, 0.55);
        styleGlow.strokeRoundedRect(cx - CARD_W/2 + 2, cy - CARD_H/2 + 2, CARD_W - 4, CARD_H - 4, 5);
      }
      // svg: no glow (transparent bg)
    };
    _drawStyleGlow(cardState.style);

    // ── Team/role badge (top-right) ───────────────────────────────────────
    const roleBadge = isBoss ? '👑' : (isHero ? '⭐' : '');
    if (roleBadge) {
      this._grid.add(
        this.add.text(cx + CARD_W/2 - 12, cy - CARD_H/2 + 12, roleBadge, {
          fontSize: '12px',
        }).setOrigin(0.5)
      );
    }

    // ── Style badge (top-left) ────────────────────────────────────────────
    const STYLE_BADGE_Y = cy - CARD_H/2 + 10;
    const styleBadgeTxt = this.add.text(cx - CARD_W/2 + 6, STYLE_BADGE_Y, '', {
      fontSize: '8px',
      fontFamily: 'Courier New, monospace', fontStyle: 'bold',
      padding: { x: 3, y: 2 },
    }).setOrigin(0, 0);
    this._grid.add(styleBadgeTxt);

    // "tap to cycle" hint below the style badge
    const tapHint = this.add.text(cx - CARD_W/2 + 6, STYLE_BADGE_Y + 14, 'tap to cycle', {
      fontSize: '8px', color: '#776655',
      fontFamily: 'Courier New, monospace',
    }).setOrigin(0, 0);
    this._grid.add(tapHint);

    // Helper: update the style badge text/color
    const _updateStyleBadge = (style) => {
      if (style === 'svg') {
        styleBadgeTxt.setText('[SVG]').setColor('#778899').setBackgroundColor('#0d1218');
      } else if (style === 'chibi') {
        styleBadgeTxt.setText('[CHIBI]').setColor('#ff88dd').setBackgroundColor('#1a0014');
      } else {
        styleBadgeTxt.setText('[DARK]').setColor('#ff8844').setBackgroundColor('#200800');
      }
    };
    _updateStyleBadge(cardState.style);

    // ── Sprite image ──────────────────────────────────────────────────────
    // Center of sprite area: 66px from card top
    const sprY = cy - CARD_H/2 + 66;
    const texInfo = this._getSpriteKeyForStyle(def, cardState.style);

    // Light backdrop so transparent sprites are visible on dark cards
    const sprBg = this.add.graphics();
    sprBg.fillStyle(0xd8c8a8, 0.12);
    sprBg.fillRoundedRect(cx - 46, sprY - 46, 92, 92, 6);
    sprBg.lineStyle(1, 0xc8a060, 0.18);
    sprBg.strokeRoundedRect(cx - 46, sprY - 46, 92, 92, 6);
    this._grid.add(sprBg);

    // Mutable sprite display — replaced on style cycle
    let sprObj;
    const _buildSpriteObj = (ti) => {
      if (ti) {
        const baseSize = ti.isPixellab ? (isBoss ? 88 : 76) : (isBoss ? 68 : 58);
        return this.add.image(cx, sprY, ti.key).setDisplaySize(baseSize, baseSize);
      } else {
        return this.add.text(cx, sprY, def.emoji || '❓', {
          fontSize: '40px',
        }).setOrigin(0.5);
      }
    };
    sprObj = _buildSpriteObj(texInfo);
    this._grid.add(sprObj);

    // ── Style source label (below sprite) ────────────────────────────────
    const srcLabelTxt = this.add.text(cx, cy - CARD_H/2 + 112, '', {
      fontSize: '9px',
      fontFamily: 'Courier New, monospace', fontStyle: 'bold',
      padding: { x: 4, y: 2 },
    }).setOrigin(0.5, 0);
    this._grid.add(srcLabelTxt);

    // Helper: update the source label below the sprite
    const _updateSrcLabel = (style, ti) => {
      if (ti && ti.isPixellab) {
        const label = style === 'dark' ? '⚡ DARK' : '✨ CHIBI';
        const col   = style === 'dark' ? '#ff8844' : '#ff88ee';
        const bgCol = style === 'dark' ? '#200800' : '#1a0014';
        srcLabelTxt.setText(label).setColor(col).setBackgroundColor(bgCol);
      } else {
        srcLabelTxt.setText('⟳ SVG FALLBACK').setColor('#887755').setBackgroundColor('');
      }
    };
    _updateSrcLabel(cardState.style, texInfo);

    // ── Unit name ─────────────────────────────────────────────────────────
    const nameColor = isHero ? '#88aaee' : (isBoss ? '#ffaa77' : '#bb8866');
    this._grid.add(
      this.add.text(cx, cy - CARD_H/2 + 124, def.name || def.id, {
        fontSize: '13px', color: nameColor,
        fontFamily: 'Nunito, Courier New, monospace', fontStyle: 'bold',
        stroke: '#000000', strokeThickness: 2,
        wordWrap: { width: CARD_W - 12 }, align: 'center',
      }).setOrigin(0.5, 0)
    );

    // ── Class + level ────────────────────────────────────────────────────
    const lvl = def.baseStats ? def.baseStats.level : 1;
    this._grid.add(
      this.add.text(cx, cy - CARD_H/2 + 141, `${def.unitClass}  Lv.${lvl}`, {
        fontSize: '11px', color: '#aa9977',
        fontFamily: 'Courier New, monospace',
      }).setOrigin(0.5, 0)
    );

    // ── Mini stat bar ────────────────────────────────────────────────────
    if (def.baseStats) {
      const { maxHp: hp, atk, def: df } = def.baseStats;
      this._grid.add(
        this.add.text(cx, cy - CARD_H/2 + 154,
          `HP ${hp}  ATK ${atk}  DEF ${df}`, {
          fontSize: '11px', color: '#9a8866',
          fontFamily: 'Courier New, monospace',
        }).setOrigin(0.5, 0)
      );
    }

    // ── Art availability indicators ──────────────────────────────────────
    const darkReady  = this._hasTexture(`inn_dark_${def.id}`);
    const chibiReady = this._hasTexture(`inn_chibi_${def.id}`);
    const badgeY = cy + CARD_H/2 - 16;
    const badges = [];
    if (darkReady)  badges.push({ label: '⚡D', bg: '#1a0800', fg: '#ff8844' });
    if (chibiReady) badges.push({ label: '✨C', bg: '#1a0012', fg: '#ff88dd' });

    if (badges.length === 0) {
      this._grid.add(
        this.add.text(cx, badgeY, 'NO ART YET — GENERATE ↑', {
          fontSize: '10px', color: '#887755',
          fontFamily: 'Courier New, monospace',
        }).setOrigin(0.5)
      );
    } else {
      const bSpacing = 34;
      const bStartX  = cx - ((badges.length - 1) * bSpacing) / 2;
      badges.forEach((b, i) => {
        this._grid.add(
          this.add.text(bStartX + i * bSpacing, badgeY, b.label, {
            fontSize: '9px', color: b.fg,
            fontFamily: 'Courier New, monospace', fontStyle: 'bold',
            backgroundColor: b.bg, padding: { x: 4, y: 2 },
          }).setOrigin(0.5)
        );
      });
    }

    // ── Interactive tap-to-cycle ──────────────────────────────────────────
    // Use a transparent hit zone over the whole card so the card is tappable.
    const hitZone = this.add.rectangle(cx, cy, CARD_W, CARD_H)
      .setInteractive({ useHandCursor: true });
    this._grid.add(hitZone);

    // Track pointer-down position so we can distinguish tap from scroll drag.
    let _ptrDownX = null;
    let _ptrDownY = null;

    hitZone.on('pointerdown', (ptr) => {
      _ptrDownX = ptr.x;
      _ptrDownY = ptr.y;
    });

    hitZone.on('pointerup', (ptr) => {
      // Only treat as a tap if pointer hasn't moved more than 6px (not a scroll)
      if (_ptrDownX === null) return;
      const dx = Math.abs(ptr.x - _ptrDownX);
      const dy = Math.abs(ptr.y - _ptrDownY);
      _ptrDownX = null;
      _ptrDownY = null;
      if (dx > 6 || dy > 6) return;

      // Advance to next style in the available list
      const curIdx  = availStyles.indexOf(cardState.style);
      const nextIdx = (curIdx + 1) % availStyles.length;
      cardState.style = availStyles[nextIdx];

      // Resolve new texture
      const newTex = this._getSpriteKeyForStyle(def, cardState.style);

      // Swap sprite in-place: destroy old, add new
      sprObj.destroy();
      sprObj = _buildSpriteObj(newTex);
      // Insert before hitZone (last item) so hit zone stays on top
      this._grid.addAt(sprObj, this._grid.getIndex(hitZone));

      // Update decorative elements
      _updateStyleBadge(cardState.style);
      _updateSrcLabel(cardState.style, newTex);
      _drawStyleGlow(cardState.style);

      // Brief scale pulse: 0.95 → 1.0
      this.tweens.add({
        targets: [bg, sprBg, sprObj, styleBadgeTxt, srcLabelTxt],
        scaleX: { from: 0.95, to: 1.0 },
        scaleY: { from: 0.95, to: 1.0 },
        duration: 120,
        ease: 'Quad.easeOut',
      });
    });
  }

  // ---------------------------------------------------------------------------
  // ── Scroll ────────────────────────────────────────────────────────────────

  _applyScroll() {
    this._grid.setY(this._cTop - this._scrollY);
    this._updateScrollbar();
  }

  _updateScrollbar() {
    if (this._maxScroll <= 0) {
      this._sbThumb.setAlpha(0);
      return;
    }
    this._sbThumb.setAlpha(0.6);
    const trackH  = this._cH;
    const thumbH  = Math.max(30, (this._cH / (this._cH + this._maxScroll)) * trackH);
    const thumbY  = this._cTop + ((this._scrollY / this._maxScroll) * (trackH - thumbH)) + thumbH/2;
    this._sbThumb.setSize(3, thumbH).setY(thumbY);
  }

  _setupInput() {
    // Mouse wheel
    this.input.on('wheel', (ptr, objs, dx, dy) => {
      this._scrollY = Phaser.Math.Clamp(this._scrollY + dy * 0.55, 0, this._maxScroll);
      this._applyScroll();
    });

    // Pointer drag (mobile-friendly)
    this.input.on('pointerdown', ptr => {
      if (ptr.y < this._cTop) return;
      this._dragging = true;
      this._dragBase = ptr.y + this._scrollY;
    });
    this.input.on('pointermove', ptr => {
      if (!this._dragging) return;
      this._scrollY = Phaser.Math.Clamp(this._dragBase - ptr.y, 0, this._maxScroll);
      this._applyScroll();
    });
    this.input.on('pointerup',   () => { this._dragging = false; });
    this.input.on('pointerout',  () => { this._dragging = false; });
  }
}

// Show chapter title in UIScene after BattleScene starts
// (Wire this into BattleScene.create after UIScene launches)
const _origBattleCreate = BattleScene.prototype.create;
BattleScene.prototype.create = function() {
  _origBattleCreate.call(this);
  // Show chapter title card
  this.time.delayedCall(100, () => {
    const ui = this._getUI();
    if (ui) ui.showChapterTitle(this.chapterId);
  });
};

// =============================================================================
// Phaser Game Config
// =============================================================================

const config = {
  type: Phaser.AUTO,         // WebGL → Canvas fallback
  width:  GAME_W,
  height: GAME_H,
  backgroundColor: PAL.BG,
  parent: 'pf-container',

  scale: {
    mode:       Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },

  scene: [
    TitleScene,
    BattleScene,
    UIScene,
    VictoryScene,
    CutsceneScene,
    ComicScene,
    PrepScene,
    InnScene,
  ],

  audio: {
    disableWebAudio: true,
  },

  // Disable default right-click menu
  disableContextMenu: true,

  // Mobile-friendly input
  input: {
    touch: true,
  },

  // Renderer tweaks for crisp pixel look
  render: {
    antialias: false,
    pixelArt:  false,
  },
};

// Boot the game
const PuppyForceGame = new Phaser.Game(config);

// Prevent iOS double-tap zoom
document.addEventListener('touchend', e => e.preventDefault(), { passive: false });
